<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 安全策略：仅加载同源资源与 HTTPS 接口（AI 对话需要），禁止内联脚本与外部脚本注入 -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' https:; object-src 'none'; base-uri 'self';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ff8fb3" />
  <title>艾米的学习乐园</title>
  <style>
/* =========================================================
   艾米的学习乐园 — 全局样式
   设计基调：可爱粉色 / 圆角 / 大按钮（适合幼儿）
   响应式：桌面左右框架，移动端侧边栏抽屉化
   ========================================================= */
:root {
  --pink-50:  #fff5f8;
  --pink-100: #ffe6ef;
  --pink-200: #ffd0e0;
  --pink-300: #ffb3cf;
  --pink-400: #ff8fb3;
  --pink-500: #ff6fa3;
  --pink-600: #f04e8a;
  --purple:   #a06bff;
  --mint:     #46c9a3;
  --mint-d:   #2fae8c;
  --sun:      #ffce54;
  --sky:      #6cc4ff;
  --ink:      #5a3a4a;
  --ink-soft: #8a6a78;
  --line:     #ffd9e6;
  --card:     #ffffff;
  --shadow:   0 8px 24px rgba(255,111,163,.18);
  --radius:   20px;
  --radius-sm:14px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background:
    radial-gradient(circle at 12% 8%, #fff0f6 0, transparent 40%),
    radial-gradient(circle at 88% 12%, #fde6ff 0, transparent 42%),
    var(--pink-50);
  color: var(--ink);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ---------- 顶部栏 ---------- */
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 18px;
  background: linear-gradient(120deg, var(--pink-400), var(--pink-500));
  color: #fff;
  box-shadow: 0 4px 16px rgba(240,78,138,.28);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 20px; }
.brand-logo { font-size: 24px; }
.top-stats { display: flex; gap: 10px; margin-left: 8px; }
.stat {
  background: rgba(255,255,255,.22);
  border-radius: 16px; padding: 6px 12px;
  display: flex; flex-direction: column; align-items: center; line-height: 1.15;
  min-width: 64px;
}
.stat-ico { font-size: 18px; }
.stat-num { font-weight: 800; font-size: 18px; }
.stat-label { font-size: 11px; opacity: .9; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.top-date {
  background: rgba(255,255,255,.94);
  color: var(--purple, #7b3fb0);
  font-weight: 800; font-size: 14px; white-space: nowrap;
  border-radius: 999px; padding: 6px 14px;
  box-shadow: 0 2px 8px rgba(0,0,0,.12);
}
.festival-banner {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 18px;
  background: linear-gradient(90deg, #fff3c4, #ffd6e7);
  color: #a23b6b; font-weight: 700; font-size: 15px;
  border-bottom: 2px solid var(--pink-200, #ffd0e0);
  animation: fbpop .4s ease;
}
.festival-banner[hidden] { display: none; }
.fb-emoji { font-size: 22px; }
.fb-text b { color: #c2185b; }
@keyframes fbpop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
.cal-cell.no-check { cursor: default; opacity: .82; }
.cal-cell.no-check:hover { background: var(--pink-50, #fff0f6); }
.encourage {
  background: rgba(255,255,255,.92); color: var(--pink-600);
  padding: 8px 14px; border-radius: 16px; font-weight: 700; font-size: 14px;
  max-width: 240px; box-shadow: var(--shadow);
}
.settings-btn, .user-chip {
  background: rgba(255,255,255,.92); border: none; cursor: pointer;
  border-radius: 16px; padding: 6px 10px; display: flex; align-items: center; gap: 6px;
  color: var(--ink); font-weight: 700; box-shadow: var(--shadow);
}
.settings-btn { font-size: 20px; }
.user-avatar {
  width: 34px; height: 34px; display: grid; place-items: center;
  background: var(--pink-100); border-radius: 50%; font-size: 22px;
}
.user-name { font-size: 15px; }
.hamburger { display: none; background: rgba(255,255,255,.92); border: none; cursor: pointer;
  font-size: 22px; border-radius: 12px; width: 42px; height: 42px; color: var(--pink-600); }

/* ---------- 布局 ---------- */
.layout { display: flex; align-items: stretch; min-height: calc(100vh - 64px); }
.sidebar {
  width: 232px; flex: 0 0 232px;
  background: var(--card);
  border-right: 2px solid var(--line);
  padding: 16px 12px;
  display: flex; flex-direction: column;
}
.sidebar-title { font-weight: 800; color: var(--pink-600); padding: 4px 8px 10px; font-size: 15px; }
.nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.nav-list li {
  display: flex; align-items: center; gap: 10px;
  padding: 12px 14px; border-radius: var(--radius-sm);
  cursor: pointer; font-weight: 700; font-size: 16px; color: var(--ink-soft);
  transition: all .15s ease; border: 2px solid transparent;
}
.nav-list li .nav-ico { font-size: 22px; }
.nav-list li:hover { background: var(--pink-50); color: var(--ink); }
.nav-list li.active {
  background: linear-gradient(120deg, var(--pink-100), var(--pink-200));
  color: var(--pink-600); border-color: var(--pink-300);
}
.nav-list li .nav-badge {
  margin-left: auto; font-size: 11px; background: var(--pink-500); color: #fff;
  border-radius: 10px; padding: 1px 7px; font-weight: 800;
}
.sidebar-foot { margin-top: auto; text-align: center; color: var(--pink-400); font-weight: 700; padding-top: 14px; }

.content { flex: 1 1 auto; padding: 22px; overflow-y: auto; max-width: 1100px; }
.scrim { position: fixed; inset: 0; background: rgba(90,58,74,.4); z-index: 35; }

/* ---------- 通用组件 ---------- */
.card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); border: 2px solid var(--pink-100); margin-bottom: 18px;
}
.module-title { font-size: 24px; font-weight: 800; color: var(--pink-600); margin-bottom: 4px; }
.module-sub { color: var(--ink-soft); margin-bottom: 14px; font-size: 14px; }

.btn {
  border: none; cursor: pointer; border-radius: 16px; padding: 12px 18px;
  font-size: 16px; font-weight: 800; color: #fff; background: var(--pink-500);
  box-shadow: 0 4px 0 var(--pink-600); transition: transform .08s, box-shadow .08s;
}
.btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--pink-600); }
.btn-sm { padding: 8px 14px; font-size: 14px; border-radius: 13px; }
.btn-primary { background: var(--pink-500); box-shadow: 0 4px 0 var(--pink-600); }
.btn-mint { background: var(--mint); box-shadow: 0 4px 0 var(--mint-d); }
.btn-ghost { background: var(--pink-100); color: var(--pink-600); box-shadow: 0 4px 0 var(--pink-200); }
.btn-danger { background: #ff5a5a; color: #fff; box-shadow: 0 4px 0 #d63b3b; }
.btn:disabled { opacity: .55; cursor: not-allowed; }

.chip {
  display: inline-block; padding: 7px 13px; border-radius: 14px; cursor: pointer;
  background: var(--pink-50); color: var(--ink-soft); font-weight: 700; font-size: 14px;
  border: 2px solid transparent; margin: 3px;
}
.chip.active { background: var(--pink-200); color: var(--pink-600); border-color: var(--pink-400); }

.tip { color: var(--ink-soft); padding: 10px 0; }
.feedback { margin-top: 12px; padding: 12px 14px; border-radius: 14px; font-weight: 700; }
.feedback.ok { background: #e7faf1; color: var(--mint-d); }
.feedback.warn { background: #fff4e0; color: #c98a16; }
.rec-dot { display:inline-block; width:12px; height:12px; border-radius:50%; background:#ff5a5a; margin-right:6px; animation: blink 1s infinite; vertical-align: middle;}
.voice-btn.rec-on { background:#ff5a5a; color:#fff; border-color:#ff5a5a; }
/* 跟读等录音按钮：录音中变红 */
.btn.rec-on { background:#ff5a5a; color:#fff; border-color:#ff5a5a; }
.feedback.ai { background:#eef3ff; color:#3a59c7; border:1px solid #cdd9ff; }
@keyframes blink { 50% { opacity:.2; } }

/* 拼音字母表 */
.alpha-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(58px,1fr)); gap: 10px; }
.alpha-cell {
  background: var(--pink-50); border: 2px solid var(--pink-200); border-radius: 16px;
  padding: 12px 0; text-align: center; cursor: pointer; font-size: 24px; font-weight: 800;
  color: var(--pink-600); transition: transform .1s;
}
.alpha-cell:active { transform: scale(.92); }
.alpha-label { font-size: 11px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; }

/* 故事 */
.story-text { line-height: 2.4; font-size: 22px; margin: 14px 0; letter-spacing: 0.18em; user-select: none; }
.story-text .hl { background: #fff3a8; font-weight: 800; border-radius: 8px; padding: 2px 4px; cursor: pointer; }
.story-text .chr { display: inline-block; vertical-align: top; text-align: center; cursor: pointer; border-radius: 8px; padding: 2px 3px 0; margin: 0 1px; touch-action: manipulation; }
.story-text .chr .py { display: block; font-size: 12px; line-height: 1.15; color: #8a6a78; letter-spacing: 0; }
.story-text .chr:hover { background: var(--pink-100); }
.story-text .chr:active { background: var(--pink-200); }
.story-text .punc { color: var(--ink-soft); padding: 0 2px; }

/* 拼音组合游戏：拼对后展示字与图 */
.py-result { text-align: center; margin: 12px 0; }
.py-result-emoji { font-size: 64px; }
.py-result-char { font-size: 42px; font-weight: 800; color: var(--purple); }
.py-result-word { color: var(--ink-soft); font-size: 16px; }
.py-hint { margin-top: 8px; font-weight: 800; color: var(--pink-600); background: var(--pink-50); border-radius: 14px; padding: 10px 16px; display: inline-block; }

/* 录音状态与回放 */
.read-status { margin-left: 8px; font-weight: 700; color: var(--ink-soft); font-size: 14px; }

/* 拼音游戏 */
.tile-row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; justify-content: center; }
.tile {
  width: 64px; height: 64px; border-radius: 16px; background: var(--pink-100);
  display: grid; place-items: center; font-size: 30px; font-weight: 800; cursor: pointer;
  border: 3px solid var(--pink-300); color: var(--pink-600); user-select: none;
}
.tile.time-opt {
  width: auto; min-width: 78px; height: 56px; padding: 0 12px; font-size: 22px;
  white-space: nowrap; letter-spacing: 0.5px;
}
.tile.sel { background: var(--pink-400); color: #fff; transform: scale(1.05); }

/* 十格 */
.tenframe { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; max-width: 320px; }
.cell {
  aspect-ratio: 1; border-radius: 14px; border: 3px dashed var(--pink-200);
  background: var(--pink-50); display: grid; place-items: center; font-size: 30px; cursor: pointer;
}
.cell.filled { border-style: solid; background: var(--pink-100); }

/* 连线游戏 */
.match-wrap { display: flex; gap: 30px; justify-content: center; margin: 16px 0; flex-wrap: wrap; }
.match-col { display: flex; flex-direction: column; gap: 12px; }
.match-item {
  min-width: 110px; padding: 12px 14px; border-radius: 14px; background: var(--pink-50);
  border: 3px solid var(--pink-200); font-size: 22px; font-weight: 800; text-align: center; cursor: pointer;
  color: var(--pink-600); position: relative;
}
.match-item.picked { background: var(--pink-200); }
.match-item.done-ok { border-color: var(--mint); background: #e7faf1; }
.match-item.done-bad { border-color: #ff7a7a; background: #ffeaea; }
.match-item .mk { position: absolute; right: 8px; top: 6px; font-size: 18px; }

/* 英语词卡 */
.word-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px; }
.word-card {
  background: var(--pink-50); border: 3px solid var(--pink-200); border-radius: 18px;
  padding: 14px; text-align: center; cursor: pointer; position: relative;
}
.word-emoji { font-size: 52px; }
.word-en { font-weight: 800; font-size: 18px; color: var(--pink-600); margin-top: 6px; }
.word-cn { color: var(--ink-soft); font-size: 14px; }
.word-card .learn-badge { position: absolute; top: 8px; right: 8px; font-size: 16px; }

/* 诗词 */
.poem-nav { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 10px; align-items:center; }
.poem-search { flex: 1 1 160px; min-width: 140px; }
.poem-search input {
  width: 100%; padding: 9px 12px; border-radius: 12px; border: 2px solid var(--pink-200);
  font-size: 14px; outline: none;
}
.poem-line { font-size: 24px; line-height: 1.7; }
.poem-char { cursor: pointer; padding: 0 1px; border-radius: 6px; }
.poem-char:hover { background: var(--pink-100); }
.poem-pinyin { font-size: 15px; color: var(--purple); text-align: center; margin-bottom: 2px; }
.poem-meta { font-size: 14px; color: var(--ink-soft); }
.poem-img { font-size: 64px; text-align: center; margin: 8px 0; }
.poem-note { background: var(--pink-50); border-radius: 16px; padding: 16px; line-height: 1.9; font-size: 16px; margin-top: 12px; }
.poem-status { display: inline-block; padding: 4px 10px; border-radius: 12px; font-weight: 700; font-size: 13px; }
.poem-status.learned { background: #e7faf1; color: var(--mint-d); }
.poem-status.unlearned { background: var(--pink-100); color: var(--pink-600); }

/* 词库 */
.wb-count { float: right; background: var(--pink-200); color: var(--pink-600); border-radius: 12px; padding: 4px 12px; font-weight: 800; }
.wb-tag { display: inline-flex; align-items:center; gap:4px; background: var(--pink-50); border:2px solid var(--pink-200);
  border-radius: 12px; padding: 8px 12px; margin: 5px; font-size: 17px; font-weight: 700; color: var(--pink-600); cursor: pointer; }
.wb-tag .rm { color: #ff7a7a; margin-left: 4px; cursor: pointer; }
.wb-tag.wb-click:hover { background: var(--pink-100); border-color: var(--pink-300); transform: translateY(-1px); }
.wb-detail:empty { display: none; }
.wb-detail { margin-top: 12px; }
.wb-card { background: linear-gradient(120deg, var(--pink-50), #fff); border: 2px solid var(--pink-200);
  border-radius: 18px; padding: 16px; text-align: center; box-shadow: 0 4px 14px rgba(226,106,156,0.12); }
.wb-card.wb-poem { text-align: left; }
.wb-bigchar { font-size: 72px; font-weight: 800; color: var(--pink-600); line-height: 1.1; }
.wb-py { font-size: 22px; color: var(--purple); font-weight: 700; margin: 6px 0; }
.wb-mean { font-size: 18px; color: var(--ink-soft); margin-bottom: 10px; }
.wb-img { font-size: 64px; line-height: 1.1; }
.wb-word { font-size: 26px; font-weight: 800; color: var(--pink-600); margin: 6px 0; }
.wb-ptitle { font-size: 20px; font-weight: 800; color: var(--pink-600); margin-bottom: 8px; }

/* 奖励 */
.reward-tier { margin-bottom: 18px; }
.reward-tier h3 { color: var(--pink-600); margin: 6px 0; }
.reward-row {
  display: flex; align-items: center; gap: 12px; background: var(--pink-50);
  border: 2px solid var(--pink-200); border-radius: 16px; padding: 12px 14px; margin: 8px 0; flex-wrap: wrap;
}
.reward-row .r-ico { font-size: 34px; }
.reward-row .r-info { flex: 1 1 160px; }
.reward-row .r-have { font-weight: 800; color: var(--pink-600); }

/* 绘本 */
.book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px,1fr)); gap: 16px; }
.book-card { background: var(--card); border:3px solid var(--pink-200); border-radius: 18px; overflow: hidden; cursor: pointer; box-shadow: var(--shadow); }
/* 绘本已读：右上角绿色对钩（不挡住再次点击） */
.book-read-badge {
  position: absolute; top: 8px; right: 8px; z-index: 5;
  width: 26px; height: 26px; border-radius: 50%;
  background: #2ecc71; color: #fff; font-weight: 900; font-size: 16px;
  display: grid; place-items: center; line-height: 1;
  box-shadow: 0 2px 6px rgba(0,0,0,.18); border: 2px solid #fff;
}
.book-cover { height: 120px; display: grid; place-items: center; font-size: 56px; background: linear-gradient(120deg,var(--pink-100),var(--pink-200)); }
.book-name { font-weight: 800; color: var(--pink-600); padding: 10px 12px 12px; font-size: 17px; }
/* 绘本「今日新」标记 */
.book-new-badge {
  position: absolute; top: 8px; right: 8px; z-index: 5;
  background: linear-gradient(135deg,#ff9ec4,#ff6fa5); color: #fff;
  font-weight: 800; font-size: 13px; padding: 2px 10px; border-radius: 999px;
  box-shadow: 0 2px 6px rgba(255,111,165,.45); border: 2px solid #fff;
}
.book-reader { text-align: center; }
.book-page-img { font-size: 96px; margin: 10px 0; }
.book-page-text { font-size: 22px; line-height: 1.8; margin: 12px 0; }
.book-page-text .chr { display: inline-block; vertical-align: top; text-align: center; padding: 2px 2px 0; margin: 0 1px; }
.book-page-text .chr .py { display: block; font-size: 11px; line-height: 1.1; color: #8a6a78; }

/* 游戏 */
.game-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px,1fr)); gap: 16px; }
.game-card { background: var(--card); border:3px solid var(--pink-200); border-radius: 18px; padding: 18px; text-align:center; cursor:pointer; box-shadow: var(--shadow); }
.game-card .g-ico { font-size: 52px; }
.game-card .g-name { font-weight: 800; color: var(--pink-600); margin-top: 8px; font-size: 18px; }
.memory-board { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; max-width: 360px; margin: 14px auto; }
.mem-card { aspect-ratio:1; border-radius: 14px; background: var(--pink-200); display:grid; place-items:center; font-size: 38px; cursor:pointer; border:3px solid var(--pink-300); user-select:none; }
.mem-card.flip { background: #fff; }
.mem-card.hide { visibility: hidden; }
.color-target { font-size: 60px; margin: 10px 0; }

/* 日历打卡 */
.cal-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.cal-cell { aspect-ratio: 1; border-radius: 12px; border: 2px solid var(--pink-200); background: var(--pink-50);
  display: grid; place-items: center; font-weight: 700; cursor: pointer; position: relative; font-size: 15px; }
.cal-cell.checked { background: var(--pink-400); color: #fff; border-color: var(--pink-600); }
.cal-cell.today { outline: 3px solid var(--sun); }
.cal-cell .star { position:absolute; top:2px; right:3px; font-size:11px; }

/* 家长端 */
.report-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px,1fr)); gap: 14px; }
.report-card { background: linear-gradient(120deg,var(--pink-50),var(--pink-100)); border:2px solid var(--pink-200);
  border-radius: 18px; padding: 16px; text-align: center; }
.report-card .rc-num { font-size: 32px; font-weight: 800; color: var(--pink-600); }
.report-card .rc-label { color: var(--ink-soft); font-weight: 700; margin-top: 4px; }
.bar-chart { display: flex; align-items: flex-end; gap: 10px; height: 160px; padding: 10px; background: var(--pink-50); border-radius: 16px; }
.bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.bar { width: 70%; background: linear-gradient(var(--pink-400),var(--pink-600)); border-radius: 8px 8px 0 0; min-height: 4px; }
.bar-val { font-size: 12px; font-weight: 800; color: var(--pink-600); margin-bottom: 3px; }
.bar-day { font-size: 11px; color: var(--ink-soft); margin-top: 4px; }

/* 弹窗 */
.modal-mask { position: fixed; inset: 0; background: rgba(90,58,74,.45); display: grid; place-items: center; z-index: 60; padding: 16px; }
.modal-card { background: #fff; border-radius: 24px; padding: 24px; width: 100%; max-width: 420px; box-shadow: var(--shadow); max-height: 90vh; overflow:auto; }
.modal-title { font-size: 22px; font-weight: 800; color: var(--pink-600); margin-bottom: 14px; }
.modal-tip { color: var(--ink-soft); font-size: 13px; margin: -6px 0 14px; line-height: 1.6; }
.field-label { display:block; font-weight: 700; color: var(--ink); margin: 12px 0 6px; }
.text-input { width: 100%; padding: 11px 14px; border-radius: 14px; border: 2px solid var(--pink-200); font-size: 16px; outline: none; }
.text-input:focus { border-color: var(--pink-500); }
.avatar-grid { display: grid; grid-template-columns: repeat(6,1fr); gap: 8px; }
.avatar-grid span { aspect-ratio:1; display:grid; place-items:center; background: var(--pink-50); border-radius: 50%; font-size: 26px; cursor: pointer; border: 3px solid transparent; }
.avatar-grid span.sel { border-color: var(--pink-500); background: var(--pink-100); }
.modal-actions { display:flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }

/* 长按弹窗（汉字加入词库） */

.draw-ref { flex: 1 1 220px; min-width: 200px; max-width: 300px; background: #fff; border: 2px dashed var(--pink-300); border-radius: 16px; padding: 12px; text-align: center; max-height: 600px; overflow-y: auto; }
.draw-ref-head { font-weight: 800; color: var(--pink-600); margin-bottom: 8px; }
.draw-ref-gallery { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.draw-ref-card { background: var(--pink-50); border: 2px solid var(--pink-200); border-radius: 12px; padding: 6px; cursor: pointer; transition: transform .12s, border-color .12s, box-shadow .12s; }
.draw-ref-card:hover { transform: translateY(-2px); }
.draw-ref-card.on { border-color: var(--purple); background: #fff; box-shadow: 0 0 0 3px rgba(160,107,255,.25); }
.draw-ref-svg { background: #fff; border-radius: 10px; padding: 4px; }
.draw-ref-svg svg { display: block; margin: 0 auto; width: 100%; max-width: 110px; height: auto; }
.draw-ref-name { font-size: 13px; font-weight: 700; color: var(--ink); margin-top: 4px; }
.draw-ref-tip { font-size: 13px; color: var(--ink-soft); margin-top: 8px; }
.draw-canvas-wrap { flex: 2 1 360px; min-width: 300px; }
.draw-tools { background: transparent; border: none; border-radius: 16px; padding: 0; margin-bottom: 0; }
.tool-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 6px 0; }
.tool-btn.on { box-shadow: 0 0 0 3px var(--sun); }
.swatch { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--pink-200); cursor: pointer; }
.swatch.on { box-shadow: 0 0 0 3px var(--purple); transform: scale(1.1); }
.draw-canvas { width: 100%; max-width: 480px; height: auto; background: #fff; border: 3px solid var(--pink-300); border-radius: 16px; touch-action: none; display: block; }
.draw-hist-head { font-weight: 800; color: var(--pink-600); margin: 10px 0 8px; }
.draw-hist { display: flex; gap: 10px; flex-wrap: wrap; max-height: 300px; overflow: auto; }
.hist-item { width: 84px; cursor: pointer; text-align: center; position: relative; }
.hist-item img { width: 84px; height: 63px; object-fit: cover; border-radius: 10px; border: 2px solid var(--pink-200); }
.hist-date { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
.hist-del { position: absolute; top: -6px; right: -6px; background: #fff; border-radius: 50%; width: 24px; height: 24px; display: grid; place-items: center; font-size: 13px; box-shadow: 0 2px 6px rgba(0,0,0,.2); border: 1px solid var(--pink-200); }

/* 诗词配图（每句一张插画卡） */
.poem-imgs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 12px 0; }
.poem-img-card { background: linear-gradient(120deg, var(--pink-50), var(--pink-100)); border: 2px solid var(--pink-200); border-radius: 16px; padding: 12px; text-align: center; }
.poem-img-card .pic { font-size: 48px; }
.poem-img-card .cap { font-size: 14px; color: var(--ink-soft); margin-top: 6px; line-height: 1.5; }

/* 两图找不同 */
.diff-wrap { display: flex; gap: 24px; justify-content: center; flex-wrap: wrap; margin: 12px 0; }
.diff-col { text-align: center; }
.diff-cap { font-weight: 700; color: var(--pink-600); margin-bottom: 6px; }
.diff-board { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.diff-cell { width: 56px; height: 56px; display: grid; place-items: center; font-size: 30px; background: var(--pink-50); border: 2px solid var(--pink-200); border-radius: 12px; cursor: pointer; user-select: none; }
.diff-cell.ok { border-color: var(--mint); background: #e7faf1; }

/* ===================== 响应式 ===================== */
@media (max-width: 860px) {

/* ===== 新增模块样式（第五轮） ===== */
/* 五子棋 */
.gomoku-board { display:block; margin:10px auto; background:#fff8ec; border:3px solid #e3c9a6; border-radius:12px; max-width:100%; touch-action:none; }

.sud-cell.alt { background:#fff3f8; }

/* 图形认知 */
.shape-opt { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:12px; margin:12px 0; }
.shape-card { background:#fff; border:3px solid var(--pink-200); border-radius:14px; padding:10px; cursor:pointer; text-align:center; transition:transform .12s, border-color .12s; }
.shape-card:hover { transform:translateY(-2px); border-color:var(--purple); }
.shape-svg { width:84px; height:84px; margin:0 auto; }
.shape-name { font-weight:700; margin-top:6px; color:var(--ink); }

.pattern-seq { display:flex; gap:10px; flex-wrap:wrap; align-items:center; justify-content:center; font-size:44px; margin:10px 0; }
.pt-item { background:#fff; border:3px solid var(--pink-200); border-radius:12px; min-width:54px; height:64px; display:grid; place-items:center; }
.pt-q { color:var(--purple); border-style:dashed; }
/* 认识时间 */
.clock-layout { display:flex; gap:20px; flex-wrap:wrap; }
.clock-left, .clock-right { flex:1 1 280px; background:var(--card); border:3px solid var(--pink-200); border-radius:18px; padding:16px; text-align:center; }
.clock-cap { font-weight:800; color:var(--pink-600); margin-bottom:8px; }
.clock-svg { width:100%; max-width:240px; }
/* 十万个为什么 */
.why-card { background:#fff; }
.why-q { font-size:19px; font-weight:800; color:var(--purple); margin-bottom:6px; }
.why-a { font-size:16px; line-height:1.7; color:var(--ink); margin-bottom:10px; }
/* 分解法 */
.decomp-example { background:var(--pink-50); border-radius:14px; padding:12px; line-height:2; font-size:16px; margin-bottom:8px; }
.decomp-steps { margin:8px 0; }
.decomp-line { font-size:17px; margin:6px 0; }

.decomp-ans { display: inline-block; min-width: 64px; height: 52px; line-height: 48px; border-radius: 14px; background: #ffe082; border: 3px solid #f9c74f; color: #5a3e36; text-align: center; font-size: 32px; vertical-align: middle; }
.decomp-tree svg { width: 100%; max-width: 360px; height: auto; margin: 0 auto; display: block; }
.decomp-tip { color: #6a4c4c; font-size: 15px; margin: 8px 0 4px; }

.decomp-choice { min-width: 72px; height: 60px; font-size: 26px; font-weight: 800; border-radius: 16px; background: #fff; border: 2px solid var(--pink-300); color: var(--purple); padding: 0 14px; }
.decomp-choice:hover { background: var(--pink-100); }
@media (max-width: 480px) {

/* 已加入词库：汉字 / 词置灰显示 */
.chr.done-added { opacity: .38; filter: grayscale(1); }

/* 已加入词库：图片右上角绿色对钩 icon */
.chk-badge {

}

/* 中国地图拼图 */
.china-board {

  background: #f3e9ef; padding: 8px; border-radius: 14px;
}
.china-cell {
  position: relative; aspect-ratio: 1 / 1; border: 2px dashed #d9c3cf;
  border-radius: 8px; display: grid; place-items: center; text-align: center;
  background: #fffdf9;
}
.china-cell.empty { border: none; background: transparent; }
.china-cell.over { border-color: #f9a; background: #fff0f6; }
.china-cell.filled { border-style: solid; background: #2ecc71 !important; border-color: #27ae60 !important; }
.china-slot-name { font-size: 11px; line-height: 1.1; padding: 2px; font-weight: 700; }

/* 真实雄鸡地图（SVG 省界） */
.cm-wrap { margin-top: 10px; border-radius: 16px; overflow: hidden; }
.china-svg {

  background: linear-gradient(180deg, #eaf6ff 0%, #f3f9ff 100%);
  border-radius: 16px; touch-action: none;
}
.china-prov {
  cursor: pointer; transition: fill .2s, stroke .2s;
  stroke: #c9b9a8; stroke-width: 1; fill: #f4f1ec;
}
.china-prov.over { stroke: #ff5a8a; stroke-width: 2.5; fill: #ffe7f1; }
.china-prov.filled { fill: #2ecc71; stroke: #27ae60; stroke-width: 1.2; }
.china-prov.wrong { stroke: #ff3b3b; stroke-width: 3; fill: #ffd9d9; animation: cmShake .45s; }
@keyframes cmShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-4px)} 40%{transform:translateX(4px)} 60%{transform:translateX(-3px)} 80%{transform:translateX(3px)} }
.china-prov-label {

}

@keyframes macauPulse { 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
.cm-tile {
  display: flex; flex-direction: column; align-items: center; justify-content: center;

.cm-cap { font-size: 11px; font-weight: 700; color: #c0608a; }

  border-radius: 16px; padding: 10px 14px; text-align: center; cursor: default;

/* 省份参考（只读） */

  font-size: 13px; color: #6b4a44; display: flex; flex-direction: column; align-items: center; line-height: 1.15; min-width: 56px;
}
.china-ref b { color: #c0608a; }
.china-ref span { font-size: 11px; color: #9a8a82; }

/* 绘画每日场景参考 */
.draw-scene { border-color: #ffd0e2; background: linear-gradient(120deg,#fff7fb,#fff0f6); }
.draw-scene-head { font-weight: 800; color: var(--pink-600); margin-bottom: 8px; }
.draw-scene-body { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.draw-scene-svg { flex: 1 1 280px; min-width: 240px; border-radius: 14px; overflow: hidden; border: 3px solid #ffd0e2; background: #fff; }
.draw-scene-svg svg { width: 100%; height: auto; display: block; }

/* 移动端：放大中国地图显示区，便于点击省份 */
@media (max-width: 768px) {

  // 返回某天的节日 {name,emoji,desc} 或 null（含母亲节/父亲节动态计算）
  function festivalOf(dateStr) {
    if (!dateStr) return null;
    const y = +dateStr.slice(0, 4);
    const dyn = [
      { date: nthSunday(y, 5, 2), name:"母亲节", emoji:"💐", desc:"向妈妈大声说爱她，谢谢她的照顾！" },
      { date: nthSunday(y, 6, 3), name:"父亲节", emoji:"🤴", desc:"给爸爸一个拥抱，感谢他的陪伴！" }
    ];
    const all = FESTIVALS.concat(dyn);
    const md = dateStr.slice(5); // "MM-DD"
    for (const f of all) {
      if (f.date.length === 5) { if (md === f.date) return { name: f.name, emoji: f.emoji, desc: f.desc }; }
      else { if (f.date === dateStr) return { name: f.name, emoji: f.emoji, desc: f.desc }; }
    }
    return null;
  }
  // 计算某年某月第 n 个星期日的日期字符串
  function nthSunday(y, month, n) {
    const first = new Date(y, month - 1, 1);
    const dow = first.getDay();          // 0=周日
    const firstSun = 1 + ((7 - dow) % 7);
    const day = firstSun + (n - 1) * 7;
    return `${y}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  }

window.POEMS = [{"title": "游长宁公主流杯池二十五首 一", "author": "上官昭容", "type": "边塞", "diff": 1, "lines": ["逐仙赏，展幽情。", "逾昆阆，迈蓬瀛。"]}, {"title": "游长宁公主流杯池二十五首 二", "author": "上官昭容", "type": "边塞", "diff": 1, "lines": ["游鲁馆，陟秦台。", "汚山壁，媿琼瓌。"]}, {"title": "游长宁公主流杯池二十五首 三", "author": "上官昭容", "type": "边塞", "diff": 1, "lines": ["檀栾竹影，飙𫗇松声。", "不烦歌吹，自足娱情。"]}, {"title": "游长宁公主流杯池二十五首 四", "author": "上官昭容", "type": "边塞", "diff": 1, "lines": ["仰循茅宇，俯眄乔枝。", "烟霞问讯，风月相知。"]}, {"title": "游长宁公主流杯池二十五首 五", "author": "上官昭容", "type": "边塞", "diff": 1, "lines": ["枝条郁郁，文质彬彬。", "山林作伴，松桂为邻。"]}, {"title": "游长宁公主流杯池二十五首 六", "author": "上官昭容", "type": "边塞", "diff": 1, "lines": ["清波汹涌，碧树冥蒙。", "莫怪留步，因攀桂丛。"]}, {"title": "游长宁公主流杯池二十五首 七", "author": "上官昭容", "type": "边塞", "diff": 1, "lines": ["莫论圆峤，休说方壶。", "何如鲁馆，即是仙都。"]}, {"title": "唐享昊天乐 第七", "author": "则天皇后", "type": "田园", "diff": 1, "lines": ["尊浮九酝，礼备三周。", "陈诚菲奠，契福神猷。"]}, {"title": "制袍字赐狄仁杰", "author": "则天皇后", "type": "田园", "diff": 1, "lines": ["敷政术，守清勤。", "升显位，励相臣。"]}, {"title": "奉和圣制立春日侍宴内殿出翦彩花应制", "author": "上官昭容", "type": "植物", "diff": 2, "lines": ["密叶因裁吐，新花逐翦舒。", "攀条虽不谬，摘橤讵知虚。", "春至由来发，秋还未肯疏。"]}, {"title": "驾幸新丰温泉宫献诗三首 一", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["三冬季月景[龙]年，万乘观风出灞川。", "遥看电跃龙为马，回瞩霜原玉作田。"]}, {"title": "驾幸新丰温泉宫献诗三首 二", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["鸾旗掣曳拂空回，羽骑骖驔蹑景来。", "隐隐骊山云外耸，迢迢御帐日边开。"]}, {"title": "驾幸新丰温泉宫献诗三首 三", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["翠幕珠帏敞月营，金罍玉斝泛兰英。", "岁岁年年常扈跸，长长久久乐升平。"]}, {"title": "游长宁公主流杯池二十五首 十四", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["攀藤招逸客，偃桂协幽情。", "水中看树影，风里听松声。"]}, {"title": "游长宁公主流杯池二十五首 十五", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["携琴侍叔夜，负局访安期。", "不应题石壁，为记赏山时。"]}, {"title": "游长宁公主流杯池二十五首 十六", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["泉石多仙趣，岩壑写奇形。", "欲知堪悦耳，唯听水泠泠。"]}, {"title": "游长宁公主流杯池二十五首 十七", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["岩壑恣登临，莹目复怡心。", "风篁类长笛，流水当鸣琴。"]}, {"title": "游长宁公主流杯池二十五首 十八", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["嬾步天台路，惟登地肺山。", "幽岩仙桂满，今日恣情攀。"]}, {"title": "游长宁公主流杯池二十五首 十九", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["暂游仁智所，萧然松桂情。", "寄言栖遯客，勿复访蓬瀛。"]}, {"title": "游长宁公主流杯池二十五首 二十", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["瀑溜晴疑雨，丛篁昼似昏。", "山中真可玩，暂请报王孙。"]}, {"title": "游长宁公主流杯池二十五首 二十一", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["傍池聊试笔，倚石旋题诗。", "豫弹山水调，终拟从钟期。"]}, {"title": "游长宁公主流杯池二十五首 二十二", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["横铺豹皮褥，侧带鹿胎巾。", "借问何为者，山中有逸人。"]}, {"title": "游长宁公主流杯池二十五首 二十三", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["沁水田园先自多，齐城楼观更无过。", "倩语张骞莫辛苦，人今从此识天河。"]}, {"title": "游长宁公主流杯池二十五首 二十四", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["参差碧岫耸莲花，潺湲绿水莹金沙。", "何须远访三山路，人今已到九仙家。"]}, {"title": "游长宁公主流杯池二十五首 二十五", "author": "上官昭容", "type": "边塞", "diff": 2, "lines": ["凭高瞰险足怡心，菌阁桃源不暇寻。", "余雪依林成玉树，残霙点岫即瑶岑。"]}, {"title": "九月九日幸临渭亭登高得秋字", "author": "中宗皇帝", "type": "植物", "diff": 2, "lines": ["九月正乘秋，三杯兴已周。", "泛桂迎尊满，吹花向酒浮。", "长房萸早熟，彭泽菊初收。"]}, {"title": "浪淘沙", "author": "刘禹锡", "lines": ["九曲黄河万里沙，浪淘风簸自天涯。", "如今直上银河去，同到牵牛织女家。"], "type": "黄河", "diff": 2}, {"title": "望洞庭", "author": "刘禹锡", "lines": ["湖光秋月两相和，潭面无风镜未磨。", "遥望洞庭山水翠，白银盘里一青螺。"], "type": "山水", "diff": 2}, {"title": "乌衣巷", "author": "刘禹锡", "lines": ["朱雀桥边野草花，乌衣巷口夕阳斜。", "旧时王谢堂前燕，飞入寻常百姓家。"], "type": "感慨", "diff": 2}, {"title": "春词", "author": "刘禹锡", "lines": ["新妆宜面下朱楼，深锁春光一院愁。", "行到中庭数花朵，蜻蜓飞上玉搔头。"], "type": "宫怨", "diff": 2}, {"title": "竹枝词", "author": "刘禹锡", "lines": ["杨柳青青江水平，闻郎江上踏歌声。", "东边日出西边雨，道是无晴却有晴。"], "type": "爱情", "diff": 2}, {"title": "送灵澈上人", "author": "刘长卿", "lines": ["苍苍竹林寺，杳杳钟声晚。", "荷笠带斜阳，青山独归远。"], "type": "送别", "diff": 2}, {"title": "听弹琴", "author": "刘长卿", "lines": ["泠泠七弦上，静听松风寒。", "古调虽自爱，今人多不弹。"], "type": "抒情", "diff": 2}, {"title": "逢雪宿芙蓉山主人", "author": "刘长卿", "lines": ["日暮苍山远，天寒白屋贫。", "柴门闻犬吠，风雪夜归人。"], "type": "冬天", "diff": 2}, {"title": "曳鼎歌", "author": "则天皇后", "type": "边塞", "diff": 2, "lines": ["羲农首出，轩昊膺期。", "唐虞继踵，汤禹乘时。", "天下光宅，海内雍熙。", "上玄降鉴，方建隆基。"]}, {"title": "唐享昊天乐 第一", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["太阴凝至化，真耀蕴轩仪。", "德迈娥台敞，仁高[姒]幄披。", "扪天遂启极，梦日乃升曦。"]}, {"title": "唐享昊天乐 第二", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["瞻紫极，望玄穹。", "翘至恳，罄深衷。", "听虽远，诚必通。", "垂厚泽，降云宫。"]}, {"title": "唐享昊天乐 第五", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["朝坛雾卷，曙岭烟沈。", "爰设筐币，式表诚心。", "筵辉丽璧，乐畅和音。", "仰惟灵鉴，俯察翘襟。"]}, {"title": "唐享昊天乐 第六", "author": "则天皇后", "type": "植物", "diff": 2, "lines": ["昭昭上帝，穆穆下临。", "礼崇备物，乐奏锵金。", "兰羞委荐，桂醑盈斟。", "敢希明德，幸罄庄心。"]}, {"title": "唐享昊天乐 第八", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["奠璧郊坛昭大礼，锵金拊石表虔诚。", "始奏承云娱帝赏，复歌调露畅韶英。"]}, {"title": "唐享昊天乐 第十", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["肃肃祀典，邕邕礼秩。", "三献已周，九成斯毕。", "爰撤其俎，载迁其实。", "或升或降，惟诚惟质。"]}, {"title": "唐享昊天乐 第十一", "author": "则天皇后", "type": "植物", "diff": 2, "lines": ["礼终肆类，乐阕九成。", "仰惟明德，敢荐非馨。", "顾慙菲奠，久驰云𫐌。", "瞻荷灵泽，悚恋兼盈。"]}, {"title": "唐享昊天乐 第十二", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["式干路，辟天扉。", "回日驭，动云衣。", "登金阙，入紫微。", "望仙驾，仰恩徽。"]}, {"title": "唐明堂乐章 皇帝行", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["仰膺历数，俯顺讴歌。", "远安迩肃，俗阜时和。", "化光玉镜，讼息金科。", "方兴典礼，永戢干戈。"]}, {"title": "唐明堂乐章 皇嗣出入升降", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["至人光俗，大孝通神。", "谦以表性，恭惟立身。", "洪规载启，茂典方陈。", "誉隆三善，祥开万春。"]}, {"title": "唐明堂乐章 迎送王公", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["千官肃事，万国朝宗。", "载延百辟，爰集三宫。", "君臣德合，鱼水斯同。", "睿图方永，周历长隆。"]}, {"title": "唐明堂乐章 登歌", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["礼崇宗祀，志表严禋。", "笙镛合奏，文物惟新。", "敬遵茂典，敢择良辰。", "絜诚斯著，奠谒方申。"]}, {"title": "唐明堂乐章 配飨", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["笙镛间玉宇，文物昭清辉。", "晬影临芳奠，休光下太微。", "孝思期有感，明絜庶无违。"]}, {"title": "唐明堂乐章 角音", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["出震位，开平秩。", "扇条风，乘甲乙。", "龙德盛，鸟星出。", "荐珪篚，陈诚实。"]}, {"title": "唐明堂乐章 徵音", "author": "则天皇后", "type": "植物", "diff": 2, "lines": ["赫赫离精御炎陆，滔滔炽景开隆暑。", "冀延神鉴俯兰尊，式表虔襟陈桂俎。"]}, {"title": "唐明堂乐章 商音", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["律中夷则，序应收成。", "功宣建武，义表惟明。", "爰申礼奠，庶展翘诚。", "九秋是式，百谷斯盈。"]}, {"title": "唐明堂乐章 羽音", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["葭律肇启隆冬，苹藻攸陈飨祭。", "黄钟既陈玉烛，红粒方殷稔岁。"]}, {"title": "唐大飨拜洛乐章 昭和", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["九玄眷命，三圣基隆。", "奉成先旨，明台毕功。", "宗祀展敬，冀表深衷。", "永昌帝业，式播淳风。"]}, {"title": "唐大飨拜洛乐章 致和", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["神功不测兮运阴阳，包藏万宇兮孕八荒。", "天符既出兮帝业昌，愿临明祀兮降祯祥。"]}, {"title": "唐大飨拜洛乐章 九和", "author": "则天皇后", "type": "植物", "diff": 2, "lines": ["只荷坤德，钦若干灵。", "慙惕罔寘，兴居匪宁。", "恭崇礼则，肃奉仪形。", "惟凭展敬，敢荐非馨。"]}, {"title": "唐大飨拜洛乐章 显和", "author": "则天皇后", "type": "植物", "diff": 2, "lines": ["顾德有慙虚菲，明只屡降祯符。", "汜水初呈秘象，温洛荐表昌图。", "玄泽流恩载洽，丹襟荷渥增愉。"]}, {"title": "唐大飨拜洛乐章 敬和", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["兰俎既升，苹羞可荐。", "金石载设，咸英已变。", "林泽斯总，山川是徧。", "敢用敷诚，实惟忘倦。"]}, {"title": "唐大飨拜洛乐章 齐和", "author": "则天皇后", "type": "边塞", "diff": 2, "lines": ["沈潜演贶分三极，广大凝祯总万方。", "既荐羽旌文化启，还呈干戚武威扬。"]}, {"title": "唐大飨拜洛乐章 禋和", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["百礼崇容，千官肃事。", "灵降舞兆，神凝有粹。", "奠享咸周，威仪毕备。", "奏夏登列，歌雍撤肆。"]}, {"title": "唐大飨拜洛乐章 通和", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["皇皇灵睠，穆穆神心。", "暂动凝质，还归积阴。", "功玄枢纽，理寂高深。", "衔恩佩德，耸志翘襟。"]}, {"title": "唐大飨拜洛乐章 归和", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["言旋云洞兮蹑烟涂，永宁中宇兮安下都。", "包涵动植兮顺荣枯，长贻宝贶兮赞璇图。"]}, {"title": "腊日宣诏幸上苑", "author": "则天皇后", "type": "植物", "diff": 2, "lines": ["明朝游上苑，火急报春知。", "花须连夜发，莫待晓风吹。"]}, {"title": "如意娘", "author": "则天皇后", "type": "田园", "diff": 2, "lines": ["看朱成碧思纷纷，顦顇支离为忆君。", "不信比来长下泪，开箱验取石榴裙。"]}, {"title": "咏灯", "author": "南唐先主李昪", "type": "田园", "diff": 2, "lines": ["一点分明值万金，开时惟怕冷风侵。", "主人若也勤挑拨，敢向尊前不尽心。"]}, {"title": "塞下曲（其二）", "author": "卢纶", "lines": ["林暗草惊风，将军夜引弓。", "平明寻白羽，没在石棱中。"], "type": "边塞", "diff": 2}, {"title": "塞下曲（其三）", "author": "卢纶", "lines": ["月黑雁飞高，单于夜遁逃。", "欲将轻骑逐，大雪满弓刀。"], "type": "边塞", "diff": 2}, {"title": "句", "author": "嗣主璟", "type": "植物", "diff": 2, "lines": ["灵槎思浩荡，老鹤倚崆峒。", "苍苔迷古道，红叶乱朝霞。", "栖凤枝梢犹輭弱，化龙形状已依稀。"]}, {"title": "于北平作", "author": "太宗皇帝", "type": "边塞", "diff": 2, "lines": ["翠野驻戎轩，卢龙转征斾。", "遥山丽如绮，长流萦似带。", "海气百重楼，岩松千丈盖。"]}, {"title": "冬宵各为四韵", "author": "太宗皇帝", "type": "田园", "diff": 2, "lines": ["雕宫静龙漏，绮阁宴公侯。", "珠帘烛燄动，绣柱月光浮。", "云起将歌发，风停与管遒。"]}, {"title": "于太原召侍臣赐宴守岁", "author": "太宗皇帝", "type": "植物", "diff": 2, "lines": ["四时运灰琯，一夕变冬春。", "送寒余雪尽，迎岁早梅新。"]}, {"title": "咏烛二首 一", "author": "太宗皇帝", "type": "边塞", "diff": 2, "lines": ["燄听风来动，花开不待春。", "镇下千行泪，非是为思人。"]}, {"title": "咏烛二首 二", "author": "太宗皇帝", "type": "边塞", "diff": 2, "lines": ["九龙蟠燄动，四照逐花生。", "即此流高殿，堪持待月明。"]}, {"title": "咏弓", "author": "太宗皇帝", "type": "动物", "diff": 2, "lines": ["上弦明月半，激箭流星远。", "落雁带书惊，啼猿映枝转。"]}, {"title": "赋得早雁出云鸣", "author": "太宗皇帝", "type": "动物", "diff": 2, "lines": ["初秋玉露清，早雁出空鸣。", "隔云时乱影，因风乍含声。"]}, {"title": "赋得临池柳", "author": "太宗皇帝", "type": "植物", "diff": 2, "lines": ["岸曲丝阴聚，波移带影疏。", "还将眉里翠，来就镜中舒。"]}, {"title": "赋得临池竹", "author": "太宗皇帝", "type": "植物", "diff": 2, "lines": ["贞条障曲砌，翠叶贯寒霜。", "拂牖分龙影，临池待凤翔。"]}, {"title": "赋得弱柳鸣秋蝉", "author": "太宗皇帝", "type": "植物", "diff": 2, "lines": ["散影玉阶柳，含翠隐鸣蝉。", "微形藏叶里，乱响出风前。"]}, {"title": "探得李", "author": "太宗皇帝", "type": "田园", "diff": 2, "lines": ["盘根直盈渚，交干横倚天。", "舒华光四海，卷叶荫三川。"]}, {"title": "咏小山", "author": "太宗皇帝", "type": "植物", "diff": 2, "lines": ["近谷交萦橤，遥峰对出莲。", "径细无全磴，松小未含烟。"]}, {"title": "赐萧瑀", "author": "太宗皇帝", "type": "植物", "diff": 2, "lines": ["疾风知劲草，板荡识诚臣。", "勇夫安识义，智者必怀仁。"]}, {"title": "赐房玄龄", "author": "太宗皇帝", "type": "边塞", "diff": 2, "lines": ["太液仙舟迥，西园隐上才。", "未晓征车度，鸡鸣关早开。"]}, {"title": "辽东山夜临秋", "author": "太宗皇帝", "type": "动物", "diff": 2, "lines": ["烟生遥岸隐，月落半崖阴。", "连山惊鸟乱，隔岫断猿吟。"]}, {"title": "赐魏征诗", "author": "太宗皇帝", "type": "田园", "diff": 2, "lines": ["醽醁胜兰生，翠涛过玉䪥。", "千日醉不醒，十年味不败。"]}, {"title": "两仪殿赋柏梁体", "author": "太宗皇帝", "type": "田园", "diff": 2, "lines": ["绝域降附天下平，八表无事悦圣情。", "云披雾敛天地明，登封日观禅云亭。", "太常具礼方告成。"]}, {"title": "句", "author": "太宗皇帝", "type": "田园", "diff": 2, "lines": ["雪耻酬百王，除凶报千古。", "昔乘匹马去，今驱万乘来。", "近日毛虽暖闻弦心已惊。"]}, {"title": "嘲陆畅", "author": "女学士宋氏若华", "type": "田园", "diff": 2, "lines": ["十二层楼倚翠空，凤鸾相对立梧桐。", "双成走报监门卫，莫使吴歈入汉宫。"]}, {"title": "春晓", "author": "孟浩然", "lines": ["春眠不觉晓，处处闻啼鸟。", "夜来风雨声，花落知多少。"], "type": "春天", "diff": 2}, {"title": "宿建德江", "author": "孟浩然", "lines": ["移舟泊烟渚，日暮客愁新。", "野旷天低树，江清月近人。"], "type": "思乡", "diff": 2}, {"title": "渡汉江", "author": "宋之问", "lines": ["岭外音书断，经冬复历春。", "近乡情更怯，不敢问来人。"], "type": "思乡", "diff": 2}, {"title": "重阳锡宴群臣", "author": "宣宗皇帝", "type": "边塞", "diff": 2, "lines": ["款塞旋征骑，和戎委庙贤。", "倾心方倚注，叶力共安边。"]}, {"title": "题泾县水西寺", "author": "宣宗皇帝", "type": "田园", "diff": 2, "lines": ["大殿连云接爽溪，钟声还与鼓声齐。", "长安若问江南事，说道风光在水西。"]}, {"title": "瀑布联句", "author": "宣宗皇帝", "type": "田园", "diff": 2, "lines": ["千岩万壑不辞劳，远看方知出处高。", "溪涧岂能留得住，终归大海作波涛。"]}, {"title": "句", "author": "宣宗皇帝", "type": "田园", "diff": 2, "lines": ["海岳宴咸通，七载秉钧调四序。", "一方狱市获来苏。"]}, {"title": "题都城南庄", "author": "崔护", "lines": ["去年今日此门中，人面桃花相映红。", "人面不知何处去，桃花依旧笑春风。"], "type": "感慨", "diff": 2}, {"title": "枫桥夜泊", "author": "张继", "lines": ["月落乌啼霜满天，江枫渔火对愁眠。", "姑苏城外寒山寺，夜半钟声到客船。"], "type": "愁绪", "diff": 2}, {"title": "拟小山篇", "author": "徐贤妃", "type": "植物", "diff": 2, "lines": ["仰幽岩而流盼，抚桂枝以凝想。", "将千龄兮此遇，荃何为兮独往。"]}, {"title": "进太宗", "author": "徐贤妃", "type": "田园", "diff": 2, "lines": ["朝来临镜台，妆罢暂裴回。", "千金始一笑，一召讵能来。"]}, {"title": "九日绝句", "author": "德宗皇帝", "type": "田园", "diff": 2, "lines": ["禁苑秋来爽气多，昆明风动起沧波。", "中流箫鼓诚堪赏，讵假横汾发櫂歌。"]}, {"title": "题程修己竹障", "author": "文宗皇帝", "type": "植物", "diff": 2, "lines": ["良工运精思，巧极似有神。", "临窗忽覩繁阴合，再盼真假殊未分。"]}, {"title": "宫中题", "author": "文宗皇帝", "type": "植物", "diff": 2, "lines": ["辇路生春草，上林花发时。", "凭高何限意，无复侍臣知。"]}, {"title": "上巳日赐裴度", "author": "文宗皇帝", "type": "田园", "diff": 2, "lines": ["注想待元老，识君恨不早。", "我家柱石衰，忧来学丘祷。"]}, {"title": "上元日二首 一", "author": "文宗皇帝", "type": "边塞", "diff": 2, "lines": ["上元高会集群仙，心斋何事欲祈年。", "丹诚傥彻玉帝座，且共吾人庆大田。"]}, {"title": "上元日二首 二", "author": "文宗皇帝", "type": "边塞", "diff": 2, "lines": ["蓂生三五叶初齐，上元羽客出桃蹊。", "不爱仙家登真诀，愿蒙四海福黔黎。"]}, {"title": "夏日联句", "author": "文宗皇帝", "type": "田园", "diff": 2, "lines": ["人皆苦炎热，我爱夏日长。", "熏风自南来，殿阁生微凉。"]}, {"title": "潼关口号", "author": "明皇帝", "type": "田园", "diff": 2, "lines": ["河曲回千里，关门限二京。", "所嗟非恃德，设险到天平。"]}, {"title": "续薛令之题壁", "author": "明皇帝", "type": "植物", "diff": 2, "lines": ["啄木觜距长，凤皇羽毛短。", "苦嫌松桂寒，任逐桑榆煖。"]}, {"title": "送胡真师还西山", "author": "明皇帝", "type": "边塞", "diff": 2, "lines": ["仙客厌人间，孤云比性闲。", "话离情未已，烟水万重山。"]}, {"title": "过大哥山池题石壁", "author": "明皇帝", "type": "植物", "diff": 2, "lines": ["澄潭皎镜石崔巍，万壑千岩暗绿苔。", "林亭自有幽贞趣，况复秋深爽气来。"]}, {"title": "题梅妃画真", "author": "明皇帝", "type": "植物", "diff": 2, "lines": ["忆昔娇妃在紫宸，铅华不御得天真。", "霜绡虽似当时态，争奈娇波不顾人。"]}, {"title": "傀儡吟", "author": "明皇帝", "type": "田园", "diff": 2, "lines": ["刻木牵丝作老翁，鸡皮鹤发与真同。", "须臾弄罢寂无事，还似人生一梦中。"]}, {"title": "乐游原", "author": "李商隐", "lines": ["向晚意不适，驱车登古原。", "夕阳无限好，只是近黄昏。"], "type": "感慨", "diff": 2}, {"title": "夜雨寄北", "author": "李商隐", "lines": ["君问归期未有期，巴山夜雨涨秋池。", "何当共剪西窗烛，却话巴山夜雨时。"], "type": "思念", "diff": 2}, {"title": "嫦娥", "author": "李商隐", "lines": ["云母屏风烛影深，长河渐落晓星沉。", "嫦娥应悔偷灵药，碧海青天夜夜心。"], "type": "神话", "diff": 2}, {"title": "风", "author": "李峤", "lines": ["解落三秋叶，能开二月花。", "过江千尺浪，入竹万竿斜。"], "type": "自然", "diff": 2}, {"title": "静夜思", "author": "李白", "lines": ["床前明月光，疑是地上霜。", "举头望明月，低头思故乡。"], "type": "思乡", "diff": 2}, {"title": "独坐敬亭山", "author": "李白", "lines": ["众鸟高飞尽，孤云独去闲。", "相看两不厌，只有敬亭山。"], "type": "山水", "diff": 2}, {"title": "夜宿山寺", "author": "李白", "lines": ["危楼高百尺，手可摘星辰。", "不敢高声语，恐惊天上人。"], "type": "想象", "diff": 2}, {"title": "秋浦歌", "author": "李白", "lines": ["白发三千丈，缘愁似个长。", "不知明镜里，何处得秋霜。"], "type": "抒情", "diff": 2}, {"title": "玉阶怨", "author": "李白", "lines": ["玉阶生白露，夜久侵罗袜。", "却下水晶帘，玲珑望秋月。"], "type": "宫怨", "diff": 2}, {"title": "赠汪伦", "author": "李白", "lines": ["李白乘舟将欲行，忽闻岸上踏歌声。", "桃花潭水深千尺，不及汪伦送我情。"], "type": "送别", "diff": 2}, {"title": "早发白帝城", "author": "李白", "lines": ["朝辞白帝彩云间，千里江陵一日还。", "两岸猿声啼不住，轻舟已过万重山。"], "type": "山水", "diff": 2}, {"title": "望庐山瀑布", "author": "李白", "lines": ["日照香炉生紫烟，遥看瀑布挂前川。", "飞流直下三千尺，疑是银河落九天。"], "type": "山水", "diff": 2}, {"title": "黄鹤楼送孟浩然之广陵", "author": "李白", "lines": ["故人西辞黄鹤楼，烟花三月下扬州。", "孤帆远影碧空尽，唯见长江天际流。"], "type": "送别", "diff": 2}, {"title": "望天门山", "author": "李白", "lines": ["天门中断楚江开，碧水东流至此回。", "两岸青山相对出，孤帆一片日边来。"], "type": "山水", "diff": 2}, {"title": "古朗月行（节选）", "author": "李白", "lines": ["小时不识月，呼作白玉盘。", "又疑瑶台镜，飞在青云端。"], "type": "月亮", "diff": 2}, {"title": "悯农（其一）", "author": "李绅", "lines": ["锄禾日当午，汗滴禾下土。", "谁知盘中餐，粒粒皆辛苦。"], "type": "田园", "diff": 2}, {"title": "悯农（其二）", "author": "李绅", "lines": ["春种一粒粟，秋收万颗子。", "四海无闲田，农夫犹饿死。"], "type": "田园", "diff": 2}, {"title": "清明", "author": "杜牧", "lines": ["清明时节雨纷纷，路上行人欲断魂。", "借问酒家何处有，牧童遥指杏花村。"], "type": "节日", "diff": 2}, {"title": "山行", "author": "杜牧", "lines": ["远上寒山石径斜，白云生处有人家。", "停车坐爱枫林晚，霜叶红于二月花。"], "type": "秋天", "diff": 2}, {"title": "江南春", "author": "杜牧", "lines": ["千里莺啼绿映红，水村山郭酒旗风。", "南朝四百八十寺，多少楼台烟雨中。"], "type": "春天", "diff": 2}, {"title": "秋夕", "author": "杜牧", "lines": ["银烛秋光冷画屏，轻罗小扇扑流萤。", "天阶夜色凉如水，卧看牵牛织女星。"], "type": "秋天", "diff": 2}, {"title": "泊秦淮", "author": "杜牧", "lines": ["烟笼寒水月笼沙，夜泊秦淮近酒家。", "商女不知亡国恨，隔江犹唱后庭花。"], "type": "感慨", "diff": 2}, {"title": "八阵图", "author": "杜甫", "lines": ["功盖三分国，名成八阵图。", "江流石不转，遗恨失吞吴。"], "type": "怀古", "diff": 2}, {"title": "绝句", "author": "杜甫", "lines": ["迟日江山丽，春风花草香。", "泥融飞燕子，沙暖睡鸳鸯。"], "type": "春天", "diff": 2}, {"title": "绝句（江碧）", "author": "杜甫", "lines": ["江碧鸟逾白，山青花欲燃。", "今春看又过，何日是归年。"], "type": "春天", "diff": 2}, {"title": "绝句（两个黄鹂）", "author": "杜甫", "lines": ["两个黄鹂鸣翠柳，一行白鹭上青天。", "窗含西岭千秋雪，门泊东吴万里船。"], "type": "春天", "diff": 2}, {"title": "江南逢李龟年", "author": "杜甫", "lines": ["岐王宅里寻常见，崔九堂前几度闻。", "正是江南好风景，落花时节又逢君。"], "type": "感慨", "diff": 2}, {"title": "赠花卿", "author": "杜甫", "lines": ["锦城丝管日纷纷，半入江风半入云。", "此曲只应天上有，人间能得几回闻。"], "type": "抒情", "diff": 2}, {"title": "赠张云容舞", "author": "杨贵妃", "type": "植物", "diff": 2, "lines": ["罗袖动香香不已，红蕖褭褭秋烟里。", "轻云岭上乍摇风，嫩柳池边初拂水。"]}, {"title": "江雪", "author": "柳宗元", "lines": ["千山鸟飞绝，万径人踪灭。", "孤舟蓑笠翁，独钓寒江雪。"], "type": "冬天", "diff": 2}, {"title": "谢赐珍珠", "author": "江妃", "type": "植物", "diff": 2, "lines": ["桂叶双眉久不描，残妆和泪汚红绡。", "长门尽日无梳洗，何必珍珠慰寂寥。"]}, {"title": "登鹳雀楼", "author": "王之涣", "lines": ["白日依山尽，黄河入海流。", "欲穷千里目，更上一层楼。"], "type": "励志", "diff": 2}, {"title": "凉州词", "author": "王之涣", "lines": ["黄河远上白云间，一片孤城万仞山。", "羌笛何须怨杨柳，春风不度玉门关。"], "type": "边塞", "diff": 2}, {"title": "出塞", "author": "王昌龄", "lines": ["秦时明月汉时关，万里长征人未还。", "但使龙城飞将在，不教胡马度阴山。"], "type": "边塞", "diff": 2}, {"title": "芙蓉楼送辛渐", "author": "王昌龄", "lines": ["寒雨连江夜入吴，平明送客楚山孤。", "洛阳亲友如相问，一片冰心在玉壶。"], "type": "送别", "diff": 2}, {"title": "从军行", "author": "王昌龄", "lines": ["青海长云暗雪山，孤城遥望玉门关。", "黄沙百战穿金甲，不破楼兰终不还。"], "type": "边塞", "diff": 2}, {"title": "采莲曲", "author": "王昌龄", "lines": ["荷叶罗裙一色裁，芙蓉向脸两边开。", "乱入池中看不见，闻歌始觉有人来。"], "type": "少女", "diff": 2}, {"title": "相思", "author": "王维", "lines": ["红豆生南国，春来发几枝。", "愿君多采撷，此物最相思。"], "type": "思念", "diff": 2}, {"title": "鹿柴", "author": "王维", "lines": ["空山不见人，但闻人语响。", "返景入深林，复照青苔上。"], "type": "山水", "diff": 2}, {"title": "鸟鸣涧", "author": "王维", "lines": ["人闲桂花落，夜静春山空。", "月出惊山鸟，时鸣春涧中。"], "type": "山水", "diff": 2}, {"title": "竹里馆", "author": "王维", "lines": ["独坐幽篁里，弹琴复长啸。", "深林人不知，明月来相照。"], "type": "山水", "diff": 2}, {"title": "九月九日忆山东兄弟", "author": "王维", "lines": ["独在异乡为异客，每逢佳节倍思亲。", "遥知兄弟登高处，遍插茱萸少一人。"], "type": "思乡", "diff": 2}, {"title": "问刘十九", "author": "白居易", "lines": ["绿蚁新醅酒，红泥小火炉。", "晚来天欲雪，能饮一杯无。"], "type": "友情", "diff": 2}, {"title": "池上", "author": "白居易", "lines": ["小娃撑小艇，偷采白莲回。", "不解藏踪迹，浮萍一道开。"], "type": "儿童", "diff": 2}, {"title": "遗爱寺", "author": "白居易", "lines": ["弄石临溪坐，寻花绕寺行。", "时时闻鸟语，处处是泉声。"], "type": "山水", "diff": 2}, {"title": "暮江吟", "author": "白居易", "lines": ["一道残阳铺水中，半江瑟瑟半江红。", "可怜九月初三夜，露似真珠月似弓。"], "type": "秋天", "diff": 2}, {"title": "大林寺桃花", "author": "白居易", "lines": ["人间四月芳菲尽，山寺桃花始盛开。", "长恨春归无觅处，不知转入此中来。"], "type": "春天", "diff": 2}, {"title": "终南望余雪", "author": "祖咏", "lines": ["终南阴岭秀，积雪浮云端。", "林表明霁色，城中增暮寒。"], "type": "冬天", "diff": 2}, {"title": "黄台瓜辞", "author": "章怀太子", "type": "田园", "diff": 2, "lines": ["种瓜黄台下，瓜熟子离离。", "一摘使瓜好，再摘使瓜稀。", "三摘犹自可，摘绝抱蔓归。"]}, {"title": "延英殿玉灵芝诗三章章八句 一", "author": "肃宗皇帝", "type": "田园", "diff": 2, "lines": ["玉殿肃肃，灵芝煌煌。", "重英发秀，连叶分房。", "宗庙之福，垂其耿光。"]}, {"title": "延英殿玉灵芝诗三章章八句 二", "author": "肃宗皇帝", "type": "田园", "diff": 2, "lines": ["元气产芝，明神合德。", "紫微间采，白蕣呈色。", "载启瑞图，庶符皇极。", "天心有眷，王道惟直。"]}, {"title": "延英殿玉灵芝诗三章章八句 三", "author": "肃宗皇帝", "type": "植物", "diff": 2, "lines": ["幸生芳本，当我扆旒。", "效此灵质，贲其王猷。", "神惟不爱，道亦无求。", "端拱思惟，永荷天休。"]}, {"title": "小儿垂钓", "author": "胡令能", "lines": ["蓬头稚子学垂纶，侧坐莓苔草映身。", "路人借问遥招手，怕得鱼惊不应人。"], "type": "儿童", "diff": 2}, {"title": "夜梦", "author": "萧妃", "type": "动物", "diff": 2, "lines": ["昨日梦君归，贱妾下鸣机。", "极知意气薄，不著去时衣。", "故言如梦里，赖得雁书飞。"]}, {"title": "咏柳", "author": "贺知章", "lines": ["碧玉妆成一树高，万条垂下绿丝绦。", "不知细叶谁裁出，二月春风似剪刀。"], "type": "春天", "diff": 2}, {"title": "回乡偶书", "author": "贺知章", "lines": ["少小离家老大回，乡音无改鬓毛衰。", "儿童相见不相识，笑问客从何处来。"], "type": "思乡", "diff": 2}, {"title": "寻隐者不遇", "author": "贾岛", "lines": ["松下问童子，言师采药去。", "只在此山中，云深不知处。"], "type": "隐逸", "diff": 2}, {"title": "春怨", "author": "金昌绪", "lines": ["打起黄莺儿，莫教枝上啼。", "啼时惊妾梦，不得到辽西。"], "type": "思念", "diff": 2}, {"title": "秋夜寄邱员外", "author": "韦应物", "lines": ["怀君属秋夜，散步咏凉天。", "空山松子落，幽人应未眠。"], "type": "友情", "diff": 2}, {"title": "滁州西涧", "author": "韦应物", "lines": ["独怜幽草涧边生，上有黄鹂深树鸣。", "春潮带雨晚来急，野渡无人舟自横。"], "type": "山水", "diff": 2}, {"title": "寒食", "author": "韩翃", "lines": ["春城无处不飞花，寒食东风御柳斜。", "日暮汉宫传蜡烛，轻烟散入五侯家。"], "type": "节日", "diff": 2}, {"title": "别董大", "author": "高适", "lines": ["千里黄云白日曛，北风吹雁雪纷纷。", "莫愁前路无知己，天下谁人不识君。"], "type": "送别", "diff": 2}, {"title": "九月九日上幸慈恩寺登浮图群臣上菊花寿酒", "author": "上官昭容", "type": "植物", "diff": 3, "lines": ["帝里重阳节，香园万乘来。", "却邪萸入佩，献寿菊传杯。", "墖类承天涌，门疑待佛开。", "睿词悬日月，长得仰昭回。"]}, {"title": "彩书怨", "author": "上官昭容", "type": "田园", "diff": 3, "lines": ["叶下洞庭初，思君万里余。", "露浓香被冷，月落锦屏虚。", "欲奏江南曲，贪封蓟北书。", "书中无别意，惟怅久离居。"]}, {"title": "驾幸三会寺应制", "author": "上官昭容", "type": "边塞", "diff": 3, "lines": ["释子谈经处，轩臣刻字留。", "故台遗老识，残简圣皇求。", "驻跸怀千古，开襟望九州。", "四山缘塞合，二水夹城流。", "宸翰陪瞻仰，天杯接献酬。", "太平词藻盛，长愿纪鸿休。"]}, {"title": "游长宁公主流杯池二十五首 八", "author": "上官昭容", "type": "边塞", "diff": 3, "lines": ["玉环腾远创，金埒荷殊荣。", "弗玩珠玑饰，仍留仁智情。", "凿山便作室，凭树即为楹。", "公输与班尔，从此遂韬声。"]}, {"title": "游长宁公主流杯池二十五首 九", "author": "上官昭容", "type": "边塞", "diff": 3, "lines": ["登山一长望，正遇九春初。", "结驷填街术，闾阎满邑居。", "鬬雪梅先吐，惊风柳未舒。", "直愁斜日落，不畏酒尊虚。"]}, {"title": "游长宁公主流杯池二十五首 十", "author": "上官昭容", "type": "边塞", "diff": 3, "lines": ["霁晓气清和，披襟赏薜萝。", "玳瑁凝春色，琉璃漾水波。", "跂石聊长啸，攀松乍短歌。", "除非物外者，谁就此经过。"]}, {"title": "游长宁公主流杯池二十五首 十一", "author": "上官昭容", "type": "边塞", "diff": 3, "lines": ["暂尔游山第，淹留惜未归。", "霞窗明月满，涧户白云飞。", "书引藤为架，人将薜作衣。", "此真攀玩所，临睨赏光辉。"]}, {"title": "游长宁公主流杯池二十五首 十二", "author": "上官昭容", "type": "边塞", "diff": 3, "lines": ["放旷出烟云，萧条自不群。", "漱流清意府，隐几避嚻氛。", "石画妆苔色，风梭织水文。", "山室何为贵？唯余兰桂熏。"]}, {"title": "游长宁公主流杯池二十五首 十三", "author": "上官昭容", "type": "边塞", "diff": 3, "lines": ["策杖临霞岫，危步下霜蹊。", "志逐深山静，途随曲涧迷。", "渐觉心神逸，俄看云雾低。", "莫怪人题树，只为赏幽栖。"]}, {"title": "登骊山高顶寓目", "author": "中宗皇帝", "type": "田园", "diff": 3, "lines": ["四郊秦汉国，八水帝王都。", "阊阖雄里闬，城阙壮规模。", "贯渭称天邑，含岐实奥区。", "金门披玉馆，因此识皇图。"]}, {"title": "幸秦始皇陵", "author": "中宗皇帝", "type": "田园", "diff": 3, "lines": ["眷言君失德，骊邑想秦余。", "政烦方改篆，愚俗乃焚书。", "阿房久已灭，阁道遂成墟。", "欲厌东南气，翻伤掩鲍车。"]}, {"title": "立春日游苑迎春", "author": "中宗皇帝", "type": "动物", "diff": 3, "lines": ["神皐福地三秦邑，玉台金阙九仙家。", "寒光犹恋甘泉树，淑景偏临建始花。", "彩蝶黄鸎未歌舞，梅香柳色已矜夸。", "迎春正启流霞席，暂嘱曦轮勿遽斜。"]}, {"title": "十月诞辰内殿宴群臣效柏梁体联句", "author": "中宗皇帝", "type": "植物", "diff": 3, "lines": ["润色鸿业寄贤才，叨居右弼媿盐梅。", "运筹帷幄荷时来，职掌图籍滥蓬莱。", "两司谬忝谢钟裴，礼乐铨管效涓埃。", "陈师振旅清九垓，欣承顾问侍天杯。", "衔恩献寿梁柏台，黄缣青简奉康哉。", "鲰生侍从忝王枚，右掖司言实不才。", "宗伯秩礼天地开，帝歌难续仰昭回。", "微臣捧日变寒灰，远慙班左媿游陪。"]}, {"title": "景龙四年正月五日移仗蓬莱宫御大明殿会吐蕃骑马之戏因重为柏梁体联句", "author": "中宗皇帝", "type": "田园", "diff": 3, "lines": ["大明御宇临万方，顾慙内政翊陶唐。", "鸾鸣凤舞向平阳，秦楼鲁馆沐恩光。", "无心为子辄求郎，雄才七步谢陈王。", "当熊让辇媿前芳，再司铨筦恩可忘。", "文江学海思济航，万邦考绩臣所详。", "著作不休出中肠，权豪屏迹肃严霜。", "铸鼎开岳造明堂，玉醴由来献寿觞。"]}, {"title": "石淙", "author": "中宗皇帝", "type": "田园", "diff": 3, "lines": ["三阳本是标灵纪，二室由来独擅名。", "霞衣霞锦千般状，云峰云岫百重生。", "水炫珠光遇泉客，岩悬石镜厌山精。", "永愿乾坤符睿算，长居膝下属欢情。"]}, {"title": "石桥", "author": "信安王祎", "type": "动物", "diff": 3, "lines": ["别有经行所，迥跨重峦侧。", "粤因求瘼余，倏想寻真域。", "放情恣披拂，杖策聊□□。", "□□□□□，□□□□色。", "乱幡雾中见，雁塔云间识。", "薄烟幂远郊，遥峰没归翼。", "仙桥危石架，幽洞乘□□。", "□□□□□，□□□易测。", "二教无先后，一相平而直。", "冀兹捐俗心，永怀依妙力。"]}, {"title": "唐享昊天乐 第三", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["干仪混成冲邃，天道下济高明。", "闿阳晨披紫阙，太一晓降黄庭。", "圜坛敢申昭报，方璧冀展虔情。", "丹襟式敷衷恳，玄鉴庶察微诚。"]}, {"title": "唐享昊天乐 第四", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["巍巍叡业广，赫赫圣基隆。", "菲德承先顾，祯符萃眇躬。", "铭开武岩侧，图荐洛川中。", "微诚讵幽感，景命忽昭融。", "有怀慙紫极，无以谢玄穹。"]}, {"title": "唐享昊天乐 第九", "author": "则天皇后", "type": "边塞", "diff": 3, "lines": ["荷恩承顾托，执契恭临抚。", "庙略静边荒，天兵曜神武。", "有截资先化，无为遵旧矩。", "祯符降昊穹，大业光寰宇。"]}, {"title": "唐明堂乐章 外办将出", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["总章陈昔典，衢室礼惟神。", "宏规则天地，神用叶陶钧。", "负扆三春旦，充庭万宇宾。", "顾己诚虚薄，空慙驭兆人。"]}, {"title": "唐明堂乐章 宫音", "author": "则天皇后", "type": "植物", "diff": 3, "lines": ["履艮包群望，居中冠百灵。", "万方资广运，庶品荷财成。", "神功谅匪测，盛德实难名。", "藻奠申诚敬，恭祀表惟馨。"]}, {"title": "唐大飨拜洛乐章 咸和", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["坎泽祠容备举，坤坛祭典爰申。", "灵睠遥行秘躅，嘉贶荐委殊珍。", "肃礼恭禋载展，翘襟邈志逾殷。", "方期交际悬应。"]}, {"title": "唐大飨拜洛乐章 拜洛", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["菲躬承睿顾，薄德忝坤仪。", "干干遵后命，翼翼奉先规。", "抚俗勤虽切，还淳化尚亏。", "未能弘至道，何以契明只。"]}, {"title": "唐大飨拜洛乐章 德和", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["夕惕同龙契，晨兢当凤扆。", "崇儒习旧规，偃伯循先旨。", "绝壤飞冠盖，遐区丽山水。", "幸承三圣余，忻属千年始。"]}, {"title": "唐武氏享先庙乐章", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["先德谦㧑冠昔，严规节素超今。", "奉国忠诚每竭，承家至孝纯深。", "追崇惧乖尊意，显号恐玷徽音。", "既迫王公屡请，方乃俯遂群心。", "有限无由展敬，奠醑每阙亲斟。", "大礼虔申典册，苹藻敬荐翘襟。"]}, {"title": "早春夜宴", "author": "则天皇后", "type": "植物", "diff": 3, "lines": ["九春开上节，千门敞夜扉。", "兰灯吐新燄，桂魄朗圆辉。", "送酒惟须满，流杯不用稀。", "务使霞浆兴，方乘泛洛归。"]}, {"title": "游九龙潭", "author": "则天皇后", "type": "植物", "diff": 3, "lines": ["山窗游玉女，涧户对琼峰。", "岩顶翔双凤，潭心倒九龙。", "酒中浮竹叶，杯上写芙蓉。", "故验家山赏，惟有风入松。"]}, {"title": "赠胡天师", "author": "则天皇后", "type": "边塞", "diff": 3, "lines": ["高人叶高志，山服往山家。", "迢迢间风月，去去隔烟霞。", "碧岫窥玄洞，玉灶炼丹砂。", "今日星津上，延首望灵槎。"]}, {"title": "从驾幸少林寺", "author": "则天皇后", "type": "植物", "diff": 3, "lines": ["陪銮游禁苑，侍赏出兰闱。", "云偃攒峰盖，霞低插浪旗。", "日宫疏涧户，月殿启岩扉。", "金轮转金地，香阁曳香衣。", "铎吟轻吹发，幡摇薄雾霏。", "昔遇焚芝火，山红连野飞。", "花台无半影，莲塔有全辉。", "实赖能仁力，攸资善世威。", "慈缘兴福绪，于此罄归依。", "风枝不可静，泣血竟何追。"]}, {"title": "石淙", "author": "则天皇后", "type": "田园", "diff": 3, "lines": ["三山十洞光玄箓，玉峤金峦镇紫微。", "均露均霜标胜壤，交风交雨列皇畿。", "万仞高岩藏日色，千寻幽涧浴云衣。", "且驻欢筵赏仁智，雕鞍薄晚杂尘飞。"]}, {"title": "九月十日偶书", "author": "后主煜", "type": "植物", "diff": 3, "lines": ["晚雨秋阴酒乍醒，感时心绪杳难平。", "黄花冷落不成艳，红叶飕飗竞鼓声。", "背世返能厌俗态，偶缘犹未忘多情。", "自从双鬓斑斑白，不学安仁却自惊。"]}, {"title": "秋莺", "author": "后主煜", "type": "植物", "diff": 3, "lines": ["残莺何事不知秋，横过幽林尚独游。", "老舌百般倾耳听，深黄一点入烟流。", "栖迟背世同悲鲁，浏亮如笙碎在缑。", "莫更留连好归去，露华凄冷蓼花愁。"]}, {"title": "病起题山舍壁", "author": "后主煜", "type": "田园", "diff": 3, "lines": ["山舍初成病乍轻，杖藜巾褐称闲情。", "炉开小火深回暖，沟引新流几曲声。", "暂约彭涓安朽质，终期宗远问无生。", "谁能役役尘中累，贪合鱼龙搆强名。"]}, {"title": "送邓王二十弟从益牧宣城", "author": "后主煜", "type": "田园", "diff": 3, "lines": ["且维轻舸更迟迟，别酒重倾惜解携。", "浩浪侵愁光荡漾，乱山凝恨色高低。", "君驰桧楫情何极，我凭阑干日向西。", "咫尺烟江几多地，不须怀抱重凄凄。"]}, {"title": "渡中江望石城泣下", "author": "后主煜", "type": "田园", "diff": 3, "lines": ["江南江北旧家乡，三十年来梦一场。", "吴苑宫闱今冷落，广陵台殿已荒凉。", "云笼远岫愁千片，雨打归舟泪万行。", "兄弟四人三百口，不堪闲坐细思量。"]}, {"title": "挽辞 一", "author": "后主煜", "type": "植物", "diff": 3, "lines": ["珠碎眼前珍，花凋世外春。", "未销心里恨，又失掌中身。", "玉笥犹残药，香匳已染尘。", "前哀将后感，无泪可沾巾。"]}, {"title": "挽辞 二", "author": "后主煜", "type": "田园", "diff": 3, "lines": ["艳质同芳树，浮危道略同。", "正悲春落实，又苦雨伤丛。", "秾丽今何在？飘零事已空。", "沈沈无问处，千载谢东风。"]}, {"title": "游后湖赏莲花", "author": "嗣主璟", "type": "植物", "diff": 3, "lines": ["蓼花蘸水火不灭，水鸟惊鱼银梭投。", "满目荷花千万顷，红碧相杂敷清流。", "孙武已斩吴宫女，琉璃池上佳人头。"]}, {"title": "保大五年元日大雪同太弟景遂汪王景逷齐王景逵进士李建勋中书徐铉勤政殿学士张义方登楼赋", "author": "嗣主璟", "type": "植物", "diff": 3, "lines": ["珠帘高卷莫轻遮，往往相逢隔岁华。", "春气昨宵飘律管，东风今日放梅花。", "素姿好把芳姿掩，落势还同舞势斜。", "坐有宾朋尊有酒，可怜清味属侬家。"]}, {"title": "帝京篇十首 一", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["秦川雄帝宅，函谷壮皇居。", "绮殿千寻起，离宫百雉余。", "连甍遥接汉，飞观迥凌虚。", "云日隐层阙，风烟出绮疏。"]}, {"title": "帝京篇十首 二", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["岩廊罢机务，崇文聊驻辇。", "玉匣启龙图，金绳披凤篆。", "韦编断仍续，缥帙舒还卷。", "对此乃淹留，欹案观坟典。"]}, {"title": "帝京篇十首 三", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["移步出词林，停舆欣武宴。", "雕弓写明月，骏马疑流电。", "惊雁落虚弦，啼猿悲急箭。", "阅赏诚多美，于兹乃忘倦。"]}, {"title": "帝京篇十首 四", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["鸣笳临乐馆，眺听欢芳节。", "急管韵朱弦，清歌凝白雪。", "彩凤肃来仪，玄鹤纷成列。", "去兹郑卫声，雅音方可悦。"]}, {"title": "帝京篇十首 五", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["芳辰追逸趣，禁苑信多奇。", "桥形通汉上，峰势接云危。", "烟霞交隐映，花鸟自参差。", "何如肆辙迹？万里赏瑶池。"]}, {"title": "帝京篇十首 六", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["飞盖去芳园，兰桡游翠渚。", "萍间日彩乱，荷处香风举。", "桂楫满中川，弦歌振长屿。", "岂必汾河曲，方为欢宴所。"]}, {"title": "帝京篇十首 七", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["落日双阙昏，回舆九重暮。", "长烟散初碧，皎月澄轻素。", "搴幌玩琴书，开轩引云雾。", "斜汉耿层阁，清风摇玉树。"]}, {"title": "帝京篇十首 八", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["欢乐难再逢，芳辰良可惜。", "玉酒泛云罍，兰殽陈绮席。", "千钟合尧禹，百兽谐金石。", "得志重寸阴，忘怀轻尺璧。"]}, {"title": "帝京篇十首 九", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["建章欢赏夕，二八尽妖妍。", "罗绮昭阳殿，芬芳玳瑁筵。", "珮移星正动，扇掩月初圆。", "无劳上悬圃，即此对神仙。"]}, {"title": "帝京篇十首 十", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["以兹游观极，悠然独长想。", "披卷览前踪，抚躬寻既往。", "望古茅茨约，瞻今兰殿广。", "人道恶高危，虚心戒盈荡。", "奉天竭诚敬，临民思惠养。", "纳善察忠谏，明科慎刑赏。", "六五诚难继，四三非易仰。", "广待淳化敷，方嗣云亭响。"]}, {"title": "饮马长城窟行", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["塞外悲风切，交河冰已结。", "瀚海百重波，阴山千里雪。", "迥戍危烽火，层峦引高节。", "悠悠卷斾旌，饮马出长城。", "寒沙连骑迹，朔吹断边声。", "胡尘清玉塞，羌笛韵金钲。", "绝漠干戈戢，车徒振原隰。", "都尉反龙堆，将军旋马邑。", "扬麾氛雾静，纪石功名立。", "荒裔一戎衣，灵台凯歌入。"]}, {"title": "执契静三边", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["执契静三边，持衡临万姓。", "玉彩辉关烛，金华流日镜。", "无为宇宙清，有美璇玑正。", "皎佩星连景，飘衣云结庆。", "戢武耀七德，升文辉九功。", "烟波澄旧碧，尘火息前红。", "霜野韬莲剑，关城罢月弓。", "钱缀榆天合，新城柳塞空。", "花销葱岭雪，縠尽流沙雾。", "秋驾转兢怀，春冰弥轸虑。", "书绝龙庭羽，烽休凤穴戍。", "衣宵寝二难，食旰餐三惧。", "翦暴兴先废，除凶存昔亡。", "圆盖归天壤，方舆入地荒。", "孔海池京邑，双河沼帝乡。", "循躬思励己，抚俗媿时康。", "元首伫盐梅，股肱惟辅弼。", "羽贤崆岭四，翼圣襄城七。", "浇俗庶反淳，替文聊就质。", "已知隆至道，共欢区宇一。"]}, {"title": "正日临朝", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["条风开献节，灰律动初阳。", "百蛮奉遐賮，万国朝未央。", "虽无舜禹迹，幸欣天地康。", "车轨同八表，书文混四方。", "赫奕俨冠盖，纷纶盛服章。", "羽旄飞驰道，钟鼓震岩廊。", "组练辉霞色，霜戟耀朝光。", "晨宵怀至理，终媿抚遐荒。"]}, {"title": "幸武功庆善宫", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["寿丘惟旧迹，酆邑乃前基。", "粤予承累圣，悬弧亦在兹。", "弱龄逢运改，提剑郁匡时。", "指麾八荒定，怀柔万国夷。", "梯山咸入款，驾海亦来思。", "单于陪武帐，日逐卫文㮰。", "端扆朝四岳，无为任百司。", "霜节明秋景，轻冰结水湄。", "芸黄徧原隰，禾颖积京畿。", "共乐还乡宴，欢比大风诗。"]}, {"title": "重幸武功", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["代马依朔吹，惊禽愁昔丛。", "况兹承眷德，怀旧感深衷。", "积善忻余庆，畅武悦成功。", "垂衣天下治，端拱车书同。", "白水巡前迹，丹陵幸旧宫。", "列筵欢故老，高宴聚新丰。", "驻跸抚田畯，回舆访牧童。", "瑞气萦丹阙，祥烟散碧空。", "孤屿含霜白，遥山带日红。", "于焉欢击筑，聊以咏南风。"]}, {"title": "经破薛举战地", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["昔年怀壮气，提戈初仗节。", "心随朗日高，志与秋霜洁。", "移锋惊电起，转战长河决。", "营碎落星沈，阵卷横云裂。", "一挥氛沴静，再举鲸鲵灭。", "于兹俯旧原，属目驻华轩。", "沈沙无故迹，减灶有残痕。", "浪霞穿水净，峰雾抱莲昏。", "世途亟流易，人事殊今昔。", "长想眺前踪，抚躬聊自适。"]}, {"title": "过旧宅二首 一", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["新丰停翠辇，谯邑驻鸣笳。", "园荒一径断，苔古半阶斜。", "前池消旧水，昔树发今花。", "一朝辞此地，四海遂为家。"]}, {"title": "过旧宅二首 二", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["金舆巡白水，玉辇驻新丰。", "纽落藤披架，花残菊破丛。", "叶铺荒草蔓，流竭半池空。", "纫珮兰凋径，舒圭叶翦桐。", "昔地一蕃内，今宅九围中。", "架海波澄镜，韬戈器反农。", "八表文同轨，无劳歌大风。"]}, {"title": "还陕述怀", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["慨然抚长剑，济世岂邀名。", "星旗纷电举，日羽肃天行。", "徧野屯万骑，临原驻五营。", "登山麾武节，背水纵神兵。", "在昔戎戈动，今来宇宙平。"]}, {"title": "入潼关", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["崤函称地险，襟带壮两京。", "霜峰直临道，冰河曲绕城。", "古木参差影，寒猿断续声。", "冠盖往来合，风尘朝夕惊。", "高谈先马度，伪晓预鸡鸣。", "弃𦈡怀远志，封泥负壮情。", "别有真人气，安知名不名。"]}, {"title": "辽城望月", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["玄兔月初明，澄辉照辽碣。", "映云光暂隐，隔树花如缀。", "魄满桂枝圆，轮亏镜彩缺。", "临城却影散，带晕重围结。", "驻跸俯九都，停观妖氛灭。"]}, {"title": "春日登陕州城楼俯眺原野回丹碧缀烟霞密翠斑红芳菲花柳即目川岫聊以命篇", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["碧原开雾隰，绮岭峻霞城。", "烟峰高下翠，日浪浅深明。", "斑红妆橤树，圆青压溜荆。", "迹岩劳傅想，窥野访莘情。", "巨川何以济，舟楫伫时英。"]}, {"title": "春日玄武门宴群臣", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["韶光开令序，淑气动芳年。", "驻辇华林侧，高宴柏梁前。", "紫庭文珮满，丹墀衮绂连。", "九夷簉瑶席，五狄列琼筵。", "娱宾歌湛露，广乐奏钧天。", "清尊浮绿醑，雅曲韵朱弦。", "粤余君万国，还慙抚八埏。", "庶几保贞固，虚己厉求贤。"]}, {"title": "登三台言志", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["未央初壮汉，阿房昔侈秦。", "在危犹骋丽，居奢遂役人。", "岂如家四海，日宇罄朝伦。", "扇天裁户旧，砌地翦基新。", "引月擎宵桂，飘云逼曙鳞。", "露除光炫玉，霜阙映雕银。", "舞接花梁燕，歌迎鸟路尘。", "镜池波太液，庄苑丽宜春。", "作异甘泉日，停非路寝辰。", "念劳慙逸己，居旷返劳神。", "所欣成大厦，宏材伫渭滨。"]}, {"title": "出猎", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["楚王云梦泽，汉帝长杨宫。", "岂若因农暇，阅武出轘嵩。", "三驱陈锐卒，七萃列材雄。", "寒野霜氛白，平原烧火红。", "雕戈夏服箭，羽骑绿沈弓。", "怖兽潜幽壑，惊禽散翠空。", "长烟晦落景，灌木振严风。", "所为除民瘼，非是悦林丛。"]}, {"title": "冬狩", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["烈烈寒风起，惨惨飞云浮。", "霜浓凝广隰，冰厚结清流。", "金鞍移上苑，玉勒骋平畴。", "旌旗四望合，罝罗一面求。", "楚踣争兕殪，秦亡角鹿愁。", "兽忙投密树，鸿惊起砾洲。", "骑敛原尘静，戈回岭日收。", "心非洛汭逸，意在渭滨游。", "禽荒非所乐，抚辔更招忧。"]}, {"title": "春日望海", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["披襟眺沧海，凭轼玩春芳。", "积流横地纪，疏派引天潢。", "仙气凝三岭，和风扇八荒。", "拂潮云布色，穿浪日舒光。", "照岸花分彩，迷云雁断行。", "怀卑运深广，持满守灵长。", "有形非易测，无源讵可量。", "洪涛经变野，翠岛屡成桑。", "之罘思汉帝，碣石想秦皇。", "霓裳非本意，端拱且图王。"]}, {"title": "临洛水", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["春搜驰骏骨，总辔俯长河。", "霞处流萦锦，风前瀁卷罗。", "水花翻照树，堤兰倒插波。", "岂必汾阴曲，秋云发棹歌。"]}, {"title": "望终南山", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["重峦俯渭水，碧嶂插遥天。", "出红扶岭日，入翠贮岩烟。", "叠松朝若夜，复岫阙疑全。", "对此恬千虑，无劳访九仙。"]}, {"title": "元日", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["高轩暧春色，邃阁媚朝光。", "彤庭飞彩斾，翠幌曜明珰。", "恭己临四极，垂衣驭八荒。", "霜戟列丹陛，丝竹韵长廊。", "穆矣熏风茂，康哉帝道昌。", "继文遵后轨，循古鉴前王。", "草秀故春色，梅艳昔年妆。", "巨川思欲济，终以寄舟航。"]}, {"title": "初春登楼即目观作述怀", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["凭轩俯兰阁，眺瞩散灵襟。", "绮峰含翠雾，照日蕊红林。", "镂丹霞锦岫，残素雪斑岑。", "拂浪堤垂柳，娇花鸟续吟。", "连甍岂一拱，众干如千寻。", "明非独材力，终藉栋梁深。", "弥怀矜乐志，更惧戒盈心。", "媿制劳居逸，方规十产金。"]}, {"title": "首春", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["寒随穷律变，春逐鸟声开。", "初风飘带柳，晚雪间花梅。", "碧林青旧竹，绿沼翠新苔。", "芝田初雁去，绮树巧鸎来。"]}, {"title": "初晴落景", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["晚霞聊自怡，初晴弥可喜。", "日晃百花色，风动千林翠。", "池鱼跃不同，园鸟声还异。", "寄言博通者，知予物外志。"]}, {"title": "初夏", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["一朝春夏改，隔夜鸟花迁。", "阴阳深浅叶，晓夕重轻烟。", "哢鸎犹响殿，横丝正网天。", "珮高兰影接，绶细草纹连。", "碧鳞惊櫂侧，玄燕舞檐前。", "何必汾阳处，始复有山泉。"]}, {"title": "度秋", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["夏律昨留灰，秋箭今移晷。", "峨嵋岫初出，洞庭波渐起。", "桂白发幽岩，菊黄开灞涘。", "运流方可叹，含毫属微理。"]}, {"title": "仪鸾殿早秋", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["寒惊蓟门叶，秋发小山枝。", "松阴背日转，竹影避风移。", "提壶菊花岸，高兴芙蓉池。", "欲知凉气早，巢空燕不窥。"]}, {"title": "秋日即目", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["爽气浮丹阙，秋光澹紫宫。", "衣碎荷疏影，花明菊点丛。", "袍轻低草露，盖侧舞松风。", "散岫飘云叶，迷路飞烟鸿。", "砌冷兰凋佩，闺寒树陨桐。", "别鹤栖琴里，离猿啼峡中。", "落野飞星箭，弦虚半月弓。", "芳菲夕雾起，暮色满房栊。"]}, {"title": "山阁晚秋", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["山亭秋色满，岩牖凉风度。", "疏兰尚染烟，残菊犹承露。", "古石衣新苔，新巢封古树。", "历览情无极，咫尺输光暮。"]}, {"title": "秋暮言志", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["朝光浮烧野，霜华净碧空。", "结浪冰初镜，在迳菊方丛。", "约岭烟深翠，分旗霞散红。", "抽思滋泉侧，飞想傅岩中。"]}, {"title": "喜雪", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["碧昏朝合雾，丹卷暝韬霞。", "结叶繁云色，凝璚徧雪华。", "光楼皎若粉，映幕集疑沙。", "泛柳飞飞絮，妆梅片片花。", "照璧台圆月，飘珠箔穿露。", "瑶洁短长阶，玉藂高下树。", "映桐珪累白，萦峰莲抱素。", "断续气将沈，徘徊岁云暮。", "怀珍媿隐德，表瑞伫丰年。", "橤间飞禁苑，鹤处舞伊川。", "傥咏幽兰曲，同懽黄竹篇。"]}, {"title": "秋日𢽾庾信体", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["岭衔宵月桂，珠穿晓露丛。", "蝉啼觉树冷，萤火不温风。", "花生圆菊橤，荷尽戏鱼通。", "晨浦鸣飞雁，夕渚集栖鸿。", "飒飒高天吹，氛澄下炽空。"]}, {"title": "赋尚书", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["崇文时驻步，东观还停辇。", "辍膳玩三坟，晖灯披五典。", "寒心覩肉林，飞魄看沈湎。", "纵情昏主多，克己明君鲜。", "灭身资累恶，成名由积善。", "既承百王末，战兢随岁转。"]}, {"title": "咏司马彪续汉志", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["二仪初创象，三才乃分位。", "非惟树司牧，固亦垂文字。", "緜代更膺期，芳图无辍记。", "炎汉承君道，英谟纂神器。", "潜龙既可跃，逵兔奚难致。", "前史殚妙词，后昆沈雅思。", "书言扬盛迹，补阙兴洪志。", "川谷犹旧途，郡国开新意。", "梅山未觉朽，谷水谁云异。", "车服随名表，文物因时置。", "凤戟翼康衢，銮舆总柔辔。", "清浊必能澄，洪纤幸无弃。", "观仪不失序，遵礼方由事。", "政宣竹律和，时平玉条备。", "文囿雕奇彩，艺门蕴深致。", "云飞星共流，风扬月兼至。", "类禋遵令典，坛壝资良地。", "五胜竟无违，百司诚有庇。", "粤予承暇景，谈丛引泉秘。", "讨论穷义府，看核披经笥。", "大辨良难仰，小学终先匮。", "闻道谅知荣，含毫孰忘媿。"]}, {"title": "咏风", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["萧条起关塞，摇飏下蓬瀛。", "拂林花乱彩，响谷鸟分声。", "披云罗影散，泛水织文生。", "劳歌大风曲，威加四海清。"]}, {"title": "咏雨", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["罩云飘远岫，喷雨泛长河。", "低飞昏岭腹，斜足洒岩阿。", "泫丛珠缔叶，起溜镜图波。", "蒙柳添丝密，含吹织空罗。"]}, {"title": "咏雪", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["洁野凝晨曜，装墀带夕晖。", "集条分树玉，拂浪影泉玑。", "色洒妆台粉，花飘绮席衣。", "入扇萦离匣，点素皎残机。"]}, {"title": "赋得夏首启节", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["北阙三春晚，南荣九夏初。", "黄莺弄渐变，翠林花落余。", "瀑流还响谷，猿啼自应虚。", "早荷向心卷，长杨就影舒。", "此时欢不极，调轸坐相于。"]}, {"title": "赋得白日半西山", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["红轮不暂驻，乌飞岂复停。", "岑霞渐渐落，溪阴寸寸生。", "藿叶随光转，葵心逐照倾。", "晚烟含树色，栖鸟杂流声。"]}, {"title": "置酒坐飞阁", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["高轩临碧渚，飞檐迥架空。", "余花攒镂槛，残柳散雕栊。", "岸菊初含橤，园梨始带红。", "莫虑昆山暗，还共尽杯中。"]}, {"title": "采芙蓉", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["结伴戏方塘，携手上雕航。", "船移分细浪，风散动浮香。", "游鸎无定曲，惊凫有乱行。", "莲稀钏声断，水广櫂歌长。", "栖乌还密树，泛流归建章。"]}, {"title": "赋得樱桃", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["华林满芳景，洛阳徧阳春。", "朱颜含远日，翠色影长津。", "乔柯啭娇鸟，低枝映美人。", "昔作园中实，今来席上珍。"]}, {"title": "赋得李", "author": "太宗皇帝", "type": "动物", "diff": 3, "lines": ["玉衡流桂圃，成蹊正可寻。", "鸎啼密叶外，蝶戏脆花心。", "丽景光朝彩，轻霞散夕阴。", "暂顾晖章侧，还眺灵山林。"]}, {"title": "赋得浮桥", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["岸曲非千里，桥斜异七星。", "暂低逢辇度，还高值浪惊。", "水摇文鹢动，缆转锦花萦。", "远近随轮影，轻重应人行。"]}, {"title": "谒幷州大兴国寺诗", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["回銮游福地，极目玩芳晨。", "梵钟交二响，法日转双轮。", "宝刹遥承露，天花近足春。", "未佩兰犹小，无丝柳尚新。", "圆光低月殿，碎影乱风筠。", "对此留余想，超然离俗尘。"]}, {"title": "咏兴国寺佛殿前幡", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["拂霞疑电落，腾虚状写虹。", "屈伸烟雾里，低举白云中。", "纷披乍依迥，掣曳或随风。", "念兹轻薄质，无翅强摇空。"]}, {"title": "望送魏征葬", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["阊阖总金鞍，上林移玉辇。", "野郊怆新别，河桥非旧饯。", "惨日映峰沈，愁云随盖转。", "哀笳时断续，悲旌乍舒卷。", "望望情何极，浪浪泪空泫。", "无复昔时人，芳春共谁遣。"]}, {"title": "伤辽东战亡", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["凿门初奉律，仗战始临戎。", "振鳞方跃浪，骋翼正凌风。", "未展六奇术，先亏一篑功。", "防身岂乏智，殉命有余忠。"]}, {"title": "月晦", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["晦魄移中律，凝暄起丽城。", "罩云朝盖上，穿露晓珠呈。", "笑树花分色，啼枝鸟合声。", "披襟欢眺望，极目畅春情。"]}, {"title": "秋日翠微宫", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["秋光凝翠岭，凉吹肃离宫。", "荷疏一盖缺，树冷半帷空。", "侧阵移鸿影，圆花钉菊丛。", "摅怀俗尘外，高眺白云中。"]}, {"title": "初秋夜坐", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["斜廊连绮阁，初月照宵帏。", "塞冷鸿飞疾，园秋蝉噪迟。", "露结林疏叶，寒轻菊吐滋。", "愁心逢此节，长叹独含悲。"]}, {"title": "秋日二首 一", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["菊散金风起，荷疏玉露圆。", "将秋数行雁，离夏几林蝉。", "云凝愁半岭，霞碎缬高天。", "还似成都望，直见峨眉前。"]}, {"title": "秋日二首 二", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["爽气澄兰沼，秋风动桂林。", "露凝千片玉，菊散一丛金。", "日岫高低影，云空点缀阴。", "蓬瀛不可望，泉石且娱心。"]}, {"title": "冬日临昆明池", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["石鲸分玉溜，劫烬隐平沙。", "柳影冰无叶，梅心冻有花。", "寒野凝朝雾，霜天散夕霞。", "欢情犹未极，落景遽西斜。"]}, {"title": "望雪", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["冻云宵徧岭，素雪晓凝华。", "入牖千重碎，迎风一半斜。", "不妆空散粉，无树独飘花。", "萦空慙夕照，破彩谢晨霞。"]}, {"title": "守岁", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["暮景斜芳殿，年华丽绮宫。", "寒辞去冬雪，暖带入春风。", "阶馥舒梅素，盘花卷烛红。", "共欢新故岁，迎送一宵中。"]}, {"title": "除夜", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["岁阴穷暮纪，献节启新芳。", "冬尽今宵促，年开明日长。", "冰消出镜水，梅散入风香。", "对此欢终宴，倾壶待曙光。"]}, {"title": "赋得含峰云", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["翠楼含晓雾，莲峰带晚云。", "玉叶依岩聚，金枝触石分。", "横天结阵影，逐吹起罗文。", "非复阳台下，空将惑楚君。"]}, {"title": "三层阁上置音声", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["绮筵移暮景，紫阁引宵烟。", "隔栋歌尘合，分阶舞影连。", "声流三处管，响乱一重弦。", "不似秦楼上，吹箫空学仙。"]}, {"title": "远山澄碧雾", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["残云收翠岭，夕雾结长空。", "带岫凝全碧，障霞隐半红。", "髣髴分初月，飘飖度晓风。", "还因三里处，冠盖远相通。"]}, {"title": "赋得花庭雾", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["兰气已熏宫，新橤半妆丛。", "色含轻重雾，香引去来风。", "拂树浓舒碧，萦花薄蔽红。", "还当杂行雨，髣髴隐遥空。"]}, {"title": "春池柳", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["年柳变池台，隋堤曲直回。", "逐浪丝阴去，迎风带影来。", "疏黄一鸟弄，半翠几眉开。", "萦雪临春岸，参差间早梅。"]}, {"title": "芳兰", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["春晖开紫苑，淑景媚兰场。", "映庭含浅色，凝露泫浮光。", "日丽参差影，风传轻重香。", "会须君子折，佩里作芬芳。"]}, {"title": "咏桃", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["禁苑春晖丽，花蹊绮树妆。", "缀条深浅色，点露参差光。", "向日分千笑，迎风共一香。", "如何仙岭侧，独秀隐遥芳。"]}, {"title": "赋帘", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["参差垂玉阙，舒卷映兰宫。", "珠光摇素月，竹影乱清风。", "彩散银钩上，文斜桂户中。", "惟当杂罗绮，相与媚房栊。"]}, {"title": "咏乌代陈师道", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["凌晨丽城去，薄暮上林栖。", "辞枝枝暂起，停树树还低。", "向日终难托，迎风讵肯迷。", "只待纤纤手，曲里作宵啼。"]}, {"title": "咏饮马", "author": "太宗皇帝", "type": "田园", "diff": 3, "lines": ["骏骨饮长泾，奔流洒络缨。", "细纹连喷聚，乱荇绕蹄萦。", "水光鞍上侧，马影溜中横。", "翻似天池里，腾波龙种生。"]}, {"title": "赋得残菊", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["阶兰凝曙霜，岸菊照晨光。", "露浓晞晚笑，风劲浅残香。", "细叶凋轻翠，圆花飞碎黄。", "还持今岁色，复结后年芳。"]}, {"title": "赋秋日悬清光赐房玄龄", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["秋露凝高掌，朝光上翠微。", "参差丽双阙，照耀满重闱。", "仙驭随轮转，灵乌带影飞。", "临波无定彩，入隙有圆晖。", "还当葵藿志，倾叶自相依。"]}, {"title": "琵琶", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["半月无双影，全花有四时。", "摧藏千里态，掩抑几重悲。", "促节萦红袖，清音满翠帷。", "驶弹风响急，缓曲钏声迟。", "空余关陇恨，因此代相思。"]}, {"title": "宴中山", "author": "太宗皇帝", "type": "边塞", "diff": 3, "lines": ["驱马出辽阳，万里转旗常。", "对敌六奇举，临戎八阵张。", "斩鲸澄碧海，卷雾扫扶桑。", "昔去兰萦翠，今来桂染芳。", "云芝浮碎叶，冰镜上朝光。", "回首长安道，方欢宴柏梁。"]}, {"title": "饯中书侍郎来济", "author": "太宗皇帝", "type": "植物", "diff": 3, "lines": ["暧暧去尘昏灞岸，飞飞轻盖指河梁。", "云峰衣结千重叶，雪岫花开几树妆。", "深悲黄鹤孤舟远，独叹青山别路长。", "聊将分袂沾巾泪，还用持添离席觞。"]}, {"title": "虚池驿题屏风", "author": "宜芬公主", "type": "边塞", "diff": 3, "lines": ["出嫁辞乡国，由来此别难。", "圣恩愁远道，行路泣相看。", "沙塞容颜尽，边隅粉黛残。", "妾心何所断，他日望长安。"]}, {"title": "百丈山", "author": "宣宗皇帝", "type": "田园", "diff": 3, "lines": ["大雄真迹枕危峦，梵宇层楼耸万般。", "日月每从肩上过，山河长在掌中看。", "仙峰不间三春秀，灵境何时六月寒？", "更有上方人罕到，暮钟朝磬碧云端。"]}, {"title": "吊白居易", "author": "宣宗皇帝", "type": "边塞", "diff": 3, "lines": ["缀玉联珠六十年，谁教冥路作诗仙。", "浮云不系名居易，造化无为字乐天。", "童子解吟《长恨曲》，胡儿能唱《琵琶篇》。", "文章已满行人耳，一度思卿一怆然。"]}, {"title": "幸华严寺", "author": "宣宗皇帝", "type": "田园", "diff": 3, "lines": ["云散晴山几万重，烟收春色更冲融。", "帐殿出空登碧汉，遐川俯望色蓝笼。", "林光入户低韶景，岭气通宵展霁风。", "今日追游何所似，莫慙汉武赏汾中。"]}, {"title": "奉和御制麟德殿宴百官", "author": "尚宫宋氏若宪", "type": "植物", "diff": 3, "lines": ["端拱承休命，时清荷圣皇。", "四聪闻受谏，五服远朝王。", "景媚莺初啭，春残日更长。", "命筵多济济，盛乐复锵锵。", "酆镐谁将敌，横汾未可方。", "愿齐山岳寿，祉福永无疆。"]}, {"title": "奉和御制麟德殿宴百僚应制", "author": "尚宫宋氏若昭", "type": "田园", "diff": 3, "lines": ["垂衣临八极，肃穆四门通。", "自是无为化，非关辅弼功。", "修文招隐伏，尚武殄妖凶。", "德炳韶光炽，恩沾雨露浓。", "衣冠陪御宴，礼乐盛朝宗。", "万寿称觞举，千年信一同。"]}, {"title": "长门怨", "author": "徐贤妃", "type": "田园", "diff": 3, "lines": ["旧爱柏梁台，新宠昭阳殿。", "守分辞芳辇，含情泣团扇。", "一朝歌舞荣，夙昔诗书贱。", "颓恩诚已矣，覆水难重荐。"]}, {"title": "秋风函谷应诏", "author": "徐贤妃", "type": "植物", "diff": 3, "lines": ["秋风起函谷，劲气动河山。", "偃松千岭上，杂雨二陵间。", "低云愁广隰，落日惨重关。", "此时飘紫气，应验真人还。"]}, {"title": "赋得北方有佳人", "author": "徐贤妃", "type": "植物", "diff": 3, "lines": ["由来称独立，本自号倾城。", "柳叶眉间发，桃花脸上生。", "腕摇金钏响，步转玉环鸣。", "纤腰宜宝袜，红衫艳织成。", "悬知一顾重，别觉舞腰轻。"]}, {"title": "中和节日宴百僚赐诗", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["韶年启仲序，初吉谐良辰。", "肇兹中和节，式庆天地春。", "欢酣朝野同，生德区宇均。", "云开洒膏露，草疏芳河津。", "岁华今载阳，东作方肆勤。", "慙非熏风唱，曷用慰吾人。"]}, {"title": "中和节赐百官燕集因示所怀", "author": "德宗皇帝", "type": "动物", "diff": 3, "lines": ["至化恒在宥，保和兹息人。", "推诚抚诸夏，与物长为春。", "仲月风景暖，禁城花柳新。", "芳时协金奏，赐宴同群臣。", "丝竹岂云乐，忠贤惟所亲。", "庶洽朝野意，旷然天地均。"]}, {"title": "重阳日赐宴曲江亭赋六韵诗用清字", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["早衣对庭燎，躬化勤意诚。", "时此万机暇，适与佳节幷。", "曲池洁寒流，芳菊舒金英。", "乾坤爽气满，台殿秋光清。", "朝野庆年丰，高会多欢声。", "永怀无荒戒，良士同斯情。"]}, {"title": "九月十八赐百僚追赏因书所怀", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["雨霁霜气肃，天高云日明。", "繁林已坠叶，寒菊仍舒荣。", "懿此秋节时，更延追赏情。", "池台列广宴，丝竹传新声。", "至乐非外奖，浃欢同中诚。", "庶敦朝野意，永使风化清。"]}, {"title": "送徐州张建封还镇", "author": "德宗皇帝", "type": "田园", "diff": 3, "lines": ["牧守寄所重，才贤生为时。", "宣风自淮甸，授钺膺藩维。", "入觐展遐恋，临轩慰来思。", "忠诚在方寸，感激陈情词。", "报国尔所向，恤人予是资。", "欢宴不尽怀，车马当还期。", "谷雨将应候，行春犹未迟。", "勿以千里遥，而云无己知。"]}, {"title": "麟德殿宴百僚", "author": "德宗皇帝", "type": "田园", "diff": 3, "lines": ["忧勤承圣绪，开泰喜时康。", "恭己临群后，垂衣御八荒。", "务闲春向暮，朝罢日犹长。", "紫殿初筵列，彤庭广乐张。", "成功归辅弼，致理赖忠良。", "共此欢娱事，千秋乐未央。"]}, {"title": "元日退朝观军仗归营", "author": "德宗皇帝", "type": "田园", "diff": 3, "lines": ["献岁视元朔，万方咸在庭。", "端旒揖群后，回辇阅师贞。", "彩仗宿华殿，退朝归禁营。", "分行左右出，转斾风云生。", "历历趋复道，容容映层城。", "勇余矜捷技，令肃无喧声。", "眷此戎旅节，载嘉良士诚。", "顺时倾宴赏，亦以助文经。"]}, {"title": "中和节赐群臣宴赋七韵", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["东风变梅柳，万汇生春光。", "中和纪月令，方与天地长。", "耽乐岂予尚，懿兹时景良。", "庶遂亭育恩，同致寰海康。", "君臣永终始，交泰符阴阳。", "曲沼水新碧，华林桃稍芳。", "胜赏信多欢，戒之在无荒。"]}, {"title": "三日书怀因示百僚", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["佳节上元巳，芳时属暮春。", "流觞想兰亭，捧剑得金人。", "风轻水初绿，日晴花更新。", "天文信昭回，皇道颇敷陈。", "恭己每从俭，清心常保真。", "戒兹游衍乐，书以示群臣。"]}, {"title": "重阳日中外同欢以诗言志因示群官", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["[爽]节在重九，物华新雨余。", "清秋黄叶下，菊散金潭初。", "万实行就稔，百工欣所如。", "欢心畅遐迩，殊俗同车书。", "至化自敦睦，佳辰宜宴胥。", "锵锵间丝竹，济济罗簪裾。", "此乐匪足耽，此诚期永孚。"]}, {"title": "重阳日即事", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["令节晓澄霁，四郊烟霭空。", "天清白露洁，菊散黄金丛。", "寡德荷天贶，顺时休百工。", "岂怀歌钟乐，思为君臣同。", "至化在亭育，相成资始终。", "未知康衢咏，所仰惟年丰。"]}, {"title": "丰年多庆九日示怀", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["爽气肃时令，早衣闻朔鸿。", "重阳有佳节，具物欣年丰。", "皎洁暮潭色，芬敷新菊丛。", "芳尊满衢室，繁吹凝烟空。", "惠合信吾道，保和惟尔同。", "推诚至玄化，天下期为公。"]}, {"title": "七月十五日题章敬寺", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["招提迩皇邑，复道连重城。", "法筵会早秋，驾言访禅扃。", "尝闻大仙教，清净宗无生。", "七物匪吾宝，万行先求成。", "名相既双寂，繁华奚所荣。", "金风扇微凉，远烟凝翠晶。", "松院静苔色，竹房深磬声。", "境幽真虑恬，道胜外物轻。", "意适本非说，含毫空复情。"]}, {"title": "中春麟德殿会百僚观新乐诗一章章十六句", "author": "德宗皇帝", "type": "植物", "diff": 3, "lines": ["芳岁肇佳节，物华当仲春。", "乾坤既昭泰，烟景含氤氲。", "德浅荷玄贶，乐成思治人。", "前庭列钟鼓，广殿延群臣。", "八卦随舞意，五音转曲新。", "顾非咸池奏，庶协南风熏。", "式宴礼所重，浃欢情必均。", "同和谅在兹，万国希可亲。"]}, {"title": "暮春喜雨诗", "author": "文宗皇帝", "type": "田园", "diff": 3, "lines": ["风云喜际会，雷雨遂流滋。", "荐币虚陈礼，动天实精思。", "渐侵九夏节，复在三春时。", "霡霂垂朱阙，飘飖入绿墀。", "郊坰既沾足，黍稷有丰期。", "百辟同康乐，万方伫雍熙。"]}, {"title": "春游曲", "author": "文德皇后", "type": "动物", "diff": 3, "lines": ["上苑桃花朝日明，兰闺艳妾动春情。", "井上新桃偷面色，檐边嫩柳学身轻。", "花中来去看舞蝶，树上长短听啼莺。", "林下何须远借问，出众风流旧有名。"]}, {"title": "过晋阳宫", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["缅想封唐处，实惟建国初。", "俯察伊晋野，仰观乃参虚。", "井邑龙斯跃，城池凤翔余。", "林塘犹沛泽，台榭宛旧居。", "运革祚中否，时迁命兹符。", "顾循承丕构，怵惕多忧虞。", "尚恐威不逮，复虑化未孚。", "岂徒劳辙迹，所期训戎车。", "习俗问黎人，亲巡慰里闾。", "永言念成功，颂德临康衢。", "长怀经纶日，叹息履庭隅。", "艰难安可忘，欲去良踟蹰。"]}, {"title": "行次成皋途经先圣擒建德之所缅思功业感而赋诗", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["有隋政昏虐，群雄已交争。", "先圣按剑起，叱咤风云生。", "饮马河洛竭，作气嵩华惊。", "克敌睿图就，擒俘帝道亨。", "顾慙嗣宝历，恭承天下平。", "幸过翦鲸地，感慕神且英。"]}, {"title": "校猎义成喜逢大雪率题九韵以示群官", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["弧矢威天下，旌旗游近县。", "一面施鸟罗，三驱教人战。", "暮云成积雪，晓色开行殿。", "皓然原隰同，不觉林野变。", "北风勇士马，东日华组练。", "触地银麞出，连山缟鹿见。", "月兔落高矰，星狼下急箭。", "既欣盈尺兆，复忆磻谿便。", "岁丰将遇贤，俱荷皇天眷。"]}, {"title": "赐诸州刺史以题座右", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["眷言思共理，鉴梦想维良。", "猗欤此推择，声绩著周行。", "贤能既俟进，黎献实伫康。", "视人当如子，爱人亦如伤。", "讲学试诵论，阡陌劝耕桑。", "虚誉不可饰，清知不可忘。", "求名迹易见，安贞德自彰。", "讼狱必以情，教民贵有常。", "恤惸且存老，抚弱复绥强。", "勉哉各只命，知予眷万方。"]}, {"title": "送忠州太守康昭远等", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["端拱临中枢，缅怀共予理。", "不有台阁英，孰振循良美。", "分符侯甸内，拜手明庭里。", "誓节期饮冰，调人方导水。", "嘉声驰九牧，惠化光千祀。", "时雨侔昔贤，芳猷贯前史。", "伫尔颂中和，吾将令卿士。"]}, {"title": "送李邕之任滑台", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["汉家重东郡，宛彼白马津。", "黎庶既蕃殖，临之劳近臣。", "远别初首路，今行方及春。", "课成应第一，良牧尔当仁。"]}, {"title": "端午三殿宴群臣探得神字", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["五月符天数，五音调夏钧。", "旧来传五日，无事不称神。", "穴枕通灵气，长丝续命人。", "四时花竞巧，九子粽争新。", "方殿临华节，圆宫宴雅臣。", "进对一言重，遒文六义陈。", "股肱良足咏，风化可还淳。"]}, {"title": "温汤对雪", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["北风吹同云，同云飞白雪。", "白雪乍回散，同云何惨烈。", "未见温泉冰，宁知火井灭。", "表瑞良在兹，庶几可怡悦。"]}, {"title": "登蒲州逍遥楼", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["长榆息烽火，高柳静风尘。", "卜征巡九洛，展豫出三秦。", "昔是潜龙地，今为上理辰。", "时平乘道泰，聊赏遇年春。", "黄河分地络，飞观接天津。", "一览遗芳翰，千载肃如神。"]}, {"title": "经河上公庙", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["昔闻有耆叟，河上独遗荣。", "迹与尘嚻隔，心将道德幷。", "讵以天地累，宁为宠辱惊。", "矫然翔寥廓，如何屈坚贞。", "玄玄妙门启，肃肃祠宇清。", "冥漠无先后，那能纪姓名。"]}, {"title": "过王濬暮", "author": "明皇帝", "type": "动物", "diff": 3, "lines": ["吴国分牛斗，晋室命龙骧。", "受任敌已灭，策勋名不彰。", "居美未尽善，矜功徒自伤。", "长戟今何在？孤坟此路傍。", "不观松柏茂，空余荆棘场。", "叹嗟悬剑陇，谁识梦刀祥。"]}, {"title": "初入秦川路逢寒食", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["洛阳芳树映天津，灞岸垂杨窣地新。", "直为经过行处乐，不知虚度两京春。", "去年余闰今春早，曙色和风著花草。", "可怜寒食与清明，光辉幷在长安道。", "自从关路入秦川，争道何人不戏鞭。", "公子途中妨蹴踘，佳人马上废秋千。", "渭水长桥今欲渡，葱葱渐见新丰树。", "远看骊岫入云霄，预想汤池起烟雾。", "烟雾氛氲水殿开，暂拂香轮归去来。", "今岁清明行已晚，明年寒食更相陪。"]}, {"title": "春台望", "author": "明皇帝", "type": "动物", "diff": 3, "lines": ["暇景属三春，高台聊四望。", "目极千里际，山川一何壮。", "太华见重岩，终南分叠嶂。", "郊原纷绮错，参差多异状。", "佳气满通沟，迟步入绮楼。", "初鸎一一鸣红树，归雁双双去绿洲。", "太液池中下黄鹤，昆明水上映牵牛。", "闻道汉家全盛日，别馆离宫趣非一。", "甘泉逶迤亘明光，五柞连延接未央。", "周庐徼道纵横转，飞阁回轩左右长。", "须念作劳居者逸，勿言我后焉能恤。", "为想雄豪壮柏梁，何如俭陋卑茅室。", "阳乌黯黯向山沈，夕鸟喧喧入上林。", "薄暮赏余回步辇，还念中人罢百金。"]}, {"title": "过大哥宅探得歌字韵", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["鲁卫情先重，亲贤爱转多。", "冕旒丰暇日，乘景暂经过。", "戚里申高宴，平台奏雅歌。", "复寻为善乐，方验保山河。"]}, {"title": "同玉真公主过大哥山池", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["地有招贤处，人传乐善名。", "鹜池临九达，龙岫对层城。", "桂月先秋冷，苹风向晚清。", "凤楼遥可见，仿佛玉箫声。"]}, {"title": "经邹鲁祭孔子而叹之", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["夫子何为者？栖栖一代中。", "地犹鄹氏邑，宅即鲁王宫。", "叹凤嗟身否，伤麟怨道穷。", "今看两楹奠，当与梦时同。"]}, {"title": "惟此温泉是称愈疾岂予独受其福思与兆人共之乘暇巡游乃言其志", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["桂殿与山连，兰汤涌自然。", "阴崖含秀色，温谷吐潺湲。", "绩为蠲邪著，功因养正宣。", "愿言将亿兆，同此共昌延。"]}, {"title": "旋师喜捷", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["边服胡尘起，长安汉将飞。", "龙蛇开阵法，貔虎振军威。", "诈虏脑涂地，征夫血染衣。", "今朝书奏入，明日凯歌归。"]}, {"title": "过老子庙", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["仙居怀圣德，灵庙肃神心。", "草合人踪断，尘浓鸟迹深。", "流沙丹灶没，关路紫烟沈。", "独伤千载后，空余松柏林。"]}, {"title": "途次陕州", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["境出三秦外，途分二陕中。", "山川入虞虢，风俗限西东。", "树古棠阴在，耕余让畔空。", "鸣笳从此去，行见洛阳宫。"]}, {"title": "野次喜雪", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["拂曙辟行宫，寒皋野望通。", "繁云低远岫，飞雪舞长空。", "赋象恒依物，萦回屡逐风。", "为知勤恤意，先此示年丰。"]}, {"title": "送贺知章归四明", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["遗荣期入道，辞老竟抽簪。", "岂不惜贤达，其如高尚心。", "寰中得秘要，方外散幽襟。", "独有青门饯，群僚怅别深。"]}, {"title": "轩游宫十五夜", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["行迈离秦国，巡方赴洛师。", "路逢三五夜，春色暗中期。", "关外长河转，宫中淑气迟。", "歌钟对明月，不减旧游时。"]}, {"title": "观拔河俗戏", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["壮徒恒贾勇，拔拒抵长河。", "欲练英雄志，须明胜负多。", "噪齐山岌嶪，气作水腾波。", "预期年岁稔，先此乐时和。"]}, {"title": "同刘晃喜雨", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["节变寒初尽，时和气已春。", "繁云先合寸，膏雨自依旬。", "飒飒飞平野，霏霏静暗尘。", "悬知花叶意，朝夕望中新。"]}, {"title": "千秋节赐群臣镜", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["铸得千秋镜，光生百炼金。", "分将赐群后，遇象见清心。", "台上冰华澈，窗中月影临。", "更衔长绶带，留意感人深。"]}, {"title": "赐道士邓紫阳", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["太乙三门诀，元君六甲符。", "下传金版术，上刻玉清书。", "有美探真士，囊中得
