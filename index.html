秘书。", "自知三醮后，翊我灭残胡。"]}, {"title": "幸蜀西至剑门", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["剑阁横云峻，銮舆出狩回。", "翠屏千仞合，丹嶂五丁开。", "灌木萦旗转，仙云拂马来。", "乘时方在德，嗟尔勒铭才。"]}, {"title": "答司马承祯上剑镜", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["宝照含天地，神剑合阴阳。", "日月丽光景，星斗裁文章。", "写鉴表容质，佩服为身防。", "从兹一赏玩，永德保龄长。"]}, {"title": "送赵法师还蜀因名山奠简", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["道家奠灵简，自昔仰神仙。", "真子今将命，苍生福可传。", "江山寻故国，城郭信依然。", "二室遥相望，云回洞里天。"]}, {"title": "送道士薛季昌还山", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["洞府修真客，衡阳念旧居。", "将成金阙要，愿奉玉清书。", "云路三天近，松溪万籁虚。", "犹期传秘诀，来往候仙舆。"]}, {"title": "送玄同真人李抱朴谒灊山仙祠", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["城阙天中近，蓬瀛海上遥。", "归期千载鹤，春至一来朝。", "采药逢三秀，餐霞卧九霄。", "参同如有旨，金鼎待君烧。"]}, {"title": "春日出苑游瞩", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["三阳丽景早芳辰，四序佳园物候新。", "梅花百树障去路，垂柳千条暗回津。", "鸟飞直为惊风叶，鱼没都由怯岸人。", "惟愿圣主南山寿，何愁不赏万年春。"]}, {"title": "春晚宴两相及礼官丽正殿学士探得风字", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["乾道运无穷，恒将人代工。", "阴阳调历象，礼乐报玄穹。", "介胄清荒外，衣冠佐域中。", "言谈延国辅，词赋引文雄。", "野霁伊川绿，郊明巩树红。", "冕旒多暇景，诗酒会春风。"]}, {"title": "首夏花萼楼观群臣宴宁王山亭回楼下又申之以赏乐赋诗", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["今年通闰月，入夏展春辉。", "楼下风光晚，城隅宴赏归。", "九歌扬政要，六舞散朝衣。", "天喜时相合，人和事不违。", "礼中推意厚，乐处感心微。", "别赏阳台乐，前旬暮雨飞。"]}, {"title": "同二相已下群官乐游园宴", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["撰日岩廊暇，需云宴乐初。", "万方朝玉帛，千品会簪裾。", "地入南山近，城分北斗余。", "池塘垂柳密，原隰野花疏。", "帟幕看逾暗，歌钟听自虚。", "兴阑归骑转，还奏弼违书。"]}, {"title": "集贤书院成送张说上集贤学士赐宴得珍字", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["广学开书院，崇儒引席珍。", "集贤招衮职，论道命台臣。", "礼乐沿今古，文章革旧新。", "献酬尊俎列，宾主位班陈。", "节变云初夏，时移气尚春。", "所希光史册，千载仰兹晨。"]}, {"title": "王屋山送道士司马承祯还天台", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["紫府求贤士，清谿祖逸人。", "江湖与城阙，异迹且殊伦。", "间有幽栖者，居然厌俗尘。", "林泉先得性，芝桂欲调神。", "地道逾稽岭，天台接海滨。", "音徽从此间，万古一芳春。"]}, {"title": "早度蒲津关", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["钟鼓严更曙，山河野望通。", "鸣銮下蒲坂，飞斾入秦中。", "地险关逾壮，天平镇尚雄。", "春来津树合，月落戍楼空。", "马色分朝景，鸡声逐晓风。", "所希常道泰，非复候𦈡同。"]}, {"title": "途经华岳", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["饬驾去京邑，鸣鸾指洛川。", "循途经太华，回跸暂周旋。", "翠崿留斜影，悬岩冒夕烟。", "四方皆石壁，五位配金天。", "仿佛看高掌，依稀听子先。", "终当铭岁月，从此记灵仙。"]}, {"title": "喜雪", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["日观卜先征，时巡顺物情。", "风行未备礼，云密遽飘霙。", "委树寒花发，萦空落絮轻。", "朝如玉已会，庭似月犹明。", "既覩肤先合，还欣尺有盈。", "登封何以报？因此谢功成。"]}, {"title": "幸凤泉汤", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["西狩观周俗，南山历汉宫。", "荐鲜知路近，省敛觉年丰。", "阴谷含神爨，汤泉养圣功。", "益龄仙井合，愈疾醴源通。", "不重鸣岐凤，谁矜陈宝雄。", "愿将无限泽，沾沐众心同。"]}, {"title": "南出雀鼠谷答张说", "author": "明皇帝", "type": "动物", "diff": 3, "lines": ["雷出应乾象，风行顺国人。", "川途犹在晋，车马渐归秦。", "背陕关山险，横汾鼓吹频。", "草依阳谷变，花待北岩春。", "闻有鹓鸾客，清词雅调新。", "求音思欲报，心迹竟难陈。"]}, {"title": "赐崔日知往潞州", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["潞国开新府，壶关宠旧林。", "妙旌循吏德，持悦庶氓心。", "礼乐中朝贵，神明列郡钦。", "扬风非赠扇，易俗是张琴。", "藩镇讴谣满，行宫雨露深。", "会书丞相策，先赐颍川金。"]}, {"title": "为赵法师别造精院过院赋诗", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["宗师心物外，为道运虚舟。", "不恋岩泉赏，来从宫禁游。", "探玄知几岁，习静更宜秋。", "烟树辨朝色，风湍闻夜流。", "坐朝繁听览，寻胜在清幽。", "欲广无为化，因兹庶可求。"]}, {"title": "端午", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["端午临中夏，时清日复长。", "盐梅已佐鼎，曲糵且传觞。", "事古人留迹，年深缕积长。", "当轩知槿茂，向水觉芦香。", "亿兆同归寿，群公共保昌。", "忠贞如不替，贻厥后昆芳。"]}, {"title": "春中兴庆宫酺宴", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["九达长安道，三阳别馆春。", "还将听朝暇，回作豫游晨。", "不战要荒服，无刑礼乐新。", "合酺覃土宇，欢宴接群臣。", "玉斝飞千日，琼筵荐八珍。", "舞衣云曳影，歌扇月开轮。", "伐鼓鱼龙杂，撞钟角觝陈。", "曲终酣兴晚，须有醉归人。"]}, {"title": "千秋节宴", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["兰殿千秋节，称名万寿觞。", "风传率土庆，日表继天祥。", "玉宇开花蕚，宫县动会昌。", "衣冠白鹭下，帟幕翠云长。", "献遗成新俗，朝仪入旧章。", "月衔花绶镜，露缀彩丝囊。", "处处祠田祖，年年宴杖乡。", "深思一德事，小获万人康。"]}, {"title": "左丞相说右丞相璟太子少傅乾曜同日上官命宴东堂赐诗", "author": "明皇帝", "type": "田园", "diff": 3, "lines": ["赤帝收三杰，黄轩举二臣。", "由来丞相重，分掌国之钧。", "我有握中璧，双飞席上珍。", "子房推道要，仲子讶风神。", "复辍台衡老，将为调护人。", "鹓鸾同拜日，车骑拥行尘。", "乐聚南宫宴，觞连北斗醇。", "俾予成百揆，垂拱问彝伦。"]}, {"title": "早登太行山中言志", "author": "明皇帝", "type": "动物", "diff": 3, "lines": ["清跸度河阳，凝笳上太行。", "火龙明鸟道，铁骑绕羊肠。", "白雾埋阴壑，丹霞助晓光。", "涧泉含宿冻，山木带余霜。", "野老茅为屋，樵人薜作裳。", "宣风问耆艾，敦俗劝耕桑。", "凉德慙先哲，徽猷慕昔皇。"]}, {"title": "平胡", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["杂虏忽猖狂，无何敢乱常。", "羽书朝继入，烽火夜相望。", "将出凶门勇，兵因死地强。", "蒙轮皆突骑，按剑尽鹰扬。", "鼓角雄山野，龙蛇入战场。", "流膏润沙漠，溅血染锋铓。", "雾扫清玄塞，云开静朔方。", "武功今已立，文德愧前王。"]}, {"title": "游兴庆宫作", "author": "明皇帝", "type": "动物", "diff": 3, "lines": ["代邸青门右，离宫紫陌陲。", "庭如过沛日，水若渡江时。", "绮观连鸡岫，朱楼接雁池。", "从来敦棣蕚，今此茂荆枝。", "万叶传余庆，千年志不移。", "凭轩聊属目，轻辇共追随。", "务本方崇训，相辉保羽仪。", "时康俗易渐，德薄政难施。", "鼓吹迎飞盖，弦歌送羽巵。", "所希覃率土，孝弟一同规。"]}, {"title": "送张说巡边", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["端拱复垂裳，长怀御远方。", "股肱申教义，戈剑靖要荒。", "命将绥边服，雄图出庙堂。", "三台入武帐，八座起文昌。", "宝胄匡韩主，华宗辅汉王。", "茂先慙博物，平子谢文章。", "尽节恢时佐，输诚御寇场。", "三军临朔野，驷马即戎行。", "鼓吹威夷狄，旌轩溢洛阳。", "云台先著美，今日更贻芳。"]}, {"title": "饯王晙巡边", "author": "明皇帝", "type": "边塞", "diff": 3, "lines": ["振武威荒服，扬文肃远墟。", "金坛申将礼，玉节授军符。", "免胄三方外，衔刀万里余。", "昔时吴会静，今日虏庭虚。", "分阃仍推毂，援桴且训车。", "风扬旌斾远，雨洗甲兵初。", "坐见台阶谧，行闻祅祲除。", "檄来虽插羽，箭去亦飞书。", "舟檝功须著，盐梅望匪疏。", "不应陈七德，欲使化先敷。"]}, {"title": "巡省途次上党旧宫赋", "author": "明皇帝", "type": "动物", "diff": 3, "lines": ["三千初击浪，九万欲抟空。", "天地犹惊否，阴阳始遇蒙。", "存贞期历试，佐贰伫昭融。", "多谢时康理，良慙实赖功。", "长怀问鼎气，夙负拔山雄。", "不学刘琨舞，先歌汉祖风。", "英髦既包括，豪杰自牢笼。", "人事一朝异，讴歌四海同。", "如何昔朱邸，今此作离宫？", "雁沼澄澜翠，猿岩落照红。", "小山秋桂馥，长坂旧兰丛。", "即是淹留处，乘欢乐未穷。"]}, {"title": "鹡鸰颂", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["伊我轩宫，奇树青葱。", "蔼周庐兮，冒霜停雪，以茂以悦。", "恣卷舒兮，连枝同荣，吐绿含英。", "曜春初兮，蓐收御节，寒露微结。", "气清虚兮，桂宫兰殿，唯所息宴。", "栖雍渠兮，行摇飞鸣，急难有情。", "情有余兮，顾惟德凉，夙夜兢惶。", "慙化疏兮，上之所教，下之所效。", "实在予兮，天伦之性，鲁卫分政。", "亲贤居兮，爰游爰处，爰笑爰语。", "巡庭除兮，观此翔禽，以悦我心，良史书兮。"]}, {"title": "句", "author": "明皇帝", "type": "植物", "diff": 3, "lines": ["昔见漳滨卧，言将人事违。", "今逢庆诞日，犹谓学仙归。", "棠棣花重发，鸰原鸟再飞。", "德比代云布，心如晋水清。"]}, {"title": "忆江南", "author": "白居易", "lines": ["江南好，风景旧曾谙。", "日出江花红胜火，春来江水绿如蓝。", "能不忆江南？"], "type": "江南", "diff": 3}, {"title": "石淙", "author": "睿宗皇帝", "type": "边塞", "diff": 3, "lines": ["奇峰嶾嶙箕山北，秀崿岹峣嵩镇南。", "地首地肺何曾拟，天目天台倍觉慙。", "树影蒙茏鄣叠岫，波深汹涌落悬潭。", "□愿紫宸居得一，永欣丹扆御通三。"]}, {"title": "赐梨李泌与诸王联句", "author": "肃宗皇帝", "type": "田园", "diff": 3, "lines": ["先生年几许，颜色似童儿。", "夜抱九仙骨，朝披一品衣。", "不食千锺粟，唯餐两颗梨。", "天生此间气，助我化无为。"]}, {"title": "奉和圣制过温汤", "author": "越王贞", "type": "田园", "diff": 3, "lines": ["凤辇腾宸驾，骊籞次干游。", "坎德疏温液，山隈派暖流。", "寒氛空外拥，蒸气沼中浮。", "林凋帷影散，云敛盖阴收。", "霜郊畅玄览，参差落景遒。"]}, {"title": "奉和同太子监守违恋", "author": "韩王元嘉", "type": "边塞", "diff": 3, "lines": ["乾象开层构，离明启少阳。", "卜征从献吉，守器属元良。", "逖矣凌周诵，遥哉掩汉庄。", "好士倾南洛，多才盛北场。", "地分丹鹫岭，途间白云乡。", "储诚虔晓夕，宸爱积炎凉。", "珠璧连霄汉，万物仰重光。"]}, {"title": "咏鹅", "author": "骆宾王", "lines": ["鹅，鹅，鹅，", "曲项向天歌。", "白毛浮绿水，红掌拨清波。"], "type": "动物", "diff": 3}, {"title": "太子纳妃太平公主出降", "author": "高宗皇帝", "type": "动物", "diff": 3, "lines": ["龙楼光曙景，鲁馆启朝扉。", "艳日浓妆影，低星降婺辉。", "玉庭浮瑞色，银牓藻祥徽。", "云转花萦盖，霞飘叶缀旗。", "雕轩回翠陌，宝驾归丹殿。", "鸣珠佩晓衣，镂璧轮开扇。", "华冠列绮筵，兰醑申芳宴。", "环阶凤乐陈，玳席珍羞荐。", "蝶舞袖香新，歌分落素尘。", "欢凝欢懿戚，庆叶庆初姻。", "暑阑炎气息，凉早吹疏频。", "方期六合泰，共赏万年春。"]}, {"title": "七夕宴悬圃二首 一", "author": "高宗皇帝", "type": "边塞", "diff": 3, "lines": ["羽盖飞天汉，凤驾越层峦。", "俱叹三秋阻，共叙一宵欢。", "璜亏夜月落，靥碎晓星残。", "谁能重操杼，纤手濯清澜。"]}, {"title": "七夕宴悬圃二首 二", "author": "高宗皇帝", "type": "边塞", "diff": 3, "lines": ["霓裳转云路，凤驾俨天潢。", "亏星凋夜靥，残月落朝璜。", "促欢今夕促，长离别后长。", "轻梭聊驻织，掩泪独悲伤。"]}, {"title": "过温汤", "author": "高宗皇帝", "type": "边塞", "diff": 3, "lines": ["温渚停仙跸，丰郊驻晓旌。", "路曲回输影，岩虚传漏声。", "暖溜惊湍驶，寒空碧雾轻。", "林黄疏叶下，野白曙霜明。", "眺听良无已，烟霞断续生。"]}, {"title": "九月九日", "author": "高宗皇帝", "type": "动物", "diff": 3, "lines": ["端居临玉扆，初律启金商。", "凤阙澄秋色，龙闱引夕凉。", "野净山气敛，林疏风露长。", "砌兰亏半影，岩桂发全香。", "满盖荷凋翠，圆花菊散黄。", "挥鞭争电烈，飞羽乱星光。", "柳空穿石碎，弦虚侧月张。", "怯猿啼落岫，惊雁断分行。", "斜轮低夕景，归斾拥通庄。"]}, {"title": "谒慈恩寺题奘法师房", "author": "高宗皇帝", "type": "植物", "diff": 3, "lines": ["停轩观福殿，游目眺皇畿。", "法轮含日转，花盖接云飞。", "翠烟香绮阁，丹霞光宝衣。", "幡虹遥合彩，定水迥分晖。", "萧然登十地，自得会三归。"]}, {"title": "谒大慈恩寺", "author": "高宗皇帝", "type": "植物", "diff": 3, "lines": ["日宫开万仞，月殿耸千寻。", "花盖飞团影，幡虹曳曲阴。", "绮霞遥笼帐，丛珠细网林。", "寥廓烟云表，超然物外心。"]}, {"title": "守岁", "author": "高宗皇帝", "type": "植物", "diff": 3, "lines": ["今宵冬律尽，来朝丽景新。", "花余凝地雪，条含煖吹分。", "绶吐芽犹嫩，冰□已镂津。", "薄红梅色冷，浅绿柳轻春。", "送迎交两节，暄寒变一辰。"]}, {"title": "奉和麟德殿宴百僚应[制]", "author": "鲍氏君徽", "type": "植物", "diff": 3, "lines": ["睿泽先寰海，功成展武韶。", "戈鋋清外垒，文物盛中朝。", "圣祚山河固，宸章日月昭。", "玉筵鸾鹄集，仙管凤皇调。", "御柳新低绿，宫莺乍啭娇。", "愿将[亿]兆庆，千祀奉神尧。"]}, {"title": "关山月", "author": "鲍氏君徽", "type": "边塞", "diff": 3, "lines": ["高高秋月明，北照辽阳城。", "塞迥光初满，风多晕更生。", "征人望乡思，战马闻鼙惊。", "朔风悲边草，胡沙暗虏营。", "霜凝匣中剑，风惫原上旌。", "早晚谒金阙，不闻刁斗声。"]}, {"title": "惜花吟", "author": "鲍氏君徽", "type": "动物", "diff": 3, "lines": ["枝上花，花下人，可怜颜色俱青春。", "昨日看花花灼灼，今朝看花花欲落。", "不如尽此花下欢，莫待春风总吹却。", "莺歌蝶舞韶光长，红炉煑茗松花香。", "妆成罢吟恣游后，独把芳枝归洞房。"]}, {"title": "东亭茶宴", "author": "鲍氏君徽", "type": "田园", "diff": 3, "lines": ["闲朝向晓出帘栊，茗宴东亭四望通。", "远眺城池山色里，俯聆弦管水声中。", "幽篁引沼新抽翠，芳槿低檐欲吐红。", "坐久此中无限兴，更怜团扇起清风。"]}, {"title": "黄鹤楼", "author": "崔颢", "lines": ["昔人已乘黄鹤去，此地空余黄鹤楼。", "黄鹤一去不复返，白云千载空悠悠。", "晴川历历汉阳树，芳草萋萋鹦鹉洲。", "日暮乡关何处是，烟波江上使人愁。"], "type": "怀古", "diff": 4}, {"title": "春夜喜雨", "author": "杜甫", "lines": ["好雨知时节，当春乃发生。", "随风潜入夜，润物细无声。", "野径云俱黑，江船火独明。", "晓看红湿处，花重锦官城。"], "type": "春天", "diff": 4}, {"title": "赋得古原草送别", "author": "白居易", "lines": ["离离原上草，一岁一枯荣。", "野火烧不尽，春风吹又生。", "远芳侵古道，晴翠接荒城。", "又送王孙去，萋萋满别情。"], "type": "送别", "diff": 4}];

</script>
<script>
// 诗词补充库：义务教育必背 + 名家名篇 + 毛泽东诗词（追加到 window.POEMS）
// 与 poems_data.js 一样，拼音在运行时由 pinyin-pro 生成，无需手工标注。
(function () {
  var EXTRA = [
    // ===== 毛泽东 =====
    { title: "沁园春·雪", author: "毛泽东", type: "励志", diff: 5, lines: ["北国风光，千里冰封，万里雪飘。", "望长城内外，惟余莽莽；大河上下，顿失滔滔。", "山舞银蛇，原驰蜡象，欲与天公试比高。", "须晴日，看红装素裹，分外妖娆。", "江山如此多娇，引无数英雄竞折腰。", "惜秦皇汉武，略输文采；唐宗宋祖，稍逊风骚。", "一代天骄，成吉思汗，只识弯弓射大雕。", "俱往矣，数风流人物，还看今朝。"] },
    { title: "沁园春·长沙", author: "毛泽东", type: "励志", diff: 5, lines: ["独立寒秋，湘江北去，橘子洲头。", "看万山红遍，层林尽染；漫江碧透，百舸争流。", "鹰击长空，鱼翔浅底，万类霜天竞自由。", "怅寥廓，问苍茫大地，谁主沉浮？", "携来百侣曾游，忆往昔峥嵘岁月稠。", "恰同学少年，风华正茂；书生意气，挥斥方遒。", "指点江山，激扬文字，粪土当年万户侯。", "曾记否，到中流击水，浪遏飞舟？"] },
    { title: "七律·长征", author: "毛泽东", type: "励志", diff: 3, lines: ["红军不怕远征难，万水千山只等闲。", "五岭逶迤腾细浪，乌蒙磅礴走泥丸。", "金沙水拍云崖暖，大渡桥横铁索寒。", "更喜岷山千里雪，三军过后尽开颜。"] },
    { title: "卜算子·咏梅", author: "毛泽东", type: "冬天", diff: 2, lines: ["风雨送春归，飞雪迎春到。", "已是悬崖百丈冰，犹有花枝俏。", "俏也不争春，只把春来报。", "待到山花烂漫时，她在丛中笑。"] },
    { title: "忆秦娥·娄山关", author: "毛泽东", type: "励志", diff: 4, lines: ["西风烈，长空雁叫霜晨月。", "霜晨月，马蹄声碎，喇叭声咽。", "雄关漫道真如铁，而今迈步从头越。", "从头越，苍山如海，残阳如血。"] },
    { title: "采桑子·重阳", author: "毛泽东", type: "秋天", diff: 3, lines: ["人生易老天难老，岁岁重阳。", "今又重阳，战地黄花分外香。", "一年一度秋风劲，不似春光。", "胜似春光，寥廓江天万里霜。"] },
    { title: "清平乐·六盘山", author: "毛泽东", type: "励志", diff: 3, lines: ["天高云淡，望断南飞雁。", "不到长城非好汉，屈指行程二万。", "六盘山上高峰，红旗漫卷西风。", "今日长缨在手，何时缚住苍龙？"] },
    { title: "浪淘沙·北戴河", author: "毛泽东", type: "励志", diff: 4, lines: ["大雨落幽燕，白浪滔天，秦皇岛外打鱼船。", "一片汪洋都不见，知向谁边？", "往事越千年，魏武挥鞭，东临碣石有遗篇。", "萧瑟秋风今又是，换了人间。"] },
    { title: "水调歌头·游泳", author: "毛泽东", type: "励志", diff: 5, lines: ["才饮长沙水，又食武昌鱼。", "万里长江横渡，极目楚天舒。", "不管风吹浪打，胜似闲庭信步，今日得宽余。", "子在川上曰：逝者如斯夫！", "风樯动，龟蛇静，起宏图。", "一桥飞架南北，天堑变通途。", "更立西江石壁，截断巫山云雨，高峡出平湖。", "神女应无恙，当惊世界殊。"] },
    { title: "念奴娇·昆仑", author: "毛泽东", type: "励志", diff: 5, lines: ["横空出世，莽昆仑，阅尽人间春色。", "飞起玉龙三百万，搅得周天寒彻。", "夏日消溶，江河横溢，人或为鱼鳖。", "千秋功罪，谁人曾与评说？", "而今我谓昆仑：不要这高，不要这多雪。", "安得倚天抽宝剑，把汝裁为三截？", "一截遗欧，一截赠美，一截还东国。", "太平世界，环球同此凉热。"] },
    { title: "菩萨蛮·大柏地", author: "毛泽东", type: "励志", diff: 3, lines: ["赤橙黄绿青蓝紫，谁持彩练当空舞？", "雨后复斜阳，关山阵阵苍。", "当年鏖战急，弹洞前村壁。", "装点此关山，今朝更好看。"] },
    { title: "如梦令·元旦", author: "毛泽东", type: "励志", diff: 3, lines: ["宁化、清流、归化，路隘林深苔滑。", "今日向何方，直指武夷山下。", "山下山下，风展红旗如画。"] },

    // ===== 李白 =====
    { title: "将进酒", author: "李白", type: "感慨", diff: 5, lines: ["君不见黄河之水天上来，奔流到海不复回。", "君不见高堂明镜悲白发，朝如青丝暮成雪。", "人生得意须尽欢，莫使金樽空对月。", "天生我材必有用，千金散尽还复来。", "烹羊宰牛且为乐，会须一饮三百杯。", "岑夫子，丹丘生，将进酒，杯莫停。", "与君歌一曲，请君为我倾耳听。", "钟鼓馔玉不足贵，但愿长醉不愿醒。", "古来圣贤皆寂寞，惟有饮者留其名。", "陈王昔时宴平乐，斗酒十千恣欢谑。", "主人何为言少钱，径须沽取对君酌。", "五花马，千金裘，呼儿将出换美酒，与尔同销万古愁。"] },
    { title: "蜀道难（节选）", author: "李白", type: "山水", diff: 5, lines: ["噫吁嚱，危乎高哉！蜀道之难，难于上青天！", "蚕丛及鱼凫，开国何茫然！", "尔来四万八千岁，不与秦塞通人烟。", "西当太白有鸟道，可以横绝峨眉巅。", "地崩山摧壮士死，然后天梯石栈相钩连。", "上有六龙回日之高标，下有冲波逆折之回川。", "黄鹤之飞尚不得过，猿猱欲度愁攀援。", "青泥何盘盘，百步九折萦岩峦。", "扪参历井仰胁息，以手抚膺坐长叹。"] },
    { title: "早发白帝城", author: "李白", type: "山水", diff: 2, lines: ["朝辞白帝彩云间，千里江陵一日还。", "两岸猿声啼不住，轻舟已过万重山。"] },
    { title: "望庐山瀑布", author: "李白", type: "山水", diff: 2, lines: ["日照香炉生紫烟，遥看瀑布挂前川。", "飞流直下三千尺，疑是银河落九天。"] },
    { title: "黄鹤楼送孟浩然之广陵", author: "李白", type: "送别", diff: 2, lines: ["故人西辞黄鹤楼，烟花三月下扬州。", "孤帆远影碧空尽，唯见长江天际流。"] },
    { title: "赠汪伦", author: "李白", type: "友情", diff: 2, lines: ["李白乘舟将欲行，忽闻岸上踏歌声。", "桃花潭水深千尺，不及汪伦送我情。"] },
    { title: "月下独酌（节选）", author: "李白", type: "月亮", diff: 3, lines: ["花间一壶酒，独酌无相亲。", "举杯邀明月，对影成三人。", "月既不解饮，影徒随我身。", "暂伴月将影，行乐须及春。"] },
    { title: "夜宿山寺", author: "李白", type: "想象", diff: 2, lines: ["危楼高百尺，手可摘星辰。", "不敢高声语，恐惊天上人。"] },
    { title: "秋浦歌", author: "李白", type: "愁绪", diff: 2, lines: ["白发三千丈，缘愁似个长。", "不知明镜里，何处得秋霜。"] },
    { title: "望天门山", author: "李白", type: "山水", diff: 2, lines: ["天门中断楚江开，碧水东流至此回。", "两岸青山相对出，孤帆一片日边来。"] },
    { title: "行路难（节选）", author: "李白", type: "励志", diff: 4, lines: ["金樽清酒斗十千，玉盘珍羞直万钱。", "停杯投箸不能食，拔剑四顾心茫然。", "欲渡黄河冰塞川，将登太行雪满山。", "闲来垂钓碧溪上，忽复乘舟梦日边。", "长风破浪会有时，直挂云帆济沧海。"] },
    { title: "春夜洛城闻笛", author: "李白", type: "思念", diff: 2, lines: ["谁家玉笛暗飞声，散入春风满洛城。", "此夜曲中闻折柳，何人不起故园情。"] },
    { title: "峨眉山月歌", author: "李白", type: "月亮", diff: 2, lines: ["峨眉山月半轮秋，影入平羌江水流。", "夜发清溪向三峡，思君不见下渝州。"] },
    { title: "闻王昌龄左迁龙标遥有此寄", author: "李白", type: "友情", diff: 2, lines: ["杨花落尽子规啼，闻道龙标过五溪。", "我寄愁心与明月，随君直到夜郎西。"] },
    { title: "渡荆门送别", author: "李白", type: "送别", diff: 3, lines: ["渡远荆门外，来从楚国游。", "山随平野尽，江入大荒流。", "月下飞天镜，云生结海楼。", "仍怜故乡水，万里送行舟。"] },

    // ===== 杜甫 =====
    { title: "春望", author: "杜甫", type: "感慨", diff: 3, lines: ["国破山河在，城春草木深。", "感时花溅泪，恨别鸟惊心。", "烽火连三月，家书抵万金。", "白头搔更短，浑欲不胜簪。"] },
    { title: "春夜喜雨", author: "杜甫", type: "春天", diff: 2, lines: ["好雨知时节，当春乃发生。", "随风潜入夜，润物细无声。", "野径云俱黑，江船火独明。", "晓看红湿处，花重锦官城。"] },
    { title: "绝句（两个黄鹂）", author: "杜甫", type: "春天", diff: 2, lines: ["两个黄鹂鸣翠柳，一行白鹭上青天。", "窗含西岭千秋雪，门泊东吴万里船。"] },
    { title: "江畔独步寻花", author: "杜甫", type: "春天", diff: 2, lines: ["黄四娘家花满蹊，千朵万朵压枝低。", "留连戏蝶时时舞，自在娇莺恰恰啼。"] },
    { title: "望岳", author: "杜甫", type: "山水", diff: 3, lines: ["岱宗夫如何？齐鲁青未了。", "造化钟神秀，阴阳割昏晓。", "荡胸生曾云，决眦入归鸟。", "会当凌绝顶，一览众山小。"] },
    { title: "登高", author: "杜甫", type: "秋天", diff: 4, lines: ["风急天高猿啸哀，渚清沙白鸟飞回。", "无边落木萧萧下，不尽长江滚滚来。", "万里悲秋常作客，百年多病独登台。", "艰难苦恨繁霜鬓，潦倒新停浊酒杯。"] },
    { title: "闻官军收河南河北", author: "杜甫", type: "感慨", diff: 3, lines: ["剑外忽传收蓟北，初闻涕泪满衣裳。", "却看妻子愁何在，漫卷诗书喜欲狂。", "白日放歌须纵酒，青春作伴好还乡。", "即从巴峡穿巫峡，便下襄阳向洛阳。"] },
    { title: "客至", author: "杜甫", type: "春天", diff: 2, lines: ["舍南舍北皆春水，但见群鸥日日来。", "花径不曾缘客扫，蓬门今始为君开。"] },
    { title: "绝句（江碧）", author: "杜甫", type: "春天", diff: 2, lines: ["江碧鸟逾白，山青花欲燃。", "今春看又过，何日是归年。"] },
    { title: "江南逢李龟年", author: "杜甫", type: "感慨", diff: 3, lines: ["岐王宅里寻常见，崔九堂前几度闻。", "正是江南好风景，落花时节又逢君。"] },
    { title: "茅屋为秋风所破歌（节选）", author: "杜甫", type: "感慨", diff: 5, lines: ["八月秋高风怒号，卷我屋上三重茅。", "茅飞渡江洒江郊，高者挂罥长林梢，下者飘转沉塘坳。", "安得广厦千万间，大庇天下寒士俱欢颜，风雨不动安如山！", "呜呼！何时眼前突兀见此屋，吾庐独破受冻死亦足！"] },

    // ===== 白居易 =====
    { title: "赋得古原草送别", author: "白居易", type: "送别", diff: 2, lines: ["离离原上草，一岁一枯荣。", "野火烧不尽，春风吹又生。", "远芳侵古道，晴翠接荒城。", "又送王孙去，萋萋满别情。"] },
    { title: "忆江南", author: "白居易", type: "江南", diff: 2, lines: ["江南好，风景旧曾谙。", "日出江花红胜火，春来江水绿如蓝。", "能不忆江南？"] },
    { title: "钱塘湖春行", author: "白居易", type: "春天", diff: 3, lines: ["孤山寺北贾亭西，水面初平云脚低。", "几处早莺争暖树，谁家新燕啄春泥。", "乱花渐欲迷人眼，浅草才能没马蹄。", "最爱湖东行不足，绿杨阴里白沙堤。"] },
    { title: "暮江吟", author: "白居易", type: "秋天", diff: 2, lines: ["一道残阳铺水中，半江瑟瑟半江红。", "可怜九月初三夜，露似真珠月似弓。"] },
    { title: "问刘十九", author: "白居易", type: "冬天", diff: 2, lines: ["绿蚁新醅酒，红泥小火炉。", "晚来天欲雪，能饮一杯无？"] },
    { title: "池上", author: "白居易", type: "儿童", diff: 1, lines: ["小娃撑小艇，偷采白莲回。", "不解藏踪迹，浮萍一道开。"] },
    { title: "琵琶行（节选）", author: "白居易", type: "感慨", diff: 5, lines: ["浔阳江头夜送客，枫叶荻花秋瑟瑟。", "千呼万唤始出来，犹抱琵琶半遮面。", "大弦嘈嘈如急雨，小弦切切如私语。", "同是天涯沦落人，相逢何必曾相识！"] },

    // ===== 杜牧 =====
    { title: "清明", author: "杜牧", type: "节日", diff: 2, lines: ["清明时节雨纷纷，路上行人欲断魂。", "借问酒家何处有，牧童遥指杏花村。"] },
    { title: "山行", author: "杜牧", type: "秋天", diff: 2, lines: ["远上寒山石径斜，白云生处有人家。", "停车坐爱枫林晚，霜叶红于二月花。"] },
    { title: "泊秦淮", author: "杜牧", type: "感慨", diff: 3, lines: ["烟笼寒水月笼沙，夜泊秦淮近酒家。", "商女不知亡国恨，隔江犹唱后庭花。"] },
    { title: "江南春", author: "杜牧", type: "春天", diff: 3, lines: ["千里莺啼绿映红，水村山郭酒旗风。", "南朝四百八十寺，多少楼台烟雨中。"] },
    { title: "秋夕", author: "杜牧", type: "秋天", diff: 2, lines: ["银烛秋光冷画屏，轻罗小扇扑流萤。", "天阶夜色凉如水，卧看牵牛织女星。"] },
    { title: "赤壁", author: "杜牧", type: "怀古", diff: 3, lines: ["折戟沉沙铁未销，自将磨洗认前朝。", "东风不与周郎便，铜雀春深锁二乔。"] },

    // ===== 王维 =====
    { title: "山居秋暝", author: "王维", type: "秋天", diff: 3, lines: ["空山新雨后，天气晚来秋。", "明月松间照，清泉石上流。", "竹喧归浣女，莲动下渔舟。", "随意春芳歇，王孙自可留。"] },
    { title: "送元二使安西", author: "王维", type: "送别", diff: 2, lines: ["渭城朝雨浥轻尘，客舍青青柳色新。", "劝君更尽一杯酒，西出阳关无故人。"] },
    { title: "九月九日忆山东兄弟", author: "王维", type: "思念", diff: 2, lines: ["独在异乡为异客，每逢佳节倍思亲。", "遥知兄弟登高处，遍插茱萸少一人。"] },
    { title: "竹里馆", author: "王维", type: "隐逸", diff: 2, lines: ["独坐幽篁里，弹琴复长啸。", "深林人不知，明月来相照。"] },
    { title: "鸟鸣涧", author: "王维", type: "春天", diff: 2, lines: ["人闲桂花落，夜静春山空。", "月出惊山鸟，时鸣春涧中。"] },
    { title: "使至塞上", author: "王维", type: "边塞", diff: 3, lines: ["单车欲问边，属国过居延。", "大漠孤烟直，长河落日圆。", "萧关逢候骑，都护在燕然。"] },

    // ===== 苏轼 =====
    { title: "水调歌头（明月几时有）", author: "苏轼", type: "月亮", diff: 4, lines: ["明月几时有？把酒问青天。", "不知天上宫阙，今夕是何年。", "我欲乘风归去，又恐琼楼玉宇，高处不胜寒。", "起舞弄清影，何似在人间。", "转朱阁，低绮户，照无眠。", "不应有恨，何事长向别时圆？", "人有悲欢离合，月有阴晴圆缺，此事古难全。", "但愿人长久，千里共婵娟。"] },
    { title: "念奴娇·赤壁怀古", author: "苏轼", type: "怀古", diff: 5, lines: ["大江东去，浪淘尽，千古风流人物。", "故垒西边，人道是，三国周郎赤壁。", "乱石穿空，惊涛拍岸，卷起千堆雪。", "江山如画，一时多少豪杰。", "遥想公瑾当年，小乔初嫁了，雄姿英发。", "羽扇纶巾，谈笑间，樯橹灰飞烟灭。", "故国神游，多情应笑我，早生华发。", "人生如梦，一尊还酹江月。"] },
    { title: "饮湖上初晴后雨", author: "苏轼", type: "山水", diff: 2, lines: ["水光潋滟晴方好，山色空蒙雨亦奇。", "欲把西湖比西子，淡妆浓抹总相宜。"] },
    { title: "题西林壁", author: "苏轼", type: "感慨", diff: 2, lines: ["横看成岭侧成峰，远近高低各不同。", "不识庐山真面目，只缘身在此山中。"] },
    { title: "六月二十七日望湖楼醉书", author: "苏轼", type: "自然", diff: 3, lines: ["黑云翻墨未遮山，白雨跳珠乱入船。", "卷地风来忽吹散，望湖楼下水如天。"] },
    { title: "惠崇春江晚景", author: "苏轼", type: "春天", diff: 2, lines: ["竹外桃花三两枝，春江水暖鸭先知。", "蒌蒿满地芦芽短，正是河豚欲上时。"] },

    // ===== 其他名家 / 义务教育必背 =====
    { title: "敕勒歌", author: "北朝民歌", type: "自然", diff: 1, lines: ["敕勒川，阴山下。", "天似穹庐，笼盖四野。", "天苍苍，野茫茫，风吹草低见牛羊。"] },
    { title: "江南", author: "汉乐府", type: "江南", diff: 1, lines: ["江南可采莲，莲叶何田田。", "鱼戏莲叶间。", "鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。"] },
    { title: "七步诗", author: "曹植", type: "感慨", diff: 2, lines: ["煮豆燃豆萁，豆在釜中泣。", "本是同根生，相煎何太急？"] },
    { title: "凉州词", author: "王之涣", type: "边塞", diff: 3, lines: ["黄河远上白云间，一片孤城万仞山。", "羌笛何须怨杨柳，春风不度玉门关。"] },
    { title: "登鹳雀楼", author: "王之涣", type: "励志", diff: 1, lines: ["白日依山尽，黄河入海流。", "欲穷千里目，更上一层楼。"] },
    { title: "春晓", author: "孟浩然", type: "春天", diff: 1, lines: ["春眠不觉晓，处处闻啼鸟。", "夜来风雨声，花落知多少。"] },
    { title: "宿建德江", author: "孟浩然", type: "愁绪", diff: 2, lines: ["移舟泊烟渚，日暮客愁新。", "野旷天低树，江清月近人。"] },
    { title: "出塞", author: "王昌龄", type: "边塞", diff: 3, lines: ["秦时明月汉时关，万里长征人未还。", "但使龙城飞将在，不教胡马度阴山。"] },
    { title: "芙蓉楼送辛渐", author: "王昌龄", type: "送别", diff: 3, lines: ["寒雨连江夜入吴，平明送客楚山孤。", "洛阳亲友如相问，一片冰心在玉壶。"] },
    { title: "别董大", author: "高适", type: "送别", diff: 3, lines: ["千里黄云白日曛，北风吹雁雪纷纷。", "莫愁前路无知己，天下谁人不识君。"] },
    { title: "枫桥夜泊", author: "张继", type: "愁绪", diff: 3, lines: ["月落乌啼霜满天，江枫渔火对愁眠。", "姑苏城外寒山寺，夜半钟声到客船。"] },
    { title: "游子吟", author: "孟郊", type: "抒情", diff: 2, lines: ["慈母手中线，游子身上衣。", "临行密密缝，意恐迟迟归。", "谁言寸草心，报得三春晖。"] },
    { title: "江雪", author: "柳宗元", type: "冬天", diff: 1, lines: ["千山鸟飞绝，万径人踪灭。", "孤舟蓑笠翁，独钓寒江雪。"] },
    { title: "寻隐者不遇", author: "贾岛", type: "隐逸", diff: 1, lines: ["松下问童子，言师采药去。", "只在此山中，云深不知处。"] },
    { title: "悯农", author: "李绅", type: "田园", diff: 1, lines: ["锄禾日当午，汗滴禾下土。", "谁知盘中餐，粒粒皆辛苦。"] },
    { title: "乐游原", author: "李商隐", type: "感慨", diff: 2, lines: ["向晚意不适，驱车登古原。", "夕阳无限好，只是近黄昏。"] },
    { title: "夜雨寄北", author: "李商隐", type: "思念", diff: 3, lines: ["君问归期未有期，巴山夜雨涨秋池。", "何当共剪西窗烛，却话巴山夜雨时。"] },
    { title: "泊船瓜洲", author: "王安石", type: "思念", diff: 3, lines: ["京口瓜洲一水间，钟山只隔数重山。", "春风又绿江南岸，明月何时照我还。"] },
    { title: "元日", author: "王安石", type: "节日", diff: 2, lines: ["爆竹声中一岁除，春风送暖入屠苏。", "千门万户曈曈日，总把新桃换旧符。"] },
    { title: "书湖阴先生壁", author: "王安石", type: "田园", diff: 3, lines: ["茅檐长扫净无苔，花木成畦手自栽。", "一水护田将绿绕，两山排闼送青来。"] },
    { title: "游园不值", author: "叶绍翁", type: "春天", diff: 2, lines: ["应怜屐齿印苍苔，小扣柴扉久不开。", "春色满园关不住，一枝红杏出墙来。"] },
    { title: "小池", author: "杨万里", type: "自然", diff: 2, lines: ["泉眼无声惜细流，树阴照水爱晴柔。", "小荷才露尖尖角，早有蜻蜓立上头。"] },
    { title: "晓出净慈寺送林子方", author: "杨万里", type: "自然", diff: 2, lines: ["毕竟西湖六月中，风光不与四时同。", "接天莲叶无穷碧，映日荷花别样红。"] },
    { title: "春日", author: "朱熹", type: "春天", diff: 2, lines: ["胜日寻芳泗水滨，无边光景一时新。", "等闲识得东风面，万紫千红总是春。"] },
    { title: "观书有感", author: "朱熹", type: "感慨", diff: 3, lines: ["半亩方塘一鉴开，天光云影共徘徊。", "问渠那得清如许？为有源头活水来。"] },
    { title: "题临安邸", author: "林升", type: "感慨", diff: 3, lines: ["山外青山楼外楼，西湖歌舞几时休。", "暖风熏得游人醉，直把杭州作汴州。"] },
    { title: "示儿", author: "陆游", type: "感慨", diff: 3, lines: ["死去元知万事空，但悲不见九州同。", "王师北定中原日，家祭无忘告乃翁。"] },
    { title: "秋夜将晓出篱门迎凉有感", author: "陆游", type: "感慨", diff: 3, lines: ["三万里河东入海，五千仞岳上摩天。", "遗民泪尽胡尘里，南望王师又一年。"] },
    { title: "四时田园杂兴", author: "范成大", type: "田园", diff: 2, lines: ["昼出耘田夜绩麻，村庄儿女各当家。", "童孙未解供耕织，也傍桑阴学种瓜。"] },
    { title: "村晚", author: "雷震", type: "田园", diff: 2, lines: ["草满池塘水满陂，山衔落日浸寒漪。", "牧童归去横牛背，短笛无腔信口吹。"] },
    { title: "所见", author: "袁枚", type: "儿童", diff: 1, lines: ["牧童骑黄牛，歌声振林樾。", "意欲捕鸣蝉，忽然闭口立。"] },
    { title: "舟过安仁", author: "杨万里", type: "儿童", diff: 2, lines: ["一叶渔船两小童，收篙停棹坐船中。", "怪生无雨都张伞，不是遮头是使风。"] },
    { title: "村居", author: "高鼎", type: "春天", diff: 2, lines: ["草长莺飞二月天，拂堤杨柳醉春烟。", "儿童散学归来早，忙趁东风放纸鸢。"] },
    { title: "天净沙·秋思", author: "马致远", type: "秋天", diff: 3, lines: ["枯藤老树昏鸦，小桥流水人家，古道西风瘦马。", "夕阳西下，断肠人在天涯。"] },
    { title: "满江红", author: "岳飞", type: "励志", diff: 5, lines: ["怒发冲冠，凭栏处、潇潇雨歇。", "抬望眼，仰天长啸，壮怀激烈。", "三十功名尘与土，八千里路云和月。", "莫等闲，白了少年头，空悲切。", "靖康耻，犹未雪。臣子恨，何时灭。", "驾长车，踏破贺兰山缺。", "壮志饥餐胡虏肉，笑谈渴饮匈奴血。", "待从头、收拾旧山河，朝天阙。"] },
    { title: "西江月·夜行黄沙道中", author: "辛弃疾", type: "自然", diff: 3, lines: ["明月别枝惊鹊，清风半夜鸣蝉。", "稻花香里说丰年，听取蛙声一片。", "七八个星天外，两三点雨山前。", "旧时茅店社林边，路转溪桥忽见。"] },
    { title: "破阵子", author: "辛弃疾", type: "励志", diff: 5, lines: ["醉里挑灯看剑，梦回吹角连营。", "八百里分麾下炙，五十弦翻塞外声，沙场秋点兵。", "马作的卢飞快，弓如霹雳弦惊。", "了却君王天下事，赢得生前身后名。可怜白发生！"] },
    { title: "永遇乐·京口北固亭怀古（节选）", author: "辛弃疾", type: "怀古", diff: 5, lines: ["千古江山，英雄无觅，孙仲谋处。", "舞榭歌台，风流总被，雨打风吹去。", "想当年，金戈铁马，气吞万里如虎。"] },
    { title: "青玉案·元夕", author: "辛弃疾", type: "节日", diff: 4, lines: ["东风夜放花千树，更吹落，星如雨。", "宝马雕车香满路。", "众里寻他千百度，蓦然回首，那人却在，灯火阑珊处。"] },
    { title: "如梦令", author: "李清照", type: "抒情", diff: 2, lines: ["常记溪亭日暮，沉醉不知归路。", "兴尽晚回舟，误入藕花深处。", "争渡，争渡，惊起一滩鸥鹭。"] },
    { title: "声声慢（节选）", author: "李清照", type: "愁绪", diff: 5, lines: ["寻寻觅觅，冷冷清清，凄凄惨惨戚戚。", "乍暖还寒时候，最难将息。", "梧桐更兼细雨，到黄昏、点点滴滴。"] },
    { title: "渔家傲·秋思", author: "范仲淹", type: "边塞", diff: 4, lines: ["塞下秋来风景异，衡阳雁去无留意。", "四面边声连角起。", "千嶂里，长烟落日孤城闭。", "浊酒一杯家万里，燕然未勒归无计。"] },
    { title: "陋室铭（节选）", author: "刘禹锡", type: "隐逸", diff: 3, lines: ["山不在高，有仙则名。水不在深，有龙则灵。", "斯是陋室，惟吾德馨。", "苔痕上阶绿，草色入帘青。"] },
    { title: "望洞庭", author: "刘禹锡", type: "秋天", diff: 2, lines: ["湖光秋月两相和，潭面无风镜未磨。", "遥望洞庭山水翠，白银盘里一青螺。"] },
    { title: "浪淘沙", author: "刘禹锡", type: "黄河", diff: 3, lines: ["九曲黄河万里沙，浪淘风簸自天涯。", "如今直上银河去，同到牵牛织女家。"] },
    { title: "竹石", author: "郑燮", type: "励志", diff: 2, lines: ["咬定青山不放松，立根原在破岩中。", "千磨万击还坚劲，任尔东西南北风。"] },
    { title: "石灰吟", author: "于谦", type: "励志", diff: 2, lines: ["千锤万凿出深山，烈火焚烧若等闲。", "粉骨碎身浑不怕，要留清白在人间。"] },
    { title: "己亥杂诗", author: "龚自珍", type: "抒情", diff: 3, lines: ["浩荡离愁白日斜，吟鞭东指即天涯。", "落红不是无情物，化作春泥更护花。"] },
    { title: "论诗", author: "赵翼", type: "感慨", diff: 3, lines: ["李杜诗篇万口传，至今已觉不新鲜。", "江山代有才人出，各领风骚数百年。"] },
    { title: "早春呈水部张十八员外", author: "韩愈", type: "春天", diff: 2, lines: ["天街小雨润如酥，草色遥看近却无。", "最是一年春好处，绝胜烟柳满皇都。"] },
    { title: "马诗", author: "李贺", type: "边塞", diff: 2, lines: ["大漠沙如雪，燕山月似钩。", "何当金络脑，快走踏清秋。"] },
    { title: "小儿垂钓", author: "胡令能", type: "儿童", diff: 2, lines: ["蓬头稚子学垂纶，侧坐莓苔草映身。", "路人借问遥招手，怕得鱼惊不应人。"] },
    { title: "寒食", author: "韩翃", type: "节日", diff: 3, lines: ["春城无处不飞花，寒食东风御柳斜。", "日暮汉宫传蜡烛，轻烟散入五侯家。"] }
  ];
  // 去重：若基础库已存在完全相同的「标题+作者」，则不再重复追加
  var existing = {};
  (window.POEMS || []).forEach(function (p) { existing[p.title + "|" + p.author] = true; });
  var unique = EXTRA.filter(function (p) { return !existing[p.title + "|" + p.author]; });
  window.POEMS = (window.POEMS || []).concat(unique);
})();

</script>
<script>
// 诗词释义数据（名篇详细解读 + 回退导读）
window.POEM_NOTES = {"静夜思|李白": "《静夜思》是李白大约二十六岁时在远方写下的。一个安静的夜晚，月光照在床前，白白的，像地上结了一层霜。李白抬起头望着明月，低下头就想起了自己的家乡和亲人。那时候他离开家在外地，心里有点孤单。这首诗用最简单的二十个字，写出了每个小朋友想家时的心情。我们读着读着，也会想起最爱我们的爸爸妈妈。", "咏鹅|骆宾王": "《咏鹅》是骆宾王七岁时写的，是不是很厉害！他看到池塘里的大白鹅，弯着脖子朝天上唱歌：“鹅，鹅，鹅！”白白的羽毛浮在绿绿的水面上，红红的脚掌轻轻拨动着清清的水波。这首诗像一幅画，颜色特别好看：白、绿、红，亮亮堂堂。小朋友读这首诗，可以一边念一边学鹅的样子，感受小诗人小时候仔细观察、喜欢动物的可爱心思。", "春晓|孟浩然": "《春晓》写的是春天早晨醒来时的感觉。孟浩然睡得香香的，不知不觉天就亮了，到处都能听到小鸟叽叽喳喳的叫声。他想起昨天夜里刮风下雨的声音，不知道院子里的花儿被吹落了多少。诗人那时候住在乡下，喜欢安静的自然生活。这首诗轻轻巧巧，让我们知道春天来了，小鸟唱歌，花儿开放，但风雨也会让花瓣飘落，要珍惜美好的每一天。", "悯农（其一）|李绅": "《悯农》是李绅写来心疼农民伯伯的。中午太阳火辣辣地照着，农民在地里锄草，汗水一滴滴掉进泥土里。可是谁能想到，我们碗里的每一粒米饭，都包含着农民辛苦的汗水呢！这首诗告诉小朋友：吃饭的时候不要浪费，因为每一口饭都来得不容易。要爱惜粮食，感谢种田的人，做个懂事的好孩子。", "悯农（其二）|李绅": "这一首《悯农》也讲农民很辛苦。春天播下一粒种子，秋天就能收获许许多多的粮食。天下没有一块闲着的田地，可还是有的农民会饿死。诗人看到不公平的事，心里很难过。它让我们明白：粮食是农民用劳动换来的，我们要珍惜，不能随便剩下饭菜，也要关心那些辛苦工作的人。", "登鹳雀楼|王之涣": "王之涣登上鹳雀楼，看到太阳靠着大山慢慢落下，黄河水哗啦啦地流向大海，景色特别壮阔。他忽然明白一个道理：想要看到更远更美的风景，就要再爬上一层楼。这首诗告诉小朋友：只要肯努力、多学一点，就能看到更大更精彩的世界。每天进步一点点，你也会站得更高、看得更远！", "相思|王维": "《相思》是王维写给远方的朋友的。南方有一种红豆，春天到了会发出新枝。诗人希望朋友多多采摘红豆，因为红豆代表着思念。那时候王维和朋友分开很久，特别想念对方。小朋友也可以把这首诗送给好久不见的小伙伴，告诉他“我想你啦”。它教我们珍惜友谊，把想念的人放在心里。", "鹿柴|王维": "《鹿柴》写一座安静的山林。空空的树林里看不见人，却隐隐约约能听到有人说话的声音。夕阳的余光射进深深的树林，又照在青青的苔藓上。王维那时候喜欢一个人安静地待在山里。这首诗安安静静的，像在教我们慢慢呼吸、静静观察周围的小美好，听一听风声，看一看光影。", "江雪|柳宗元": "《江雪》画了一个大雪纷飞的冬天：千座山里鸟儿都飞光了，路上一个人也没有。只有一位披着蓑衣、戴着斗笠的老爷爷，坐在小船上，一个人在寒冷江面上钓鱼。柳宗元写这首诗时心里有些孤单，但他很坚强。小朋友读着，可以想象白茫茫的雪世界，也学会在安静和困难里不害怕、不放弃。", "寻隐者不遇|贾岛": "贾岛去山里找一位隐居的朋友，遇到一个小童子。童子说：我师父采药去了，就在这座大山里，可是云太深了，不知道他到底在哪儿。这首诗很有意思，我们没看到要找的人，却好像看到了云雾缭绕的山林。它告诉我们，有些美好要自己慢慢去寻找，也教我们说话要有礼貌、耐心听别人讲。", "鸟鸣涧|王维": "《鸟鸣涧》写春天安静的山谷。人悠闲的时候，连桂花悄悄飘落都看得见；夜晚静悄悄的，春天的山像空了一样。月亮升起来，惊动了山里的小鸟，它们偶尔在涧边清清地叫几声。王维把安静写得很美。小朋友可以学着他，安静下来听听周围的声音，发现平时没注意的小惊喜。", "竹里馆|王维": "王维一个人坐在长满竹子的林子里，弹弹琴，又仰头吹吹口哨。深深的树林没人知道他，只有明亮的月亮来陪着他。诗人很喜欢这样的安静时光。这首诗教我们：一个人也可以很快乐，看看月亮、听听风声都很好。小朋友也可以有自己的小角落，安静地做喜欢的事。", "独坐敬亭山|李白": "李白一个人坐在敬亭山上，鸟儿都飞远了，孤零零的云也慢慢飘走。他看着山，山也看着他，俩人怎么看都不厌烦，好像成了好朋友。李白那时候有些孤单，但他把山当成了伙伴。这首诗很温柔，告诉小朋友：大自然也是我们的朋友，不开心的时候，去看看山、看看云，心情会变好。", "夜宿山寺|李白": "李白晚上住在一座很高的寺庙里。楼高得好像有一百尺，伸出手就能摘到星星。他不敢大声说话，怕惊动了天上的神仙。这首诗想象力超级棒！小朋友读的时候可以抬头看看夜空，想象自己站在高高的楼上，和星星月亮做邻居。它教我们用大胆的想象，去发现世界的奇妙。", "八阵图|杜甫": "《八阵图》讲的是三国时代的诸葛亮。他功劳盖过了三分天下，又用石头摆出神奇的八阵图出名。江水冲刷，石头却一动不动，留下遗憾是没能吞并东吴。杜甫很佩服诸葛亮。小朋友读这首诗，可以知道历史上有很聪明的人，也明白做事要努力，有时候遗憾也难免，但要为自己骄傲过。", "问刘十九|白居易": "在一个快要下雪的傍晚，白居易写了一首诗请朋友刘十九来喝酒。他说：我这里有绿绿的新酒，红泥小炉子烧得暖暖的，天晚了好像要下雪了，你能来喝一杯吗？这首诗特别温暖，像在说“快来我家玩吧”。它教我们：好朋友就是要互相邀请、一起分享温暖的小时光。", "秋浦歌|李白": "李白写自己愁得头发都白了，而且白得像三千丈那么长！为什么会这么愁呢？照照镜子才知道，原来是愁绪像秋霜一样落在了头上。诗人那时离家很久，心里闷闷的。小朋友虽然还小，但也会有害怕、难过的时候。这首诗告诉我们，把心情说出来、写下来，也是一种好办法。", "渡汉江|宋之问": "宋之问在离家很远的地方住了很久，和家里断了音信。经过了冬天又到了春天，好不容易快到家了，反而更害怕：走近家乡心里发怯，不敢问路上遇到的人“我家还好吗”。这种又想家又害怕知道坏消息的心情，很多小朋友分开很久再见爸爸妈妈时也会有一点。它写尽了想家的温柔。", "终南望余雪|祖咏": "祖咏写终南山北面很秀丽，山顶的积雪像浮在云边。树林边上闪着雪后晴天的光，城里的傍晚更添了几分寒意。这首诗短短短短却很有画面：白白的雪、亮亮的光、微微的冷。小朋友可以想象雪后初晴的山，也学着用眼睛仔细看周围的颜色和光线，做个会观察的小小诗人。", "宿建德江|孟浩然": "孟浩然把船停在雾气蒙蒙的小洲边，天晚了，旅人的愁绪更浓了。原野空旷，天显得比树还低；江水清清，月亮好像离人很近。诗人一个人在外，有点想家。这首诗安静又带着一点点孤单。小朋友读着，可以想想夜晚的江边是什么样子，也学会体会诗里温柔的情绪。", "逢雪宿芙蓉山主人|刘长卿": "天快黑了，远处的青山显得更远，天气寒冷，小小的茅屋显得更穷。柴门外传来狗叫声，风雪夜里有人回来了。刘长卿在赶路时借宿在人家，写下这温暖的画面。小朋友读着，可以想象雪夜里那盏灯、那声狗叫，知道外面再冷，也有人家里亮着灯等着你，心里就暖了。", "绝句|杜甫": "杜甫写春天的太阳暖暖的，江山好漂亮，春风里花草香味扑鼻。泥土松软，燕子飞来飞去衔泥做窝；沙滩暖和，鸳鸯舒舒服服地睡着。这首诗像一张春天的照片，动物们都很开心。小朋友读着，可以想象燕子飞来、鸳鸯睡觉的样子，也感受春天里万物生长、让人高兴的力量。", "绝句（江碧）|杜甫": "江水碧绿，水鸟显得更白；山上花开得艳，红得像要烧起来。今年春天眼看又要过去，可是哪一天才是我回家的日子呢？杜甫写这首诗时在外地，很想家。它用明亮的颜色开头，却结尾轻轻叹气。小朋友可以学到：美丽的风景里，也可以藏着想念爸爸妈妈的小小心事。", "池上|白居易": "一个小娃娃撑着小船，偷偷去采白莲花，然后回来。他还不懂怎么藏好自己的踪迹，小船划过，浮萍被分开，留下一道清清楚楚的水路。白居易把小朋友调皮可爱的样子写活了！读这首诗，我们可以笑一笑，也想起自己偷偷做过的淘气小事，特别真实又好玩。", "咏柳|贺知章": "贺知章把高高的柳树比作打扮漂亮的少女，千万条柳枝像绿色的丝带垂下来。他还好奇：这细细的柳叶是谁剪出来的呀？原来是二月的春风，像一把灵巧的剪刀！这首诗把春天写得好神奇。小朋友春天看到柳树，就可以想起这首诗，知道是温柔的春风，剪出了满树嫩绿的新芽。", "回乡偶书|贺知章": "贺知章很小离开家，很老才回来，口音没变，可头发都白了。村里的孩子们看见他，不认识，笑嘻嘻地问：“老爷爷，您从哪儿来呀？”诗人又亲切又好笑。这首诗讲时光流转、家乡不变。小朋友读着，可以想想爷爷奶奶小时候的故事，也更懂得珍惜和家人在一起的时光。", "凉州词|王之涣": "黄河远远地一直流到白云之间，一座孤零零的城靠着万仞高山。羌笛何必埋怨那杨柳枝呢，因为春风根本吹不到玉门关外。这首诗写边塞又荒凉又雄伟。小朋友可以想象西北的大山大河，也知道古时候守边的叔叔很辛苦，要谢谢保护我们的人，学会坚强和感恩。", "清明|杜牧": "清明时节下着纷纷细雨，路上赶路的人心里难过，像丢了魂一样。他问哪里有酒家可以歇歇，放牛的小孩远远一指：杏花村就有。杜牧把春雨、小路、小孩的指点写成一幅画。小朋友读着，可以想象雨中那个人和指路的孩子，也感受清明时节怀念亲人的温柔心情。", "山行|杜牧": "杜牧沿着弯弯的石头小路走上寒凉的山，白云升起的地方还住着人家。他停下车，只因为太爱傍晚的枫林：经霜的叶子比二月的花还要红。这首诗颜色特别美，红叶配白云。小朋友秋天去爬山，看到红红的枫叶，就可以背这句“霜叶红于二月花”，把美景记在心里。", "江南春|杜牧": "千里江南，黄莺啼叫，绿柳红花的颜色互相映衬；水边村庄、山边城郭，酒旗在风里飘。南朝时候建了许许多多寺庙，如今都藏在烟雨之中。杜牧写尽了江南春天的热闹和朦胧。小朋友可以想象烟雨里模模糊糊的楼台，也学会用好多颜色去描写美丽的春天。", "赠汪伦|李白": "李白坐船正要走，忽然听到岸上有人踩着拍子唱歌来送他——那是汪伦。哪怕桃花潭的水有千尺深，也比不上汪伦送我的情意深。这首诗写朋友之间的不舍和温暖。小朋友和朋友分开时，也可以学李白，把心里的感谢和喜欢大声说出来，珍惜每一份友谊。", "早发白帝城|李白": "早晨李白告别彩云间的白帝城，坐船去千里外的江陵，听说一天就能到。两岸猿猴的叫声还没停，轻快的小船已经穿过了重重山峦。这首诗又快又开心，像坐过山车！小朋友读着能感受到李白 frees 的自由和高兴，也想象长江水流得飞快、两岸山一座接一座。", "望庐山瀑布|李白": "太阳照在香炉峰上，升起紫色的烟；远远看去，瀑布像一条大河挂在山前。水流飞快地直冲下来三千尺，让人怀疑是银河从九天落到了人间。李白的想象太厉害了！小朋友看到壮观的景色，也可以学他用大胆的比喻，把看到的东西说得又美又神奇。", "黄鹤楼送孟浩然之广陵|李白": "老朋友在黄鹤楼向我告别，在烟花三月里顺流去扬州。孤帆的影子渐渐远去，最后消失在碧蓝的天边，只看见长江水向天边流去。李白站在岸边看了很久，舍不得朋友走。这首诗写尽了送别时的目送和想念。小朋友送好朋友时，也可以静静多看他一会儿。", "望天门山|李白": "长江把天门山从中间冲开，碧绿的水流到这里转个弯。两岸的青山一座接一座地出现，一只小船从太阳那边驶来。这首诗又有力又明亮。小朋友读着，可以想象大江大山的气势，也感受小船从远远的日边漂来的画面，学会用开阔的眼光看世界。", "出塞|王昌龄": "还是秦朝的明月、汉代的关口，千百年来多少战士出征没能回家。要是龙城的飞将军李广还在，绝不会让敌人的马越过阴山。这首诗写守边战士的辛苦和人们的愿望：盼望平安。小朋友可以知道，今天的平安，是因为有人默默守护，要心怀感谢。", "芙蓉楼送辛渐|王昌龄": "寒雨连着江面，夜晚送朋友吴地离去，天亮时只留下楚山孤零零。洛阳的亲戚朋友如果问起我，就说我心里像玉壶里的冰一样清清白白。诗人用冰心玉壶说自己品格干净。小朋友可以学到：做人要诚实、清白，把最真的好心留给身边的人。", "九月九日忆山东兄弟|王维": "王维独自在外地，每到过节就加倍想念亲人。他想到兄弟们登高插茱萸时，偏偏少了他一个人。这首诗写尽了想家想兄弟的心情。小朋友在过节不能和家人在一起时，也会有一点这样的感觉。它教我们：把想念说出来，亲情就一直在心里陪着你。", "枫桥夜泊|张继": "月亮落下，乌鸦啼叫，满天空都是寒霜；江边的枫树和渔火陪着愁绪难眠的人。苏州城外寒山寺的钟声，半夜里飘到客船上来。张继在外地睡不着，心里有些孤单。小朋友读着，可以想象安静的秋夜、远远的钟声，也体会一个人想家时，连钟声都格外清楚。", "春夜喜雨|杜甫": "好雨知道时节，春天一到就悄悄落下。它随着风在夜里轻轻来，无声地滋润万物。小路和云都黑黑的，只有江船上的灯火亮着。清晨看那红红湿湿的地方，花儿沉甸甸地开满锦官城。杜甫喜欢这场温柔的雨。小朋友可以想象夜晚静静下雨、早上花更艳的画面。", "绝句（两个黄鹂）|杜甫": "两个黄鹂在翠绿的柳枝上鸣叫，一行白鹭飞上蓝蓝的天空。从窗里望去，西岭千年不化的雪白白的；门外停着要去东吴的船。杜甫把四种颜色——黄、翠、白、蓝——排在一起，像一幅明亮的画。小朋友读着，可以学他用颜色画画，把看到的春天写下来。", "小儿垂钓|胡令能": "一个头发乱乱的小孩学着钓鱼，侧身坐在草丛里，身影被草遮住。路人有事远远向他招手，他不敢出声回答，怕把鱼吓跑。这首诗把认真钓鱼的小孩写得好可爱！小朋友做事情专心的时候，也会像他一样，谁都别打扰我。它教我们：专心才能做好一件事。", "古朗月行（节选）|李白": "李白小时候不认识月亮，把它叫作白玉做的大盘子；又怀疑是瑶台仙镜，飞在云朵边上。诗人用孩子天真的眼睛看月亮，又神奇又可爱。小朋友抬头看月亮时，也可以展开想象：它是盘子？是镜子？还是小船？保持这颗好奇的心，世界就充满惊喜。", "忆江南|白居易": "白居易说江南真好，那里的风景他从前多熟悉。太阳出来，江边的花红得胜过火；春天来了，江水绿得胜过蓝草。这样的江南，怎叫人不思念！诗人离开江南后一直想念。小朋友去过好玩的地方，回家后也会想念吧？这首诗教我们留住美好的记忆。", "赋得古原草送别|白居易": "原野上的草长得很茂盛，一年枯萎一次又茂盛一次。野火怎么也烧不完它，春风一吹又长出来。远处的草香漫上古道，晴天里连荒城都变绿了。又要送朋友远去，草儿也满是离别的情意。小朋友可以学到：小草很顽强，友情也很坚强，春天总会再来。", "风|李峤": "风真能干：它能吹落秋天的树叶，也能吹开二月的鲜花；吹过江面掀起千尺浪，钻进竹林让万根竹子歪斜。全诗没写“风”字，却处处是风。小朋友可以想想：树叶飘、花开放、波浪翻、竹子摇，都是风在帮忙。它教我们用眼睛发现看不见的东西。", "乐游原|李商隐": "傍晚时分李商隐心里不太舒服，就坐车登上古原散心。他看到夕阳无限美好，只可惜已经接近黄昏了。诗人有点感慨时光匆匆。小朋友傍晚看夕阳，也可以想起这句诗：美好的东西要珍惜，因为时间会走，但记住它的美，它就一直在心里。", "夜雨寄北|李商隐": "你问我哪天回家，我也不知道。巴山下着夜雨，秋池的水都涨满了。什么时候我们才能一起剪着西窗的烛光，再讲讲今晚巴山夜雨的事呢？这首诗写给远方的亲人，满满都是想念。小朋友和爸爸妈妈分开时，也可以想象重逢那天，把想说的话都讲出来。", "嫦娥|李商隐": "云母屏风上映着烛影，夜深了星星也快落下。嫦娥应该后悔偷吃了灵药，如今只能对着碧海青天，一夜又一夜地孤单。诗人借嫦娥写寂寞。小朋友读着，可以想象月亮上冷冷清清的嫦娥，也明白：有时候自由背后，也会有孤单，要珍惜身边的温暖。", "望洞庭|刘禹锡": "秋夜的湖水和月光互相交融，湖面没风像没磨过的镜子。远远看洞庭的山水一片翠绿，就像白银盘里托着一只小小的青螺。刘禹锡把洞庭湖写成一件艺术品！小朋友可以想象月亮照在平静湖面上的样子，也学着用漂亮的比喻描写看到的风景。", "滁州西涧|韦应物": "韦应物独爱涧边生长的幽幽小草，上面还有黄鹂在密林深处啼叫。春天的潮水带着雨傍晚来得急，野外的渡口没人，小船横在水边。这首诗安静又有点野趣。小朋友去小河边玩，也可以看看小草、听听鸟叫，发现不被人注意的小小美景。", "别董大|高适": "千里黄云把白日染暗，北风吹着雁群、大雪纷纷落下。可是别担心前面没有知己，天下谁不认识你董大呢！高适送朋友时说得又豪爽又温暖。小朋友送好朋友远行，也可以学他：不说舍不得，而是说“你很棒，大家都会喜欢你”，给人信心。", "黄鹤楼|崔颢": "从前有人乘黄鹤而去，这里只留下空空的黄鹤楼。黄鹤一去再不回来，只有白云千百年飘着。晴天里汉阳的树清清楚楚，鹦鹉洲上草长得很茂盛。天晚了，家乡在哪儿呢？江上的烟波让人犯愁。这首诗又壮观又思乡，小朋友可以想象登高望远、想念家乡的心情。", "从军行|王昌龄": "青海湖上长长的云遮暗了雪山，孤城远远望着玉门关。在黄沙里打了许多仗，铁甲都磨破了，不打败敌人绝不回家！这首诗写守边战士的勇敢和决心。小朋友可以学到：为了重要的事，要像他们一样坚持到底，不轻言放弃，做勇敢的人。", "采莲曲|王昌龄": "采莲姑娘的罗裙和荷叶一个颜色，脸庞藏在荷花里，两边分开。她们混进荷塘就看不见了，听到歌声才知道有人来。这首诗把采莲女孩和荷花写得分不清谁是谁，特别美。小朋友可以想象夏天荷塘里，女孩们一边唱歌一边采莲的热闹快乐。", "塞下曲（其二）|卢纶": "林子暗暗草里好像有风惊动，将军夜里拉开弓。天亮去寻找那支白羽箭，发现它居然射进石头棱里。这首诗写将军力气大、箭法准，像故事一样精彩。小朋友读着可以想象将军英勇的样子，也知道古代守边的叔叔们多么了不起。", "塞下曲（其三）|卢纶": "没有月亮的夜里大雁飞得很高，单于趁黑偷偷逃跑了。将军想带轻骑兵去追，刹那间大雪落满了弓和刀。这首诗紧张又寒冷，像电影画面。小朋友可以想象雪夜追敌的场景，也感受守边战士不怕苦、保护大家平安的勇敢精神。", "秋夕|杜牧": "秋夜银白的烛光映着冷冷的画屏，宫女拿着小扇扑打着飞来的萤火虫。宫殿台阶上夜色凉得像水，她躺着看牵牛星和织女星。这首诗写孤单的秋夜。小朋友夏天看到萤火虫会很开心，也可以想想安静的夜晚，星星和虫子都在陪着我们。", "暮江吟|白居易": "一道夕阳铺在江水里，半江碧绿半江红。可爱的是九月初三的夜晚，露水像珍珠，月亮像弯弓。白居易把傍晚到夜晚的江景写得又柔又美。小朋友傍晚看江或看天，也可以发现：同样的地方，不同时间有不同颜色，世界真奇妙。", "大林寺桃花|白居易": "人间四月花儿都谢了，可山里寺庙的桃花才刚刚盛开。他总埋怨春天走了找不到，没想到它悄悄转到这里来了。这首诗像捉迷藏，把春天写活了。小朋友也可以发现：山下花开完，山上可能还开着，换个地方，就能再遇见美好。", "浪淘沙|刘禹锡": "九曲黄河带着万里黄沙，浪淘风簸一直去到天边。如今真想直上银河，和牛郎织女一家相会。这首诗把黄河写得气势磅礴，又带点神话的浪漫。小朋友可以想象黄河滚滚、浪花翻滚，也敢用自己的想象，飞到星星那里去做客。", "乌衣巷|刘禹锡": "朱雀桥边长满野草闲花，乌衣巷口夕阳斜斜地照着。从前王导、谢安那样的大族堂前燕子，如今飞进了普通百姓家里。诗人感叹时光改变一切。小朋友可以学到：世界一直在变，要珍惜现在，也用温柔的眼光看身边的老地方、老故事。", "竹枝词|刘禹锡": "江边杨柳青青、江水平静，听到情郎在江上踏歌。东边出着太阳，西边却下着雨，说是没晴（情）吧，却又像有晴（情）。这首诗用谐音写得俏皮又可爱。小朋友可以学到：汉字真有趣，同一个音能表达不同的意思，语言里藏着小聪明。", "寒食|韩翃": "春天的城里到处飘着柳絮落花，寒食节东风吹斜了御柳。傍晚皇宫里传赐蜡烛，轻烟飘进了王侯家里。这首诗写节日景象。小朋友过传统节日时，也可以观察身边的风俗：柳枝、禁烟、踏青，感受古老又温暖的中国节日文化。", "春怨|金昌绪": "把那黄莺儿赶走，别让它在枝上啼叫。它一叫就惊扰了我的梦，让我到不了辽西见远征的丈夫。这首诗从一个女子的口吻，写对远方人的想念。小朋友读着可以想象：想见的人见不到，连鸟叫都嫌吵。它让我们懂得思念别人的温柔心情。", "玉阶怨|李白": "玉石台阶上生起白露，夜深了露水浸湿了罗袜。她放下水晶帘子，透过玲珑的帘子望着秋天的月亮。这首诗写一个女子静静等待的孤单。小朋友可以想象安静的夜晚、凉凉的露水、明亮的月亮，也体会等待时那种轻轻的、温柔的想念。", "秋夜寄邱员外|韦应物": "想念你在秋天的夜里，我散步吟着微凉的天。空山里松子悄悄掉落，那位幽静的朋友应该还没睡吧。韦应物把对朋友的牵挂写得很淡很美。小朋友也可以想想：远方的好朋友现在在做什么呢？把祝福放在心里，友情就不会远。", "江南逢李龟年|杜甫": "当年在岐王宅里、崔九堂前经常见到你，听你唱歌。如今正是江南好风景的时候，落花的季节又遇见了你。杜甫写久别重逢，又欢喜又感慨。小朋友和很久不见的朋友再见，也会又惊又喜。它教我们珍惜每一次相遇，因为重逢很珍贵。", "赠花卿|杜甫": "锦官城里的音乐天天纷纷扬扬，一半随风飘进江里，一半飘上云霄。这样好听的曲子只该天上才有，人间能听到几回呢？杜甫用夸奖写音乐的美好。小朋友听到好听的歌，也可以学杜甫，把心里的喜欢大大方方地夸出来。", "遗爱寺|白居易": "白居易在溪边弄着石头坐下，绕着寺庙寻找花儿走。时时刻刻听到鸟叫，处处都是泉水的声音。这首诗写他在山寺边悠闲自在。小朋友去公园或山里，也可以学他：不赶路，慢慢看石头、找小花、听鸟和泉，发现安静里的快乐。", "题都城南庄|崔护": "去年今天在这门里，姑娘的脸和桃花互相映红。如今姑娘不知去了哪里，只有桃花依旧在春风里笑。崔护写物是人非的淡淡惆怅。小朋友可以想象那棵桃树和笑脸，也明白：有些美好只出现一次，记住它就够了，心里会暖暖的。", "春词|刘禹锡": "新娘妆扮好看走下红楼，却把满院春光锁在愁里。她走到院子中间数花朵，一只蜻蜓飞上了玉簪。这首诗写等待中的孤单小女儿态，又巧又俏。小朋友可以想象春天院子里，一个人数花、蜻蜓停发的安静画面，也感受细腻的小情绪。", "泊秦淮|杜牧": "烟霭笼着寒水、月色笼着沙，夜晚把船停在秦淮河边靠近酒家。卖唱的歌女不懂亡国的恨，隔着江还在唱《后庭花》。杜牧借古叹今，心里忧虑。小朋友读着可以想象朦胧的江夜，也慢慢懂得：记住历史，才能更珍惜现在的平安生活。", "送灵澈上人|刘长卿": "苍苍的竹林寺里，远远传来晚钟声。灵澈上人戴着斗笠披着夕阳，独自走向远处的青山。刘长卿目送朋友离去，写得安静又悠远。小朋友送别时，也可以像诗人一样，静静看着朋友走远，把祝福放在心里，学会温柔地告别。", "听弹琴|刘长卿": "七根琴弦上流出清泠泠的声音，静静听是松林里的风。古老的曲调虽然我自己喜欢，现在的人却大多不爱弹了。诗人借琴写知音难觅。小朋友学本领时，哪怕别人不理解，只要自己真心喜欢，就值得坚持，总有一天会遇到懂你的人。"};
window.makePoemFallback = function(poem){

<script>
/* =========================================================
   艾米的学习乐园 — 状态与持久化 (Store)
   职责：
     - 定义清晰的状态结构（schema）
     - localStorage 持久化，带版本迁移与异常保护
     - 安全：提供 esc() 转义助手，杜绝 XSS；所有用户输入先校验
     - 积分/打卡/词库/诗词/奖励/AI 配置的增改 API
     - 轻量发布订阅，供 UI 刷新
   ========================================================= */
window.Store = (function () {
  "use strict";
  const KEY = "amy_learning_v2";
  const VERSION = 2;

  /* ---------- 安全：HTML 转义（防 XSS） ---------- */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* ---------- 默认状态 ---------- */
  function defaults() {
    return {
      version: VERSION,
      user: { name: (window.Data && Data.DEFAULT_NAME) || "艾米", avatar: "🐰" },
      totalFlowers: 0,
      todayFlowers: 0,
      lastFlowerDay: "",          // 用于每日积分清零
      dailyLog: {},               // { "2026-08-04": 当日获得积分 }
      checkins: [],               // ["2026-08-04", ...]
      lastRewardStreak: 0,
      learnedCN: [],              // [{char,py,mean}]
      learnedEN: [],              // [{en,cn,emoji}]
      poemLearned: [],            // [{title,author}]
      poemRecited: [],            // [{title,author}]
      rewards: { candy: 0, sapling: 0, pearl: 0, kitten: 0 },
      ai: { base: "", key: "", model: "" },
      tts: { url: "" },                 // 豆包TTS后端地址（如 http://localhost:3001/tts）
      lastVisit: todayStr(),
      perfByDate: {},             // { "2026-08-06": { behaviorId: "good"|"bad" } }
      enCursor: 0,                // 每日英语轮换指针
      dailyEN: {},                // { "2026-08-06": { newKeys:[], reviewKeys:[] } }
      dailySel: {},               // { logic:{date:[idx...]}, book:{date:[idx]} } 每日不重复选题缓存
      drawings: [],              // 绘画作品 [{id,date,prompt,img,comment,suggestion}]
      readBooks: []               // 已读绘本标题列表（右上角标记绿勾，可重复阅读）
    };
  }

  /* ---------- 持久化 ---------- */
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return defaults();
      const o = JSON.parse(raw);
      return migrate(o);
    } catch (e) {
      console.warn("读取存档失败，使用默认状态", e);
      return defaults();
    }
  }
  function migrate(o) {
    const d = defaults();
    if (!o || typeof o !== "object") return d;
    // 合并，保证字段完整
    const s = Object.assign(d, o);
    s.user = Object.assign(d.user, o.user || {});
    s.rewards = Object.assign(d.rewards, o.rewards || {});
    s.ai = Object.assign(d.ai, o.ai || {});
    s.tts = Object.assign(d.tts, o.tts || {});
    if (!Array.isArray(s.checkins)) s.checkins = [];
    if (!Array.isArray(s.learnedCN)) s.learnedCN = [];
    if (!Array.isArray(s.learnedEN)) s.learnedEN = [];
    if (!Array.isArray(s.poemLearned)) s.poemLearned = [];
    if (!Array.isArray(s.poemRecited)) s.poemRecited = [];
    if (!Array.isArray(s.readBooks)) s.readBooks = [];
    return s;
  }
  // 初始化状态
  let state = load();
  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      console.warn("保存失败", e);
    }
  }

  /* ---------- 工具 ---------- */
  function todayStr(d) {
    d = d || new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, "0");
    const day = String(d.getDate()).padStart(2, "0");
    return `${y}-${m}-${day}`;
  }
  function dayNumber(d) {
    // 以 2026-01-01 为基准的天数，用于每日内容轮换
    const base = Date.UTC(2026, 0, 1);
    return Math.floor((d.getTime() - base) / 86400000);
  }
  function isToday(str) { return str === todayStr(); }

  /* ---------- 每日轮换工具 ---------- */
  // 当天整数种子（同一天稳定，跨天变化）
  function todaySeed() {
    let n = dayNumber(new Date());
    // 扩散到 32 位无符号，避免集中在小范围
    return (Math.imul(n + 1, 2654435761) >>> 0);
  }
  // 确定性取数组中的第 k 个（按天轮换）
  function dailyPick(arr, offset) {
    const n = dayNumber(new Date()) + (offset || 0);
    const len = arr.length || 1;
    return arr[((n % len) + len) % len];
  }
  // 连续取 n 个（按天轮换起点）
  function dailyPickN(arr, n, offset) {
    const start = dayNumber(new Date()) + (offset || 0);
    const len = arr.length || 1;
    const out = [];
    for (let i = 0; i < n; i++) out.push(arr[((start + i) % len + len) % len]);
    return out;
  }
  // 可复现伪随机（mulberry32），用种子生成稳定序列
  function seededRand(seed) {
    let t = (seed >>> 0) || 1;
    return function () {
      t += 0x6D2B79F5;
      let r = Math.imul(t ^ (t >>> 15), 1 | t);
      r ^= r + Math.imul(r ^ (r >>> 7), 61 | r);
      return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------- 每日内容「不重复」选取 ---------- */
  // 取某天相对 today 偏移 n 天的日期对象
  function addDays(date, n) { const d = new Date(date.getTime()); d.setDate(d.getDate() + n); return d; }
  // 字符串哈希（FNV-1a），用于给不同内容池不同的随机种子
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  // 从 pool 中选 count 个，且与最近 historyDays 天已选的不重复（同天稳定、跨天变化）
  function dailyChoice(key, pool, count, historyDays) {
    const d = todayStr();
    if (!state.dailySel) state.dailySel = {};
    if (!state.dailySel[key]) state.dailySel[key] = {};
    if (state.dailySel[key][d]) {
      return state.dailySel[key][d].map((i) => pool[i]).filter(Boolean);
    }
    const len = pool.length;
    if (!len) return [];
    // 收集最近 historyDays 天已选下标，避免重复
    const recent = new Set();
    for (let i = 1; i <= historyDays; i++) {
      const ds = todayStr(addDays(new Date(), -i));
      const arr = state.dailySel[key][ds];
      if (arr) arr.forEach((x) => recent.add(x));
    }
    // 用当天种子 + 内容池名做洗牌，保证确定且跨天变化
    const rnd = seededRand((todaySeed() ^ hashStr(key)) >>> 0);
    const idxs = pool.map((_, i) => i);
    for (let i = idxs.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      const t = idxs[i]; idxs[i] = idxs[j]; idxs[j] = t;
    }
    const chosen = [];
    for (const ix of idxs) { if (chosen.length >= count) break; if (!recent.has(ix)) chosen.push(ix); }
    // 若池子太小不够避开近期，再补足（保证数量）
    let k = 0;
    while (chosen.length < count && k < idxs.length) { if (chosen.indexOf(idxs[k]) < 0) chosen.push(idxs[k]); k++; }
    state.dailySel[key][d] = chosen;
    save();
    return chosen.map((i) => pool[i]).filter(Boolean);
  }
  // 每日 5 道逻辑题（与最近 3 天不重复）
  function getDailyLogic() { return dailyChoice("logic", (window.Data && window.Data.LOGIC) || [], 5, 3); }
  // 每日推荐绘本（与最近 3 天不重复）
  function getDailyBook() { const a = dailyChoice("book", (window.Data && window.Data.BOOKS) || [], 1, 3); return a[0]; }
  // 每日 5 本新绘本（与最近 7 天不重复），排在前面
  function getDailyBooks() { return dailyChoice("book5", (window.Data && window.Data.BOOKS) || [], 5, 7); }

  /* ---------- 红花可调（允许扣减，下限 0） ---------- */
  function adjustFlowers(delta, reason) {
    if (!isToday(state.lastFlowerDay)) {
      state.todayFlowers = 0;
      state.lastFlowerDay = todayStr();
      state.dailyLog[todayStr()] = 0;
    }
    state.totalFlowers = Math.max(0, state.totalFlowers + delta);
    state.todayFlowers = Math.max(0, state.todayFlowers + delta);
    state.dailyLog[todayStr()] = state.todayFlowers;
    save(); emit();
  }

  /* ---------- 每日表现（8 项行为） ---------- */
  function optionDelta(b, key) {
    if (key === "good") return (b.good && b.good.delta) || 0;
    if (key === "bad") return (b.bad && b.bad.delta) || 0;
    return 0;
  }
  function getPerf(dateStr) {
    dateStr = dateStr || todayStr();
    return state.perfByDate[dateStr] || {};
  }
  function perfTotal(dateStr) {
    const sel = getPerf(dateStr);
    const bs = (window.Data && window.Data.BEHAVIORS) || [];
    let sum = 0;
    bs.forEach((b) => { if (sel[b.id]) sum += optionDelta(b, sel[b.id]); });
    return sum;
  }
  function setPerf(dateStr, id, optionKey) {
    dateStr = dateStr || todayStr();
    if (!state.perfByDate[dateStr]) state.perfByDate[dateStr] = {};
    const prev = state.perfByDate[dateStr][id];
    state.perfByDate[dateStr][id] = optionKey;
    const b = (window.Data && window.Data.BEHAVIORS && window.Data.BEHAVIORS.find((x) => x.id === id));
    if (!b) return;
    const delta = optionDelta(b, optionKey) - (prev ? optionDelta(b, prev) : 0);
    adjustFlowers(delta, "每日表现");
    save(); emit();
  }

  /* ---------- 每日英语（5 新 + 2 复习） ---------- */
  function getDailyEN() {
    const d = todayStr();
    if (state.dailyEN[d]) return state.dailyEN[d];
    const words = (window.Data && window.Data.EN_WORDS) || [];
    const len = words.length || 1;
    let cursor = state.enCursor || 0;
    const newKeys = [], revKeys = [];
    for (let i = 0; i < 5; i++) newKeys.push(words[(cursor + i) % len].en);
    for (let i = 0; i < 2; i++) revKeys.push(words[(((cursor - 5 + i) % len) + len) % len].en);
    state.enCursor = (cursor + 5) % len;
    const obj = { newKeys: newKeys, reviewKeys: revKeys };
    state.dailyEN[d] = obj;
    save();
    return obj;
  }

  /* ---------- 绘画作品 ---------- */
  function addDrawing(rec) {
    state.drawings.push(rec);
    if (state.drawings.length > 30) state.drawings = state.drawings.slice(-30);
    save(); emit();
  }
  function getDrawings() { return state.drawings.slice().reverse(); } // 最新在前
  function removeDrawing(id) {
    state.drawings = state.drawings.filter((d) => d.id !== id);
    save(); emit();
  }

  /* ---------- 发布订阅 ---------- */
  const listeners = [];
  function onChange(fn) { listeners.push(fn); }
  function emit() { listeners.forEach((f) => { try { f(state); } catch (e) {} }); }

  /* ---------- 用户信息 ---------- */
  function getUser() { return state.user; }
  function setUser(name, avatar) {
    state.user.name = validateName(name);
    state.user.avatar = avatar || "🐰";
    save(); emit();
  }
  function validateName(name) {
    // 仅允许中英文、数字、空格，长度 1-8，防注入
    let n = String(name || "").trim().slice(0, 8);
    n = n.replace(/[^\u4e00-\u9fa5A-Za-z0-9 ]/g, "");
    return n || "艾米";
  }

  /* ---------- 积分 ---------- */
  function addFlowers(n, reason) {
    n = Math.max(0, Math.floor(n || 0));
    if (n === 0) return;
    if (!isToday(state.lastFlowerDay)) {
      state.todayFlowers = 0;
      state.lastFlowerDay = todayStr();
      state.dailyLog[todayStr()] = 0;
    }
    state.totalFlowers += n;
    state.todayFlowers += n;
    state.dailyLog[todayStr()] = state.todayFlowers;
    save(); emit();
  }
  function getTotal() { return state.totalFlowers; }
  function getToday() { if (!isToday(state.lastFlowerDay)) { state.todayFlowers = 0; state.lastFlowerDay = todayStr(); save(); } return state.todayFlowers; }

  /* ---------- 打卡 ---------- */
  function checkIn(dateStr) {
    dateStr = dateStr || todayStr();
    if (state.checkins.indexOf(dateStr) >= 0) return { already: true, streak: getStreak() };
    state.checkins.push(dateStr);
    state.checkins.sort();
    const streak = getStreak();
    let reward = 0;
    const prevMult = Math.floor(state.lastRewardStreak / 7);
    const newMult = Math.floor(streak / 7);
    if (newMult > prevMult) {
      reward = 5 * (newMult - prevMult);   // 每连续 7 天奖 5 朵
      state.lastRewardStreak = streak;
      state.totalFlowers += reward;
      if (!isToday(state.lastFlowerDay)) { state.todayFlowers = 0; state.lastFlowerDay = todayStr(); state.dailyLog[todayStr()] = 0; }
      state.todayFlowers += reward;
      state.dailyLog[todayStr()] = state.todayFlowers;
    }
    save(); emit();
    return { already: false, streak: streak, reward: reward };
  }
  function getCheckins() { return state.checkins.slice(); }
  function getStreak() {
    if (!state.checkins.length) return 0;
    const set = new Set(state.checkins);
    const today = new Date();
    // 若今天没打卡，从昨天倒推；否则从今天倒推
    let cursor = new Date(today);
    if (!set.has(todayStr(cursor))) cursor.setDate(cursor.getDate() - 1);
    let n = 0;
    while (set.has(todayStr(cursor))) {
      n++;
      cursor.setDate(cursor.getDate() - 1);
    }
    return n;
  }
  function isChecked(dateStr) { return state.checkins.indexOf(dateStr) >= 0; }
  function getDailyLog() { return Object.assign({}, state.dailyLog); }

  /* ---------- 词库 ---------- */
  function addCN(char, py, mean) {
    if (!char) return false;
    if (state.learnedCN.some((x) => x.char === char)) return false;
    state.learnedCN.push({ char: char, py: py || "", mean: mean || "" });
    save(); emit(); return true;
  }
  function removeCN(char) {
    state.learnedCN = state.learnedCN.filter((x) => x.char !== char);
    save(); emit();
  }
  function addEN(en, cn, emoji) {
    if (!en) return false;
    if (state.learnedEN.some((x) => x.en === en)) return false;
    state.learnedEN.push({ en: en, cn: cn || "", emoji: emoji || "🔤" });
    save(); emit(); return true;
  }
  function removeEN(en) {
    state.learnedEN = state.learnedEN.filter((x) => x.en !== en);
    save(); emit();
  }
  function getCN() { return state.learnedCN.slice(); }
  function getEN() { return state.learnedEN.slice(); }

  /* ---------- 诗词状态 ---------- */
  function markLearned(title, author) {
    if (!state.poemLearned.some((p) => p.title === title && p.author === author))
      state.poemLearned.push({ title: title, author: author });
    save(); emit();
  }
  function isLearned(title, author) {
    return state.poemLearned.some((p) => p.title === title && p.author === author);
  }
  function recite(title, author) {
    const already = isRecited(title, author);
    if (!already) {
      state.poemRecited.push({ title: title, author: author });
      addFlowers(5, "背诵诗词");
    }
    markLearned(title, author);
    save(); emit();
    return !already;
  }
  function isRecited(title, author) {
    return state.poemRecited.some((p) => p.title === title && p.author === author);
  }
  function getLearnedPoems() { return state.poemLearned.slice(); }
  function getRecitedPoems() { return state.poemRecited.slice(); }

  /* ---------- 绘本已读状态 ---------- */
  // 每条记录存 {title, ts}，ts 用于按阅读时间倒序展示（兼容旧版纯字符串记录）
  function _bookTitle(x) { return (x && typeof x === "object") ? x.title : x; }
  function _bookTs(x) { return (x && typeof x === "object") ? (x.ts || 0) : 0; }
  function markBookRead(title) {
    if (!title) return;
    const exists = state.readBooks.some((x) => _bookTitle(x) === title);
    if (!exists) { state.readBooks.push({ title: title, ts: Date.now() }); save(); emit(); }
  }
  function isBookRead(title) { return state.readBooks.some((x) => _bookTitle(x) === title); }
  function getReadBooks() {
    // 按阅读时间倒序返回（最近读的排最前）
    return state.readBooks.slice().sort((a, b) => _bookTs(b) - _bookTs(a));
  }

  /* ---------- 奖励兑换 ---------- */
  function getRewards() { return Object.assign({}, state.rewards); }
  function getFlower() { return state.totalFlowers; }
  // 兑换：from 来源计数键，to 目标键（体验奖励用特殊键），cost 数量
  function exchange(from, to, cost) {
    if (from === "flower") {
      if (state.totalFlowers < cost) return { ok: false, msg: "小红花不够哦～" };
      state.totalFlowers -= cost;
    } else {
      if ((state.rewards[from] || 0) < cost) return { ok: false, msg: "数量不够，再努力攒一攒！" };
      state.rewards[from] -= cost;
    }
    if (to === "tv" || to === "money" || to === "park") {
      // 体验奖励仅记录弹窗提示，不计入常驻物品
    } else {
      state.rewards[to] = (state.rewards[to] || 0) + 1;
    }
    save(); emit();
    return { ok: true };
  }

  /* ---------- AI 设置 ---------- */
  function getAI() { return Object.assign({}, state.ai); }
  function setAI(obj) {
    state.ai = {
      base: String(obj.base || "").slice(0, 200),
      key: String(obj.key || "").slice(0, 200),
      model: String(obj.model || "").slice(0, 80)
    };
    save(); emit();
  }
  function clearAI() { state.ai = { base: "", key: "", model: "" }; save(); emit(); }

  /* ---------- 豆包TTS 后端地址 ---------- */
  function getTTS() { return Object.assign({}, state.tts); }
  function setTTS(url) { state.tts = { url: String(url || "").trim().slice(0, 300) }; save(); emit(); }

  /* ---------- 每日轮换索引 ---------- */
  function dailyIndex(len, offset) {
    const n = dayNumber(new Date()) + (offset || 0);
    return ((n % len) + len) % len;
  }

  return {
    esc: esc,
    onChange: onChange,
    getUser: getUser, setUser: setUser,
    addFlowers: addFlowers, getTotal: getTotal, getToday: getToday,
    checkIn: checkIn, getCheckins: getCheckins, getStreak: getStreak, isChecked: isChecked,
    getDailyLog: getDailyLog,
    addCN: addCN, removeCN: removeCN, addEN: addEN, removeEN: removeEN,
    getCN: getCN, getEN: getEN,
    markLearned: markLearned, isLearned: isLearned, recite: recite, isRecited: isRecited,
    getLearnedPoems: getLearnedPoems, getRecitedPoems: getRecitedPoems,
    markBookRead: markBookRead, isBookRead: isBookRead, getReadBooks: getReadBooks,
    getRewards: getRewards, getFlower: getFlower, exchange: exchange,
    getAI: getAI, setAI: setAI, clearAI: clearAI,
    getTTS: getTTS, setTTS: setTTS,
    dailyIndex: dailyIndex, todayStr: todayStr,
    todaySeed: todaySeed, dailyPick: dailyPick, dailyPickN: dailyPickN, seededRand: seededRand,
    getPerf: getPerf, setPerf: setPerf, perfTotal: perfTotal,
    getDailyEN: getDailyEN, addDrawing: addDrawing, getDrawings: getDrawings, removeDrawing: removeDrawing,
    getDailyLogic: getDailyLogic, getDailyBook: getDailyBook, getDailyBooks: getDailyBooks
  };
})();

<script>
/* =========================================================
   艾米的学习乐园 — 语音引擎 (Audio)
   能力：
     - speak(text, lang)        朗读（中/英）
     - recognitionSupported     浏览器是否支持语音识别
     - recognize(lang, ms, expected, threshold)

         recognize 返回 {unsupported:true}，由调用方降级为手动确认，
         保证功能始终可用。

window.Audio2 = (function () {
  "use strict";

  const synth = window.speechSynthesis || null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const recognitionSupported = !!SR;

  let zhVoice = null, enVoice = null;

  // 按「自然度 + 音色」给语音打分，选最适合孩子的声音
  function voiceScore(v, lang) {
    if (!v || !v.lang) return -1;
    const vl = v.lang.toLowerCase();
    if (lang === "zh-CN") { if (!/^zh/i.test(vl)) return -1; }
    else if (lang === "en-US") { if (!/^en/i.test(vl)) return -1; }
    else return -1;

    let score = 0;
    const name = String(v.name || "").toLowerCase();
    // 在线自然语音优先（杂音更少）
    if (!v.localService || /online|natural|neural|premium/i.test(name)) score += 30;

    if (lang === "zh-CN") {
      // 中文优先 Xiaoxiao/Yaoyao/Xiaoyi 等清甜女声
      if (/xiaoxiao/.test(name)) score += 120;
      else if (/yaoyao/.test(name)) score += 110;
      else if (/xiaoyi/.test(name)) score += 100;
      else if (/yunxi(?!-)/.test(name)) score += 90;   // 女声
      else if (/yunxia/.test(name)) score += 85;
      else if (/huihui/.test(name)) score += 70;
      else if (/tingting/.test(name)) score += 60;
      else if (/female|girl|女/.test(name)) score += 25;
    } else if (lang === "en-US") {
      // 英文优先小女孩 / 自然女声：Ana 是儿童音，Aria/Jenny/Sonia 是高品质自然音
      if (/\bana\b/.test(name)) score += 150;            // 小女孩
      else if (/aria/.test(name)) score += 120;
      else if (/jenny/.test(name)) score += 115;
      else if (/sonia/.test(name)) score += 110;
      else if (/samantha/.test(name)) score += 90;
      else if (/victoria/.test(name)) score += 85;
      else if (/zira/.test(name)) score += 60;
      else if (/google us english/.test(name)) score += 70;
      else if (/female|girl/.test(name)) score += 25;
    }
    return score;
  }

  function pickVoice(vs, lang) {
    let best = null, bestScore = -1;
    (vs || []).forEach((v) => {
      const s = voiceScore(v, lang);
      if (s > bestScore) { bestScore = s; best = v; }
    });
    return best;
  }

  function loadVoices() {
    if (!synth) return;
    const vs = synth.getVoices() || [];
    zhVoice = pickVoice(vs, "zh-CN");
    enVoice = pickVoice(vs, "en-US");

    loadVoices();

  }

  // ---- 朗读锁：杜绝多层混音 + 冷却点击 ----
  // 同一时刻只允许一个声音在播；新请求若在播放中到达，仅保留「最后一次」（覆盖式排队），
  // 当前播完后自动接力，避免叠加噪音。看门狗防止 onend 未触发导致永久卡死。

  //      失败或不可用自动回退到本机 Web Speech。后端仅持有密钥，前端只存地址，安全。 ----

  function ttsFallback(text, lang, opts) {

  function playTTS(text, lang, opts) {

      method: "POST",
      headers: { "Content-Type": "application/json" },

        _ttsSpeaking = true;

          _ttsBusy = false; _ttsSpeaking = false; _ttsAudio = null;

        audio.onerror = () => { _ttsSpeaking = false; _ttsAudio = null; console.warn("TTS 播放失败，回退本机朗读"); ttsFallback(text, lang, opts); };

        audio.play().catch((e) => { _ttsSpeaking = false; _ttsAudio = null; console.warn("TTS 播放被拒，回退本机朗读", e); ttsFallback(text, lang, opts); });

      .catch((e) => { console.warn("TTS 请求失败，回退本机朗读", e); ttsFallback(text, lang, opts); });

    if (_ttsBusy) { _ttsNext = { text: text, lang: lang, opts: opts || {} }; return; }

  function stop() {

    if (_watch) { clearTimeout(_watch); _watch = null; }

  function speakPinyin(text) {

    const map = { "ang":"āng","eng":"ēng","ing":"yīng","ong":"ōng","an":"ān","en":"ēn","in":"yīn","un":"ūn","ün":"ǖn","iang":"iāng","uang":"uāng","ueng":"uēng","iong":"iōng" };

  //  - 云端TTS(豆包)：读例字（如「昂/灯/鹰/钟」），音色自然、准确
  //  - 本机Web Speech：用带一声声调的干净韵母音「āng/ēng/yīng/ōng」，鼻音更到位

    if (ttsUrl) { speak(it.ex, "zh-CN", { rate: 0.9, pitch: 1.0 }); return; }
    const map = { "ang":"āng","eng":"ēng","ing":"yīng","ong":"ōng","an":"ān","en":"ēn","in":"yīn","un":"ūn","ün":"ǖn","iang":"iāng","uang":"uāng","ueng":"uēng","iong":"iōng" };
    const clean = map[it.sound] || it.sound;
    speak(clean, "zh-CN", { rate: 0.8, pitch: 1.0 });
  }
  // 诗词朗读：Web Speech + zh-CN 标准女声，rate 0.9、音调中性、音量 0.9，适合小朋友听
  function speakPoem(text) { speak(text, "zh-CN", { rate: 0.9, pitch: 1.0 }); }
  // 英文单词/对话：本机时慢速+正常双读；配置了豆包TTS(Olivia)时单遍即可（云端音质已足够自然）
  function speakEn(text) {

    if (ttsUrl) { speak(text, "en-US", { pitch: 1.1 }); return; }

  // 归一化：去标点、空格，英文转小写

    const isEn = /^[a-z0-9 ]+$/.test(e);

      const ew = e.split(/[^a-z0-9]+/).filter(Boolean);
      if (!ew.length) return 0;
      let hit = 0;
      ew.forEach((w) => { if (tw.indexOf(w) >= 0) hit++; });
      return hit / ew.length;
    }

    for (const ch of e) if (t.indexOf(ch) >= 0) hit++;

        rec.interimResults = false;
        rec.maxAlternatives = 3;
        rec.continuous = false;
        let finalTrans = "";
        rec.onresult = (ev) => {
          for (let i = 0; i < ev.results.length; i++) {
            finalTrans += ev.results[i][0].transcript;
          }
        };
        rec.onerror = () => { resolve({ ok: false, score: 0, transcript: finalTrans, error: true }); };
        rec.onend = () => {
          const score = expected ? similarity(finalTrans, expected) : 1;
          resolve({ ok: score >= (threshold || 0.6), score: score, transcript: finalTrans });
        };
        rec.start();
        setTimeout(() => { try { rec.stop(); } catch (e) {} }, durationMs || 6000);
      } catch (e) {
        resolve({ ok: false, unsupported: true, score: 0, transcript: "" });
      }

  }

  // handlers: { onStart, onPartial(txt, finalTxt), onFinal(res) }  res={unsupported, transcript}
  let _recInst = null, _recFinal = "", _recOnStart = null, _recOnPartial = null, _recOnFinal = null;
  function recognitionStart(lang, handlers) {
    handlers = handlers || {};
    _recOnStart = handlers.onStart || null;
    _recOnPartial = handlers.onPartial || null;
    _recOnFinal = handlers.onFinal || null;
    return new Promise((resolve) => {
      if (!SR) { resolve({ unsupported: true, transcript: "" }); return; }
      try {
        const r = new SR();
        r.lang = lang || "zh-CN";
        r.interimResults = true;
        r.continuous = true;
        r.maxAlternatives = 1;
        _recFinal = "";
        r.onresult = (ev) => {
          let interim = "", finalNow = "";
          for (let i = ev.resultIndex; i < ev.results.length; i++) {

            if (res.isFinal) finalNow += res[0].transcript;
            else interim += res[0].transcript;
          }

          if (_recOnPartial) _recOnPartial((_recFinal + interim).trim(), _recFinal.trim());

        r.onerror = () => { /* 不在此 reject，交给 onend 收尾 */ };
        r.onend = () => {

          if (_recOnFinal) _recOnFinal({ unsupported: false, transcript: finalText });

        _recInst = r;
        if (_recOnStart) _recOnStart();
      } catch (e) {

        resolve({ unsupported: true, transcript: "" });

  function recognitionStop() { if (_recInst) { try { _recInst.stop(); } catch (e) {} } }

  function recordSupported() {
    return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && (window.MediaRecorder));
  }

  // 用法：makeRecorder().then(rec => { ... rec.stop().then(({url})=>{...}) })
  function makeRecorder() {
    return new Promise((resolve, reject) => {
      if (!recordSupported()) { reject(new Error("unsupported")); return; }
      navigator.mediaDevices.getUserMedia({ audio: true }).then((stream) => {
        let mr;
        try { mr = new MediaRecorder(stream); } catch (e) { stream.getTracks().forEach((t) => t.stop()); reject(e); return; }

        mr.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };

                stream.getTracks().forEach((t) => t.stop());

        resolve(api);
      }).catch(() => reject(new Error("unsupported")));
    });

<script>
/* =========================================================

window.Modules = (function () {

  /* ---------- 通用：词库/各模块缓存失效 ----------

     任意数据变化（加词/加字/背诗/读绘本/绘画/游戏/打卡…）都会使“非当前模块”的

     onAdded/render 回调原地刷新。此处保留空函数仅为兼容既有调用点。 */
  function notifyBankChange() { /* 缓存失效已在 app.js 统一处理，无需在此操作 */ }

  /* ---------- 通用：朗读评分小组件 ---------- */
  function readWidget(parent, opts) {
    opts = opts || {};

  /* ---------- 通用：长按弹窗（加入词库） ----------
     加入移动容差，避免孩子手指轻微滑动就取消长按 ---------- */
  function attachLongPress(el, handler) {
    let timer = null, startX = 0, startY = 0, startTime = 0, longFired = false;
    const LONG_MS = 500, MOVE_TOL = 10;
    function clear() {
      if (timer) { clearTimeout(timer); timer = null; }
    }
    function start(x, y) {
      longFired = false; startX = x; startY = y; startTime = Date.now();
      timer = setTimeout(() => { longFired = true; handler(startX, startY); }, LONG_MS);
    }
    function move(x, y) {
      if (!timer) return;
      if (Math.hypot(x - startX, y - startY) > MOVE_TOL) clear();
    }
    el.addEventListener("contextmenu", (e) => { e.preventDefault(); handler(e.clientX, e.clientY); });
    el.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      start(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener("touchmove", (e) => {
      if (!timer) return;
      const t = e.touches[0];
      move(t.clientX, t.clientY);
    }, { passive: true });
    el.addEventListener("touchend", () => { clear(); });
    el.addEventListener("touchcancel", () => { clear(); });
    // 桌面端鼠标也支持长按
    el.addEventListener("mousedown", (e) => { if (e.button === 0) start(e.clientX, e.clientY); });
    el.addEventListener("mousemove", (e) => { if (timer) move(e.clientX, e.clientY); });
    el.addEventListener("mouseup", () => { clear(); });
    el.addEventListener("mouseleave", () => { clear(); });
    // 长按触发后，阻止紧随其后的 click 误关弹窗
    el.addEventListener("click", (e) => { if (longFired) { longFired = false; e.stopPropagation(); } });
  }
  function wordPopup(char, py, mean, kind, x, y, onAdded) {
    document.querySelectorAll(".ctx-menu").forEach((n) => n.remove());
    const m = document.createElement("div");
    m.className = "ctx-menu";
    const label = kind === "en" ? `「${esc(char)}」已经学会！我要加入词库！` : `「${esc(char)}」已经学会！我要加入词库！`;
    m.innerHTML = `<div class="cm-emoji">${kind === "en" ? "🔤" : "🌟"}</div>
      <div class="cm-text">${label}</div>
      <div style="font-size:13px;color:#8a6a78">${esc(py || "")} ${esc(mean || "")}</div>
      <button class="btn btn-primary btn-sm" style="margin-top:8px">确定！</button>`;
    m.style.left = Math.min(x, window.innerWidth - 240) + "px";
    m.style.top = Math.min(y, window.innerHeight - 160) + "px";
    document.body.appendChild(m);
    m.querySelector("button").addEventListener("click", () => {
      let added;
      if (kind === "en") added = S.addEN(char, mean, "🔤");
      else added = S.addCN(char, py, mean);
      m.remove();
      // 实时同步：新增后清除相关模块缓存，词库/识字/英语/诗词等下次访问即刷新
      notifyBankChange();
      window.App && window.App.toast(added ? "加入词库啦！📚" : "已经添加过咯！试试其他的吧~");
      if (onAdded) onAdded(added);
    });
    setTimeout(() => { const close = (e) => { if (!m.contains(e.target)) { m.remove(); document.removeEventListener("click", close); } }; document.addEventListener("click", close); }, 0);
  }

  /* ---------- 通用：判断汉字 / 取单字信息（拼音+释义） ---------- */
  function isCJK(ch) { return /[一-鿿]/.test(ch); }
  function getCharInfo(ch) {
    let py = "";
    try { if (window.pinyinPro) py = window.pinyinPro(ch, { type: "array", toneType: "symbol", nonZh: "removed" })[0] || ""; } catch (e) {}
    const mean = (window.Data && window.Data.COMMON_MEAN && window.Data.COMMON_MEAN[ch]) || "";
    return { py: py, mean: mean };
  }

  /* 通用：把一段文字渲染成「汉字带拼音」的标注（每个 CJK 字上方显示拼音） */
  function charRuby(text, hl) {
    if (!text) return "";
    let out = "";
    const arr = Array.from(text);
    for (const ch of arr) {
      if (isCJK(ch)) {
        let py = "";
        try { if (window.pinyinPro) py = window.pinyinPro(ch, { type: "array", toneType: "symbol", nonZh: "removed" })[0] || ""; } catch (e) {}
        out += `<span class="chr${hl ? " hl" : ""}" data-ch="${esc(ch)}"><span class="py">${esc(py)}</span>${esc(ch)}</span>`;
      } else {
        out += `<span class="punc">${esc(ch)}</span>`;
      }
    }
    return out;
  }

  /* ---------- 通用：录音组件（跟读 / 对话回答） ---------- */
  function attachRecorder(parent, opts) {
    opts = opts || {};
    const wrap = document.createElement("div");
    wrap.style.marginTop = "8px";
    parent.appendChild(wrap);
    const recBtn = document.createElement("button");
    recBtn.className = "btn btn-sm";
    recBtn.textContent = "🎤 " + (opts.label || "跟读");
    const status = document.createElement("span");
    status.className = "read-status";
    wrap.appendChild(recBtn);
    wrap.appendChild(status);

    let rec = null, autoTimer = null, playBtn = null;
    function clearPlayback() { if (playBtn) { playBtn.remove(); playBtn = null; } }

    recBtn.addEventListener("click", () => {
      if (rec) {
        clearTimeout(autoTimer);
        const api = rec; rec = null;
        api.stop().then((r) => onStopped(r));
      } else {
        if (opts.prompt) A.speak(opts.prompt, opts.lang || "en-US");

          rec = api;
          recBtn.textContent = "⏹ 停止";

        }).catch(() => {
          status.innerHTML = '<span class="feedback warn">设备不支持录音，点「我读完啦」确认即可</span>';
          if (opts.fallback) opts.onStop && opts.onStop("", "");
        });
      }
    });

    function onStopped(r) {
      recBtn.textContent = "🎤 重录";
      clearPlayback();
      playBtn = document.createElement("button");
      playBtn.className = "btn btn-sm btn-mint";
      playBtn.textContent = "🔊 我的录音";
      playBtn.style.marginLeft = "8px";
      const audio = new Audio(r.url);
      audio.preload = "none";
      playBtn.addEventListener("click", () => audio.play());
      wrap.appendChild(playBtn);
      status.innerHTML = "";
      if (opts.recognize === false) { opts.onStop && opts.onStop(r.url, ""); return; }

        }).catch(() => {

        });

      }
    }
  }

  // 跟读按钮：单按钮切换（点击先朗读目标词，再开始录音/识别；再点停止并给出反馈）
  // 修复：移动端识别实例可能未真正启动（mode 卡在 rec 但 _recInst 为空），
  //       导致“停止”点击无效、一直转圈。现统一用 finished 状态机 + recognitionActive() 兜底，
  //       并在停止时 A.stop() 停掉正在朗读的语音，确保任意情况下都能一键停止并复位。
  function wireShadow(recBtn, recStat, w) {
    // finished=true 表示“当前空闲（未开始/已结束），可重新开始”
    let rec = null, autoTimer = null, mode = null, finished = true;
    function resetBtn(txt) {
      recBtn.textContent = txt; recBtn.classList.remove("rec-on");
    }
    function forceStop() {
      finished = true;
      clearTimeout(autoTimer); autoTimer = null;
      if (mode === "rec") { try { A.recognitionStop(); } catch (e) {} }
      else if (mode === "mic") { const a = rec; rec = null; if (a) { try { a.stop(); } catch (e) {} } }
      // 兜底：识别实例仍在（例如移动端已启动但未回调），强制停止并复位
      if (A.recognitionActive && A.recognitionActive()) { try { A.recognitionStop(); } catch (e) {} }
      // 停掉可能仍在朗读的语音
      if (A.stop && A.isSpeaking && A.isSpeaking()) { try { A.stop(); } catch (e) {} }
      done("");
    }
    recBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!finished) { forceStop(); return; } // 进行中 → 停止（任意模式、任意状态都能停）
      // 空闲 → 开始：先朗读目标词，再开始听孩子读
      finished = false; mode = A.recognitionSupported ? "rec" : "mic";
      A.speak(w.en, "en-US");
      recBtn.textContent = "⏹ 停止"; recBtn.classList.add("rec-on");
      recStat.textContent = "听你说…";
      if (mode === "rec") {
        autoTimer = setTimeout(() => { if (!finished) forceStop(); }, 9000);
        A.recognitionStart("en-US", {
          onPartial: (txt) => { recStat.textContent = "我听到：" + (txt || "…"); },
          onFinal: (res) => { if (!finished) { clearTimeout(autoTimer); finished = true; done(res && res.transcript); } }
        }).catch(() => { if (!finished) { finished = true; resetBtn("🎤 再读一次"); recStat.textContent = "设备不支持语音识别哦～"; } });
      } else {
        A.makeRecorder().then((api) => {
          if (finished || mode !== "mic") return;
          rec = api;
          autoTimer = setTimeout(() => { if (!finished) forceStop(); }, 6000);
        }).catch(() => {
          if (finished) return;

        });

    });

      const target = w.en.toLowerCase().replace(/[^a-z ]/g, "").trim();
      if (t && t.indexOf(target) >= 0) {
        recStat.textContent = "你读的是：" + transcript + " ✅ 读得真棒！";
        window.App && window.App.toast("跟读得很标准！🌟");
        A.speak("Great job!", "en-US");
      } else if (transcript) {
        recStat.textContent = "你读的是：" + transcript + " 💪 再试一次会更好！";
        window.App && window.App.toast("再试一次，你可以的！💪");
      } else {
        recStat.textContent = "跟读完成！真棒 🌟";
        window.App && window.App.toast("跟读完成！真棒 🌟");
      }
    }
  }

  /* =========================================================
     1) 拼音
     ========================================================= */
  function pinyin(container) {
    container.innerHTML = `
      <div class="module-title">🅿️ 拼音乐园</div>

        <div style="font-weight:800;color:var(--pink-600);margin-bottom:8px">声母（b p m f…）</div>

      </div>
      <div class="card">
        <div style="font-weight:800;color:var(--pink-600);margin-bottom:8px">韵母（a o e…）</div>
        <div class="alpha-grid" id="finGrid"></div>
      </div>
      <div class="card">
        <div style="font-weight:800;color:var(--pink-600);margin-bottom:8px">🎮 拼音组合游戏</div>
        <div class="module-sub">下面有 4 个字母方块，点一点正确的字母，按顺序拼出拼音，拼对就会出现一个字和图哦！</div>
        <div class="tile-row" id="pinyinTiles"></div>
        <div id="pinyinTarget" style="font-size:22px;font-weight:800;color:var(--purple);min-height:30px;margin:6px 0"></div>
        <div id="pinyinResult"></div>
        <button class="btn btn-ghost btn-sm" id="pinyinReset" style="margin-top:8px">🔄 换一个</button>
      </div>`;
    const ini = container.querySelector("#iniGrid");
    D.PINYIN_INITIALS.forEach((it) => {
      const c = document.createElement("div");
      c.className = "alpha-cell";
      c.innerHTML = `${esc(it.s)}<div class="alpha-label">${esc(it.ex)}</div>`;
      // 用中文例字发音，避免拉丁字母被读成英语
      c.addEventListener("click", () => A.speakPinyin(it.ex));
      ini.appendChild(c);
    });
    const fin = container.querySelector("#finGrid");
    D.PINYIN_FINALS.forEach((it) => {
      const c = document.createElement("div");
      c.className = "alpha-cell";
      c.innerHTML = `${esc(it.s)}<div class="alpha-label">${esc(it.ex)}</div>`;
      // 后鼻音韵母(ang/eng/ing/ong…)用 speakFinal 纠正发音
      c.addEventListener("click", () => A.speakFinal(it));
      fin.appendChild(c);
    });

    const target = container.querySelector("#pinyinTarget");
    const result = container.querySelector("#pinyinResult");
    const tilesEl = container.querySelector("#pinyinTiles");
    let pOffset = 0;
    function nextCombo() { return D.PINYIN_COMBOS[S.dailyIndex(D.PINYIN_COMBOS.length, pOffset++)]; }
    let combo = nextCombo();
    let picked = [];

    // 去声调：把带调字母还原成基础字母（用于拼字判定）
    function stripTone(s) {
      return (s || "")
        .replace(/[āáǎà]/g, "a").replace(/[ōóǒò]/g, "o").replace(/[ēéěè]/g, "e")
        .replace(/[īíǐì]/g, "i").replace(/[ūúǔù]/g, "u").replace(/[ǖǘǚǜü]/g, "ü")
        .replace(/[ḿ]/g, "m").replace(/[ńňǹ]/g, "n");
    }

    function renderTiles() {
      tilesEl.innerHTML = "";
      const targetLetters = stripTone(combo.combo).split("");
      // 用「目标字母 + 干扰字母」凑成 4 个方块，打乱顺序
      const pool = ["b","p","m","f","d","t","n","l","g","k","h","j","q","x","z","c","s","y","w","a","o","e","i","u","ü"];
      const used = new Set(targetLetters);
      const distract = [];
      const need = 4 - targetLetters.length;
      for (const L of pool) {
        if (distract.length >= need) break;
        if (used.has(L)) continue;
        distract.push(L); used.add(L);
      }
      const all = targetLetters.concat(distract).sort(() => Math.random() - 0.5);
      all.forEach((L) => {
        const t = document.createElement("div");
        t.className = "tile"; t.textContent = L; t.dataset.l = L;
        t.addEventListener("click", () => {
          if (t.classList.contains("sel")) return;
          if (picked.length >= targetLetters.length) return;
          picked.push(L);
          t.classList.add("sel"); t.style.pointerEvents = "none";
          target.textContent = picked.join(" ");
          if (picked.length === targetLetters.length) checkCombo();
        });
        tilesEl.appendChild(t);
      });
    }
    function checkCombo() {
      const got = picked.join("").toLowerCase();
      const want = stripTone(combo.combo).toLowerCase();
      if (got === want) {
        A.speakPinyin(combo.word);
        result.innerHTML = `<div class="feedback ok">拼对啦！你拼出了「${esc(combo.combo)}」→ ${esc(combo.char)} ${esc(combo.emoji)}（${esc(combo.word)}）🎉</div>
          <div class="py-result"><div class="py-result-emoji">${esc(combo.emoji)}</div><div class="py-result-char">${esc(combo.char)}</div><div class="py-result-word">${esc(combo.word)}</div></div>
          <div class="py-hint">💡 拼读一下吧，小公主～</div>`;
        A.speak("拼读一下吧，小公主", "zh-CN");
        setTimeout(() => A.speakPinyin(combo.char), 1300);
        setTimeout(() => A.speakPinyin(combo.word), 2700);
        setTimeout(() => { combo = nextCombo(); picked = []; target.textContent = ""; result.innerHTML = ""; renderTiles(); }, 5200);
      } else {
        result.innerHTML = `<div class="feedback warn">再试试看～ 要拼成「${esc(want)}」哦</div>`;
        setTimeout(() => { picked = []; target.textContent = ""; result.innerHTML = ""; renderTiles(); }, 1500);
      }
    }
    container.querySelector("#pinyinReset").addEventListener("click", () => {
      combo = nextCombo(); picked = []; target.textContent = ""; result.innerHTML = ""; renderTiles();
    });
    renderTiles();
  }

  /* =========================================================
     2) 识字
     ========================================================= */
  function shizi(container) {

    container.innerHTML = `

        </div>
        <div id="storyReadArea"></div>
      </div>

        <div style="font-weight:800;color:var(--pink-600);margin-bottom:6px">🎤 自读打分</div>

        <div id="storySelf"></div>
      </div>
      <div class="card">
        <div style="font-weight:800;color:var(--pink-600);margin-bottom:6px">🎮 文字小游戏</div>
        <div class="module-sub">左边是今天的新字，右边是打乱的拼音。先点一个字，再点对应的拼音连起来，全对就收获一朵小花！</div>
        <div class="match-wrap" id="matchWrap"></div>
        <div id="matchResult"></div>
      </div>`;

    // 渲染故事：每个汉字都可点读（单击朗读）、双击/长按加入词库（含非新字）
    const storyText = container.querySelector("#storyText");
    const charMap = {};
    story.newChars.forEach((c) => { charMap[c.char] = c; });
    // 先把多字「新词」整体标为高亮，其余逐字包成可交互 span
    const newReSrc = story.newChars.map((c) => c.char.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("|");
    const newRe = newReSrc ? new RegExp("(" + newReSrc + ")", "g") : null;
    const parts = [];
    const text = story.text;
    if (newRe) {
      let last = 0, m;
      while ((m = newRe.exec(text)) !== null) {
        if (m.index > last) parts.push({ t: text.slice(last, m.index), hl: false });
        parts.push({ t: m[0], hl: true });
        last = m.index + m[0].length;
      }
      if (last < text.length) parts.push({ t: text.slice(last), hl: false });
    } else {
      parts.push({ t: text, hl: false });
    }
    let html = "";
    parts.forEach((part) => { html += charRuby(part.t, part.hl); });
    storyText.innerHTML = html;
    const inBank = new Set(S.getCN().map((x) => x.char));
    storyText.querySelectorAll(".chr").forEach((sp) => {
      const ch = sp.dataset.ch;
      if (inBank.has(ch)) sp.classList.add("done-added");
      sp.addEventListener("click", () => A.speak(ch, "zh-CN"));
      sp.addEventListener("dblclick", (e) => { e.preventDefault(); addCharToBank(ch, e.clientX, e.clientY); });
      attachLongPress(sp, (x, y) => addCharToBank(ch, x, y));
    });
    function addCharToBank(ch, x, y) {
      const info = charMap[ch] || getCharInfo(ch);
      wordPopup(ch, info.py, info.mean, "cn", x || 120, y || 120, (added) => {
        if (added) storyText.querySelectorAll(".chr").forEach((sp) => { if (sp.dataset.ch === ch) sp.classList.add("done-added"); });
      });
    }
    container.querySelector("#storyRead").addEventListener("click", () => A.speak(story.text, "zh-CN"));

    // 自读
    let selfDone = false;
    readWidget(container.querySelector("#storySelf"), {
      buttonLabel: "🎤 开始自读", lang: "zh-CN", dur: 16000, expected: story.text, threshold: 0.6,
      onResult: (r) => {
        if ((r.ok || r.manual) && !selfDone) { selfDone = true; S.addFlowers(2, "自读故事"); window.App && window.App.toast("自读完成任务！+2 🌺"); }
      }
    });

    // 文字小游戏
    const matchWrap = container.querySelector("#matchWrap");
    const matchResult = container.querySelector("#matchResult");
    const leftChars = story.newChars.slice(0, 5);
    const rightPy = leftChars.map((c) => c.py).sort(() => Math.random() - 0.5);
    let picked = null;
    const leftCol = document.createElement("div"); leftCol.className = "match-col";
    const rightCol = document.createElement("div"); rightCol.className = "match-col";
    leftChars.forEach((c) => {
      const it = document.createElement("div");
      it.className = "match-item"; it.textContent = c.char; it.dataset.py = c.py;
      it.addEventListener("click", () => {
        if (it.classList.contains("done-ok")) return;
        document.querySelectorAll(".match-item.picked").forEach((n) => n.classList.remove("picked"));
        it.classList.add("picked"); picked = it;
      });
      leftCol.appendChild(it);
    });
    rightPy.forEach((py) => {
      const it = document.createElement("div");
      it.className = "match-item"; it.textContent = py; it.dataset.py = py;
      it.addEventListener("click", () => {
        if (!picked) { window.App && window.App.toast("先点左边的字哦～"); return; }
        if (it.dataset.py === picked.dataset.py) {
          it.classList.add("done-ok"); it.innerHTML = esc(py) + '<span class="mk">✅</span>';
          picked.classList.add("done-ok"); picked.classList.remove("picked");
          const done = leftCol.querySelectorAll(".done-ok").length;
          if (done === leftChars.length) {
            matchResult.innerHTML = `<div class="feedback ok">你真棒！收获一朵小花！🌸</div>`;
            S.addFlowers(1, "文字游戏");
          }
          picked = null;
        } else {
          it.classList.add("done-bad"); it.innerHTML = esc(py) + '<span class="mk">❌</span>';
          setTimeout(() => { it.classList.remove("done-bad"); it.innerHTML = esc(py); }, 800);
          picked.classList.remove("picked"); picked = null;
        }
      });
      rightCol.appendChild(it);
    });
    matchWrap.appendChild(leftCol); matchWrap.appendChild(rightCol);
  }
